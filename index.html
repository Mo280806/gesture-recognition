<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻量手势识别</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; color: white; font-family: Arial; display: flex; }
        
        .video-container { flex: 3; position: relative; height: 100vh; }
        video, canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { pointer-events: none; }
        
        .action-panel { flex: 1; background: #222; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .action-title { font-size: 24px; margin-bottom: 30px; color: #0f0; }
        .action-icon { font-size: 80px; margin-bottom: 20px; }
        .action-name { font-size: 32px; font-weight: bold; }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="video-container">
        <video autoplay playsinline id="video"></video>
        <canvas id="canvas"></canvas>
        <div class="loading" id="loading">正在加载模型，请稍候...</div>
    </div>

    <div class="action-panel">
        <div class="action-title">当前动作</div>
        <div class="action-icon" id="action-icon">🤚</div>
        <div class="action-name" id="action-name">等待识别</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loadingText = document.getElementById('loading');
        const actionIcon = document.getElementById('action-icon');
        const actionName = document.getElementById('action-name');
        let model;

        // 加载模型
        async function loadModel() {
            model = await handpose.load();
            loadingText.style.display = 'none';
            startCamera();
        }

        // 打开摄像头
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    video.play();
                    detectFrame();
                };
            } catch (err) {
                loadingText.innerText = "摄像头权限被拒绝！";
                console.error(err);
            }
        }

        // 实时检测
        async function detectFrame() {
            if (model && video.readyState === 4) {
                const predictions = await model.estimateHands(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                if (predictions.length > 0) {
                    const landmarks = predictions[0].landmarks;
                    drawHand(ctx, landmarks);
                    const gesture = recognizeGesture(landmarks);
                    actionIcon.innerText = gesture.icon;
                    actionName.innerText = gesture.name;
                } else {
                    actionIcon.innerText = "🤚";
                    actionName.innerText = "未检测到手";
                }
            }
            requestAnimationFrame(detectFrame);
        }

        // 绘制手部骨架
        function drawHand(ctx, landmarks) {
            landmarks.forEach((point, index) => {
                ctx.beginPath();
                ctx.arc(point[0], point[1], 5, 0, 2 * Math.PI);
                ctx.fillStyle = "#FF0000";
                ctx.fill();
            });

            const connections = [
                [0,1],[1,2],[2,3],[3,4],
                [0,5],[5,6],[6,7],[7,8],
                [0,9],[9,10],[10,11],[11,12],
                [0,13],[13,14],[14,15],[15,16],
                [0,17],[17,18],[18,19],[19,20],
                [5,9],[9,13],[13,17]
            ];
            ctx.strokeStyle = "#00FF00";
            ctx.lineWidth = 3;
            connections.forEach(([start, end]) => {
                ctx.beginPath();
                ctx.moveTo(landmarks[start][0], landmarks[start][1]);
                ctx.lineTo(landmarks[end][0], landmarks[end][1]);
                ctx.stroke();
            });
        }

        // 手势识别逻辑
        function recognizeGesture(landmarks) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];

            const indexUp = indexTip[1] < landmarks[6][1];
            const middleUp = middleTip[1] < landmarks[10][1];
            const ringUp = ringTip[1] < landmarks[14][1];
            const pinkyUp = pinkyTip[1] < landmarks[18][1];
            const thumbUp = thumbTip[0] < landmarks[3][0];

            const totalUp = [indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length;

            if (totalUp >= 4 && thumbUp) return { icon: "✋", name: "手掌张开" };
            if (totalUp === 0 && !thumbUp) return { icon: "✊", name: "握拳" };
            if (indexUp && middleUp && !ringUp && !pinkyUp) return { icon: "✌️", name: "剪刀手" };
            if (thumbUp && !indexUp && !middleUp && !ringUp && !pinkyUp) return { icon: "👍", name: "点赞" };
            return { icon: "🤚", name: "手势识别中" };
        }

        // 启动
        loadModel();
    </script>
</body>
</html>
