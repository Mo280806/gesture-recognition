<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能手势体感控制</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: #080810;
            color: #fff;
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            body { flex-direction: row; }
        }

        @media (max-width: 767px) {
            body { flex-direction: column; }
            .video-container { height: 60vh; }
            .action-panel { height: 40vh; padding: 20px; gap: 12px; }
            .action-icon { font-size: 60px; }
            .action-title { font-size: 20px; }
            .action-name { font-size: 24px; }
        }

        .video-container {
            flex: 3;
            position: relative;
            height: 100vh;
            padding: 12px;
        }

        .camera-frame {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid rgba(0, 220, 255, 0.3);
            box-shadow: 0 0 40px rgba(0,180,255,0.15), inset 0 0 30px rgba(0,0,0,0.4);
            background: #000;
            position: relative;
        }

        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            pointer-events: none;
        }

        .action-panel {
            flex: 1;
            background: linear-gradient(180deg, #121218, #0c0c14);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            border-left: 1px solid #252535;
        }

        .action-title {
            font-size: 28px;
            color: #00dcff;
            text-shadow: 0 0 12px rgba(0,220,255,0.4);
            letter-spacing: 1px;
        }

        .action-icon {
            font-size: 100px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
            min-height: 110px;
        }

        .action-name {
            font-size: 36px;
            font-weight: bold;
            color: #f0f0f5;
            text-align: center;
            text-shadow: 0 0 10px rgba(255,255,255,0.15);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 24px 36px;
            border-radius: 14px;
            text-align: center;
            font-size: 17px;
            z-index: 999;
            border: 1px solid #334;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <div class="camera-frame">
            <video autoplay playsinline muted id="video"></video>
            <canvas id="canvas"></canvas>
        </div>
        <div class="loading" id="loading">正在加载AI模型...</div>
    </div>

    <div class="action-panel">
        <div class="action-title">🤖 实时手势识别</div>
        <div class="action-icon" id="action-icon">🤚</div>
        <div class="action-name" id="action-name">等待识别</div>
    </div>

   <script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const loading = document.getElementById('loading');
const actionIcon = document.getElementById('action-icon');
const actionName = document.getElementById('action-name');

let model = null;

let lastGesture = "";
let stableCount = 0;

const STABLE_THRESHOLD = 4;

async function init() {

    // 必须 HTTPS
    if (
        location.protocol !== 'https:' &&
        location.hostname !== 'localhost'
    ) {
        loading.innerText = "请使用 HTTPS 或 localhost 打开";
        return;
    }

    try {

        await tf.setBackend('webgl');
        await tf.ready();

        model = await handpose.load();

        loading.innerText = "正在启动摄像头...";

        await startCamera();

        loading.style.display = 'none';

        detectLoop();

    } catch (err) {

        console.error(err);

        loading.innerText = "模型加载失败";
    }
}

async function startCamera() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 640 },
                height: { ideal: 480 }
            },
            audio: false
        });

        video.srcObject = stream;

        return new Promise(resolve => {

            video.onloadedmetadata = () => {

                video.play();

                resizeCanvas();

                resolve();
            };

        });

    } catch (err) {

        console.error(err);

        loading.innerText = "请允许摄像头权限";
    }
}

function resizeCanvas() {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
}

window.addEventListener('resize', resizeCanvas);

async function detectLoop() {

    if (!model) {
        requestAnimationFrame(detectLoop);
        return;
    }

    try {

        const predictions = await model.estimateHands(video);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (predictions.length > 0) {

            const lm = predictions[0].landmarks;

            drawHand(lm);

            const gesture = recognizeGesture(lm);

            if (gesture.name === lastGesture) {
                stableCount++;
            } else {
                stableCount = 0;
                lastGesture = gesture.name;
            }

            if (stableCount >= STABLE_THRESHOLD) {

                actionIcon.innerText = gesture.icon;
                actionName.innerText = gesture.name;
            }

        } else {

            stableCount = 0;

            actionIcon.innerText = "🤚";
            actionName.innerText = "未检测到手";
        }

    } catch (err) {

        console.error(err);
    }

    requestAnimationFrame(detectLoop);
}

function drawHand(points) {

    ctx.fillStyle = "#ff4060";

    for (const p of points) {

        ctx.beginPath();
        ctx.arc(p[0], p[1], 4, 0, Math.PI * 2);
        ctx.fill();
    }

    const connections = [
        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20]
    ];

    ctx.strokeStyle = "#00ffd0";
    ctx.lineWidth = 2;

    for (const [a,b] of connections) {

        ctx.beginPath();
        ctx.moveTo(points[a][0], points[a][1]);
        ctx.lineTo(points[b][0], points[b][1]);
        ctx.stroke();
    }
}

function distance(a, b) {

    return Math.hypot(
        a[0] - b[0],
        a[1] - b[1]
    );
}

// 判断手指是否伸直（真正有效）
function isFingerUp(tip, pip, wrist) {

    return tip[1] < pip[1] &&
           pip[1] < wrist[1];
}

function recognizeGesture(lm) {

    const wrist = lm[0];

    const thumbUp =
        lm[4][0] < lm[3][0];

    const indexUp = isFingerUp(lm[8], lm[6], wrist);
    const middleUp = isFingerUp(lm[12], lm[10], wrist);
    const ringUp = isFingerUp(lm[16], lm[14], wrist);
    const pinkyUp = isFingerUp(lm[20], lm[18], wrist);

    const thumbIndexNear =
        distance(lm[4], lm[8]) < 40;

    // OK
    if (
        thumbIndexNear &&
        middleUp &&
        ringUp &&
        pinkyUp
    ) {
        return {
            icon: "👌",
            name: "OK手势"
        };
    }

    // 🤘
    if (
        thumbUp &&
        indexUp &&
        !middleUp &&
        !ringUp &&
        pinkyUp
    ) {
        return {
            icon: "🤘",
            name: "摇滚手势"
        };
    }

    // 👍
    if (
        thumbUp &&
        !indexUp &&
        !middleUp &&
        !ringUp &&
        !pinkyUp
    ) {
        return {
            icon: "👍",
            name: "点赞"
        };
    }

    // 🤙
    if (
        thumbUp &&
        !indexUp &&
        !middleUp &&
        !ringUp &&
        pinkyUp
    ) {
        return {
            icon: "🤙",
            name: "打电话"
        };
    }

    // ✊
    if (
        !thumbUp &&
        !indexUp &&
        !middleUp &&
        !ringUp &&
        !pinkyUp
    ) {
        return {
            icon: "✊",
            name: "握拳"
        };
    }

    // ☝️
    if (
        indexUp &&
        !middleUp &&
        !ringUp &&
        !pinkyUp
    ) {
        return {
            icon: "☝️",
            name: "数字1"
        };
    }

    // ✌️
    if (
        indexUp &&
        middleUp &&
        !ringUp &&
        !pinkyUp
    ) {
        return {
            icon: "✌️",
            name: "数字2"
        };
    }

    // 3
    if (
        indexUp &&
        middleUp &&
        ringUp &&
        !pinkyUp
    ) {
        return {
            icon: "🖖",
            name: "数字3"
        };
    }

    // 4
    if (
        indexUp &&
        middleUp &&
        ringUp &&
        pinkyUp &&
        !thumbUp
    ) {
        return {
            icon: "🖐️",
            name: "数字4"
        };
    }

    // 5
    if (
        thumbUp &&
        indexUp &&
        middleUp &&
        ringUp &&
        pinkyUp
    ) {
        return {
            icon: "✋",
            name: "数字5"
        };
    }

    return {
        icon: "🤚",
        name: "识别中"
    };
}

init();
</script>
</body>
</html>
