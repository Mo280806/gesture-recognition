<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 手势交互系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:#ffffff;

    color:#163a63;

    height:100vh;

    overflow:hidden;
}

/* 主容器 */

.container{

    width:100%;

    height:100vh;

    display:flex;

    flex-direction:column;
}

/* 顶部 */

.topbar{

    height:72px;

    border-bottom:1px solid #dbe5f0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 24px;

    background:white;

    z-index:100;
}

.logo{

    font-size:22px;

    font-weight:700;

    color:#163a63;
}

.mode-buttons{

    display:flex;

    gap:12px;
}

.mode-btn{

    border:none;

    background:#edf3fa;

    color:#163a63;

    padding:10px 18px;

    border-radius:12px;

    cursor:pointer;

    transition:0.2s;

    font-size:14px;
}

.mode-btn.active{

    background:#163a63;

    color:white;
}

/* 页面 */

.page{

    flex:1;

    position:relative;

    overflow:hidden;
}

/* ====================== */
/* 手势识别模式 */
/* ====================== */

#recognitionPage{

    display:flex;

    flex-direction:column;

    padding:18px;

    gap:18px;
}

.camera-card{

    flex:1;

    position:relative;

    border-radius:24px;

    overflow:hidden;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    box-shadow:
    0 10px 30px rgba(22,58,99,0.08);
}

video,
canvas{

    position:absolute;

    width:100%;

    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

canvas{

    pointer-events:none;
}

.header{

    position:absolute;

    top:18px;

    left:20px;

    z-index:10;
}

.title{

    font-size:18px;

    font-weight:600;
}

.subtitle{

    margin-top:4px;

    font-size:13px;

    color:#6f8298;
}

#startBtn{

    position:absolute;

    top:18px;

    right:18px;

    z-index:20;

    border:none;

    background:#163a63;

    color:white;

    padding:10px 16px;

    border-radius:12px;

    cursor:pointer;
}

.loading{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:white;

    padding:14px 20px;

    border-radius:14px;

    border:1px solid #dbe5f0;

    z-index:30;
}

.result-card{

    height:120px;

    border-radius:22px;

    background:#f8fafc;

    border:1px solid #dbe5f0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;
}

.result-text{

    font-size:28px;

    font-weight:700;
}

.result-desc{

    margin-top:8px;

    font-size:13px;

    color:#8091a5;
}

/* ====================== */
/* 操控模式 */
/* ====================== */

#controlPage{

    display:none;

    width:100%;

    height:100%;

    position:relative;

    background:#ffffff;
}

/* 小摄像头 */

.mini-camera{

    position:absolute;

    top:20px;

    left:20px;

    width:260px;

    height:180px;

    border-radius:18px;

    overflow:hidden;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    box-shadow:
    0 8px 24px rgba(22,58,99,0.12);

    z-index:50;
}

.mini-camera video,
.mini-camera canvas{

    position:absolute;

    width:100%;

    height:100%;
}

/* 引导区 */

.guide{

    width:100%;

    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:24px;

    transition:0.3s;
}

.guide-title{

    font-size:42px;

    font-weight:700;

    color:#163a63;

    transition:0.3s;
}

.guide-text{

    font-size:18px;

    color:#6f8298;

    transition:0.3s;
}

/* 点赞特效 */

.like-effect{

    position:absolute;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    font-size:120px;

    opacity:0;

    pointer-events:none;

    transition:0.5s;

    z-index:999;
}

.like-effect.show{

    opacity:1;

    transform:
    translate(-50%,-50%)
    scale(1.2);
}

/* 平移动画 */

.move-left{

    transform:
    translateX(-120px);
}

.move-right{

    transform:
    translateX(120px);
}

.move-up{

    transform:
    translateY(-80px);
}

.move-down{

    transform:
    translateY(80px);
}

/* 手机 */

@media(max-width:768px){

    .mini-camera{

        width:180px;

        height:130px;
    }

    .guide-title{

        font-size:28px;
    }

    .guide-text{

        font-size:15px;
    }

    .result-text{

        font-size:22px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- 顶部 -->

    <div class="topbar">

        <div class="logo">
            AI 手势交互系统
        </div>

        <div class="mode-buttons">

            <button
                class="mode-btn active"
                id="btnRecognition">

                手势识别
            </button>

            <button
                class="mode-btn"
                id="btnControl">

                手势操控
            </button>

        </div>

    </div>

    <!-- 页面 -->

    <div class="page">

        <!-- ================= -->
        <!-- 手势识别 -->
        <!-- ================= -->

        <div id="recognitionPage">

            <div class="camera-card">

                <div class="header">

                    <div class="title">
                        手势识别系统
                    </div>

                    <div class="subtitle">
                        支持双手识别
                    </div>

                </div>

                <video
                    id="video"
                    autoplay
                    muted
                    playsinline>
                </video>

                <canvas id="canvas"></canvas>

                <button id="startBtn">
                    启动识别
                </button>

                <div
                    class="loading"
                    id="loading">

                    点击右上角启动摄像头
                </div>

            </div>

            <div class="result-card">

                <div
                    class="result-text"
                    id="resultText">

                    等待识别
                </div>

                <div class="result-desc">
                    实时 AI 手势识别
                </div>

            </div>

        </div>

        <!-- ================= -->
        <!-- 手势操控 -->
        <!-- ================= -->

        <div id="controlPage">

            <div class="mini-camera">

                <video
                    id="controlVideo"
                    autoplay
                    muted
                    playsinline>
                </video>

                <canvas id="controlCanvas"></canvas>

            </div>

            <div class="guide" id="guide">

                <div
                    class="guide-title"
                    id="guideTitle">

                    手势操控模式
                </div>

                <div
                    class="guide-text"
                    id="guideText">

                    张开手掌放大 · 握拳缩小 · 左右挥动切换
                </div>

            </div>

            <div
                class="like-effect"
                id="likeEffect">

                👍
            </div>

        </div>

    </div>

</div>

<script>

/* ====================== */
/* 元素 */
/* ====================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const controlVideo =
    document.getElementById("controlVideo");

const controlCanvas =
    document.getElementById("controlCanvas");

const controlCtx =
    controlCanvas.getContext("2d");

const resultText =
    document.getElementById("resultText");

const loading =
    document.getElementById("loading");

const guide =
    document.getElementById("guide");

const guideTitle =
    document.getElementById("guideTitle");

const guideText =
    document.getElementById("guideText");

const likeEffect =
    document.getElementById("likeEffect");

/* 页面切换 */

const recognitionPage =
    document.getElementById("recognitionPage");

const controlPage =
    document.getElementById("controlPage");

const btnRecognition =
    document.getElementById("btnRecognition");

const btnControl =
    document.getElementById("btnControl");

let currentMode =
    "recognition";

/* ====================== */
/* 切换页面 */
/* ====================== */

btnRecognition.onclick = ()=>{

    currentMode =
        "recognition";

    recognitionPage.style.display =
        "flex";

    controlPage.style.display =
        "none";

    btnRecognition.classList.add(
        "active"
    );

    btnControl.classList.remove(
        "active"
    );
};

btnControl.onclick = ()=>{

    currentMode =
        "control";

    recognitionPage.style.display =
        "none";

    controlPage.style.display =
        "block";

    btnControl.classList.add(
        "active"
    );

    btnRecognition.classList.remove(
        "active"
    );
};

/* ====================== */
/* 工具函数 */
/* ====================== */

function resizeCanvas(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    controlCanvas.width =
        controlVideo.videoWidth;

    controlCanvas.height =
        controlVideo.videoHeight;
}

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

/* ====================== */
/* 手势识别 */
/* ====================== */

function recognize(lm){

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const thumbUp =
        lm[4].y < lm[3].y &&
        lm[3].y < lm[2].y;

    const thumbDown =
        lm[4].y > lm[3].y &&
        lm[3].y > lm[2].y;

    const thumb =
        thumbUp;

    const thumbIndexNear =
        distance(lm[4],lm[8]) < 0.06;

    if(
        thumbUp &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "点赞";
    }

    if(
        thumbDown &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "取消点赞";
    }

    if(
        index &&
        !middle &&
        !ring &&
        !pinky &&
        !thumb
    ){
        return "数字1";
    }

    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){
        return "数字2 / 剪刀";
    }

    if(
        index &&
        middle &&
        ring &&
        !pinky
    ){
        return "数字3";
    }

    if(
        index &&
        middle &&
        ring &&
        pinky &&
        !thumb
    ){
        return "数字4";
    }

    if(
        thumb &&
        index &&
        middle &&
        ring &&
        pinky
    ){
        return "数字5 / 张开手掌";
    }

    if(
        thumb &&
        pinky &&
        !index &&
        !middle &&
        !ring
    ){
        return "数字6 / 打电话";
    }

    if(
        !thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "握拳";
    }

    if(
        thumbIndexNear &&
        middle &&
        ring &&
        pinky
    ){
        return "OK";
    }

    return "识别中...";
}

/* ====================== */
/* 绘制 */
/* ====================== */

function drawHand(points,ctx2,canvas2){

    const lines = [

        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20]
    ];

    ctx2.strokeStyle =
        "#163a63";

    ctx2.lineWidth = 2;

    for(const [a,b] of lines){

        ctx2.beginPath();

        ctx2.moveTo(
            points[a].x * canvas2.width,
            points[a].y * canvas2.height
        );

        ctx2.lineTo(
            points[b].x * canvas2.width,
            points[b].y * canvas2.height
        );

        ctx2.stroke();
    }

    for(const p of points){

        ctx2.beginPath();

        ctx2.arc(
            p.x * canvas2.width,
            p.y * canvas2.height,
            4,
            0,
            Math.PI * 2
        );

        ctx2.fillStyle =
            "#163a63";

        ctx2.fill();
    }
}

/* ====================== */
/* MediaPipe */
/* ====================== */

const hands = new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

/* ====================== */
/* 结果 */
/* ====================== */

hands.onResults(results => {

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    controlCtx.clearRect(
        0,0,
        controlCanvas.width,
        controlCanvas.height
    );

    if(
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        let texts = [];

        for(const lm of results.multiHandLandmarks){

            drawHand(
                lm,
                ctx,
                canvas
            );

            drawHand(
                lm,
                controlCtx,
                controlCanvas
            );

            const text =
                recognize(lm);

            texts.push(text);

            /* 操控模式 */

            if(
                currentMode === "control"
            ){

                /* 握拳 */

                if(
                    text.includes("握拳")
                ){

                    guideTitle.style.fontSize =
                        "24px";
                }

                /* 张开 */

                if(
                    text.includes("张开手掌")
                ){

                    guideTitle.style.fontSize =
                        "60px";
                }

                /* 点赞 */

                if(
                    text.includes("点赞")
                ){

                    likeEffect.classList.add(
                        "show"
                    );
                }

                /* 取消点赞 */

                if(
                    text.includes("取消点赞")
                ){

                    likeEffect.classList.remove(
                        "show"
                    );
                }

                /* 左右 */

                const wristX =
                    lm[0].x;

                const wristY =
                    lm[0].y;

                guide.className =
                    "guide";

                if(wristX < 0.3){

                    guide.classList.add(
                        "move-left"
                    );
                }

                if(wristX > 0.7){

                    guide.classList.add(
                        "move-right"
                    );
                }

                if(wristY < 0.3){

                    guide.classList.add(
                        "move-up"
                    );
                }

                if(wristY > 0.7){

                    guide.classList.add(
                        "move-down"
                    );
                }
            }
        }

        resultText.innerText =
            texts.join(" + ");

    }else{

        resultText.innerText =
            "未检测到手";
    }
});

/* ====================== */
/* 摄像头 */
/* ====================== */

async function startCamera(){

    try{

        loading.innerText =
            "正在启动摄像头...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false
            });

        video.srcObject =
            stream;

        controlVideo.srcObject =
            stream;

        await video.play();

        await controlVideo.play();

        resizeCanvas();

        loading.style.display =
            "none";

        const camera =
            new Camera(video,{

                onFrame:async()=>{

                    await hands.send({
                        image:video
                    });
                },

                width:640,
                height:480
            });

        camera.start();

    }catch(err){

        console.error(err);

        loading.innerText =
            "摄像头启动失败";
    }
}

/* 启动 */

document
.getElementById("startBtn")
.onclick = ()=>{

    startCamera();
};

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>

</body>
</html>
