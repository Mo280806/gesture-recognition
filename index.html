<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Gesture Vision</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

body{

    background:#0b0b0f;

    color:white;

    height:100vh;

    display:flex;

    flex-direction:column;

    overflow:hidden;
}

/* 顶部 */

.topbar{

    height:72px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 24px;

    border-bottom:
    1px solid rgba(255,255,255,0.06);

    background:
    rgba(10,10,14,0.8);

    backdrop-filter:blur(20px);
}

.logo{

    font-size:20px;

    font-weight:600;

    letter-spacing:0.5px;
}

.status{

    display:flex;

    align-items:center;

    gap:8px;

    color:#8e8e98;

    font-size:14px;
}

.dot{

    width:8px;

    height:8px;

    border-radius:50%;

    background:#3cff94;

    box-shadow:
    0 0 10px #3cff94;
}

/* 主体 */

.container{

    flex:1;

    display:flex;

    flex-direction:column;

    padding:20px;

    gap:20px;
}

/* 摄像头 */

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:32px;

    background:#111;

    border:
    1px solid rgba(255,255,255,0.06);

    box-shadow:
    0 10px 40px rgba(0,0,0,0.45);
}

video,
canvas{

    position:absolute;

    width:100%;

    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

canvas{
    pointer-events:none;
}

/* 底部结果 */

.result-card{

    height:180px;

    border-radius:30px;

    background:
    rgba(255,255,255,0.04);

    border:
    1px solid rgba(255,255,255,0.06);

    backdrop-filter:blur(20px);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:12px;
}

/* 图标 */

.icon{

    font-size:72px;

    transition:0.25s;
}

/* 名字 */

.name{

    font-size:34px;

    font-weight:700;

    letter-spacing:0.5px;
}

/* 描述 */

.desc{

    color:#8d8d96;

    font-size:14px;
}

/* 按钮 */

#startBtn{

    position:absolute;

    top:18px;

    right:18px;

    z-index:999;

    border:none;

    background:white;

    color:black;

    padding:12px 18px;

    border-radius:14px;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    transition:0.2s;
}

#startBtn:hover{

    transform:scale(1.03);
}

/* loading */

.loading{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:
    rgba(20,20,26,0.88);

    border:
    1px solid rgba(255,255,255,0.08);

    padding:16px 24px;

    border-radius:18px;

    font-size:14px;

    color:#d0d0d5;

    z-index:999;
}

/* 手机端 */

@media(max-width:768px){

    .container{

        padding:14px;
    }

    .result-card{

        height:160px;
    }

    .icon{

        font-size:60px;
    }

    .name{

        font-size:28px;
    }
}

</style>
</head>

<body>

<!-- 顶部 -->

<div class="topbar">

    <div class="logo">
        AI Gesture Vision
    </div>

    <div class="status">

        <div class="dot"></div>

        ONLINE

    </div>

</div>

<!-- 主体 -->

<div class="container">

    <!-- 摄像头 -->

    <div class="camera-card">

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="canvas"></canvas>

        <button id="startBtn">
            启动识别
        </button>

        <div class="loading" id="loading">
            点击启动 AI 手势识别
        </div>

    </div>

    <!-- 结果 -->

    <div class="result-card">

        <div class="icon" id="icon">
            🤚
        </div>

        <div class="name" id="name">
            等待识别
        </div>

        <div class="desc">
            Real-time AI Gesture Recognition
        </div>

    </div>

</div>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const iconDom =
    document.getElementById("icon");

const nameDom =
    document.getElementById("name");

const loading =
    document.getElementById("loading");

let lastGesture = "";

let stableCount = 0;

const STABLE_THRESHOLD = 4;

/* 画布大小 */

function resizeCanvas(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;
}

/* 判断手指 */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

/* 手势识别 */

function recognize(lm){

    const thumbUp =
        lm[4].y < lm[3].y &&
        lm[3].y < lm[2].y;

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const thumbIndexNear =
        distance(lm[4],lm[8]) < 0.06;

    // 👍
    if(
        thumbUp &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return {
            icon:"👍",
            name:"点赞"
        };
    }

    // ☝️
    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return {
            icon:"☝️",
            name:"数字1"
        };
    }

    // ✌️
    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){
        return {
            icon:"✌️",
            name:"数字2"
        };
    }

    // ✋
    if(
        thumbUp &&
        index &&
        middle &&
        ring &&
        pinky
    ){
        return {
            icon:"✋",
            name:"数字5"
        };
    }

    // 🤘
    if(
        index &&
        pinky &&
        !middle &&
        !ring
    ){
        return {
            icon:"🤘",
            name:"摇滚手势"
        };
    }

    // 🤙
    if(
        thumbUp &&
        pinky &&
        !index &&
        !middle &&
        !ring
    ){
        return {
            icon:"🤙",
            name:"打电话"
        };
    }

    // 👌
    if(
        thumbIndexNear &&
        middle &&
        ring &&
        pinky
    ){
        return {
            icon:"👌",
            name:"OK"
        };
    }

    return {

        icon:"🤚",

        name:"识别中"
    };
}

/* 绘制骨架 */

function drawHand(points){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    ctx.strokeStyle =
        "rgba(255,255,255,0.7)";

    ctx.lineWidth = 2;

    for(const [a,b] of lines){

        ctx.beginPath();

        ctx.moveTo(
            points[a].x * canvas.width,
            points[a].y * canvas.height
        );

        ctx.lineTo(
            points[b].x * canvas.width,
            points[b].y * canvas.height
        );

        ctx.stroke();
    }

    for(const p of points){

        ctx.beginPath();

        ctx.arc(
            p.x * canvas.width,
            p.y * canvas.height,
            4,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffffff";

        ctx.fill();
    }
}

/* MediaPipe */

const hands = new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

/* 识别结果 */

hands.onResults(results => {

    if(
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        const lm =
            results.multiHandLandmarks[0];

        drawHand(lm);

        const gesture =
            recognize(lm);

        if(
            gesture.name === lastGesture
        ){

            stableCount++;

        }else{

            stableCount = 0;

            lastGesture =
                gesture.name;
        }

        if(
            stableCount >= STABLE_THRESHOLD
        ){

            iconDom.innerText =
                gesture.icon;

            nameDom.innerText =
                gesture.name;
        }

    }else{

        stableCount = 0;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        iconDom.innerText =
            "🤚";

        nameDom.innerText =
            "未检测到手";
    }
});

/* 启动摄像头 */

async function startCamera(){

    try{

        loading.innerText =
            "正在启动摄像头...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false
            });

        video.srcObject = stream;

        await video.play();

        resizeCanvas();

        loading.style.display =
            "none";

        const camera =
            new Camera(video,{

                onFrame:async()=>{

                    await hands.send({
                        image:video
                    });
                },

                width:640,
                height:480
            });

        camera.start();

    }catch(err){

        console.error(err);

        loading.innerText =
            "摄像头启动失败";
    }
}

/* 点击启动 */

document
.getElementById("startBtn")
.onclick = ()=>{

    startCamera();
};

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>

</body>
</html>
