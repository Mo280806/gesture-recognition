<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI手势交互系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{
    background:#ffffff;
    color:#163a63;
    overflow:hidden;
}

/* 主页面 */

.page{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* 顶部 */

.topbar{

    height:72px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:14px;

    border-bottom:1px solid #e5edf5;

    background:white;

    z-index:20;
}

.mode-btn{

    border:none;

    background:#edf3fa;

    color:#163a63;

    padding:12px 22px;

    border-radius:14px;

    cursor:pointer;

    font-size:15px;

    transition:0.25s;
}

.mode-btn.active{

    background:#163a63;

    color:white;
}

/* 页面区域 */

.view{

    flex:1;

    position:relative;

    display:none;
}

.view.active{
    display:block;
}

/* ========= 原来的识别页面 ========= */

.detect-wrap{

    width:min(900px,94vw);

    height:min(88vh,900px);

    margin:auto;

    padding-top:20px;

    display:flex;

    flex-direction:column;

    gap:18px;
}

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:24px;

    background:#f5f8fc;

    border:1px solid #dbe5f0;
}

video,
canvas{

    position:absolute;

    width:100%;

    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

canvas{
    pointer-events:none;
}

.result-card{

    height:120px;

    border-radius:22px;

    background:#f8fafc;

    border:1px solid #dbe5f0;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:28px;

    font-weight:600;
}

/* ========= 操控页面 ========= */

.control-page{

    position:relative;

    width:100%;

    height:100%;
}

/* 左上角小相机 */

.small-camera{

    position:absolute;

    top:20px;

    left:20px;

    width:240px;

    height:180px;

    border-radius:18px;

    overflow:hidden;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    z-index:10;
}

/* 中央文字 */

.control-text{

    position:absolute;

    top:50%;

    left:50%;

    transform:
    translate(-50%,-50%);

    font-size:56px;

    font-weight:700;

    color:#163a63;

    transition:0.3s;
}

/* 点赞动画 */

.like{

    position:absolute;

    right:80px;

    top:100px;

    font-size:80px;

    opacity:0;

    transform:scale(0.5);

    transition:0.5s;
}

.like.show{

    opacity:1;

    transform:scale(1.2);
}

/* 引导 */

.tip{

    position:absolute;

    bottom:30px;

    width:100%;

    text-align:center;

    color:#7a8ea5;

    font-size:14px;
}

</style>
</head>

<body>

<div class="page">

    <!-- 顶部切换 -->

    <div class="topbar">

        <button
            class="mode-btn active"
            id="detectBtn">

            手势识别
        </button>

        <button
            class="mode-btn"
            id="controlBtn">

            手势操控
        </button>

    </div>

    <!-- 手势识别 -->

    <div class="view active" id="detectView">

        <div class="detect-wrap">

            <div class="camera-card">

                <video id="video" autoplay muted playsinline></video>

                <canvas id="canvas"></canvas>

            </div>

            <div class="result-card" id="resultText">

                等待识别

            </div>

        </div>

    </div>

    <!-- 手势操控 -->

    <div class="view" id="controlView">

        <div class="control-page">

            <div class="small-camera">

                <video id="video2" autoplay muted playsinline></video>

                <canvas id="canvas2"></canvas>

            </div>

            <div class="control-text" id="controlText">

                张开手放大

            </div>

            <div class="like" id="like">

                👍
            </div>

            <div class="tip">

                握拳缩小 · 张开放大 · 左右挥动移动 · 点赞触发特效

            </div>

        </div>

    </div>

</div>

<script>

/* 元素 */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const video2 =
document.getElementById("video2");

const canvas2 =
document.getElementById("canvas2");

const ctx2 =
canvas2.getContext("2d");

const resultText =
document.getElementById("resultText");

const controlText =
document.getElementById("controlText");

const like =
document.getElementById("like");

/* 模式切换 */

const detectView =
document.getElementById("detectView");

const controlView =
document.getElementById("controlView");

document.getElementById("detectBtn").onclick=()=>{

    detectView.classList.add("active");
    controlView.classList.remove("active");

    document.getElementById("detectBtn")
    .classList.add("active");

    document.getElementById("controlBtn")
    .classList.remove("active");
};

document.getElementById("controlBtn").onclick=()=>{

    controlView.classList.add("active");
    detectView.classList.remove("active");

    document.getElementById("controlBtn")
    .classList.add("active");

    document.getElementById("detectBtn")
    .classList.remove("active");
};

/* resize */

function resize(){

    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;

    canvas2.width =
    video2.videoWidth;

    canvas2.height =
    video2.videoHeight;
}

/* 判断 */

function fingerUp(t,p){

    return t.y < p.y;
}

/* 手势识别 */

function recognize(lm){

    const thumb =
    lm[4].y < lm[3].y;

    const index =
    fingerUp(lm[8],lm[6]);

    const middle =
    fingerUp(lm[12],lm[10]);

    const ring =
    fingerUp(lm[16],lm[14]);

    const pinky =
    fingerUp(lm[20],lm[18]);

    /* 点赞 */

    if(
        thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "点赞";
    }

    /* 握拳 */

    if(
        !thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "握拳";
    }

    /* 张开 */

    if(
        thumb &&
        index &&
        middle &&
        ring &&
        pinky
    ){
        return "张开";
    }

    /* 左 */

    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){

        if(lm[8].x < 0.35){

            return "左";
        }

        if(lm[8].x > 0.65){

            return "右";
        }
    }

    return "识别中";
}

/* 绘制 */

function draw(points,ctx,w,h){

    ctx.clearRect(0,0,w,h);

    for(const p of points){

        ctx.beginPath();

        ctx.arc(
            p.x*w,
            p.y*h,
            4,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#163a63";

        ctx.fill();
    }
}

/* mediapipe */

const hands =
new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

hands.onResults(results=>{

    if(
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length>0
    ){

        const lm =
        results.multiHandLandmarks[0];

        draw(
            lm,
            ctx,
            canvas.width,
            canvas.height
        );

        draw(
            lm,
            ctx2,
            canvas2.width,
            canvas2.height
        );

        const gesture =
        recognize(lm);

        /* 原识别页面 */

        resultText.innerText =
        gesture;

        /* 操控页面 */

        if(gesture==="握拳"){

            controlText.style.fontSize =
            "34px";

            controlText.innerText =
            "文字缩小";
        }

        if(gesture==="张开"){

            controlText.style.fontSize =
            "82px";

            controlText.innerText =
            "文字放大";
        }

        if(gesture==="左"){

            controlText.style.transform =
            "translate(-65%,-50%)";

            controlText.innerText =
            "向左滑动";
        }

        if(gesture==="右"){

            controlText.style.transform =
            "translate(-35%,-50%)";

            controlText.innerText =
            "向右滑动";
        }

        if(gesture==="点赞"){

            like.classList.add("show");

            controlText.innerText =
            "已点赞";

            setTimeout(()=>{

                like.classList.remove("show");

            },600);
        }

    }
});

/* 摄像头 */

async function start(){

    const stream =
    await navigator.mediaDevices.getUserMedia({

        video:true,
        audio:false
    });

    video.srcObject = stream;

    video2.srcObject = stream;

    await video.play();

    await video2.play();

    resize();

    const camera =
    new Camera(video,{

        onFrame:async()=>{

            await hands.send({
                image:video
            });
        },

        width:640,
        height:480
    });

    camera.start();
}

start();

window.addEventListener(
    "resize",
    resize
);

</script>

</body>
</html>
