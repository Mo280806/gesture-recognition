<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Gesture Vision</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{

    background:#ffffff;

    color:#10243e;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;
}

/* 主容器 */

.container{

    width:min(920px,94vw);

    height:min(92vh,920px);

    display:flex;

    flex-direction:column;

    gap:18px;
}

/* 相机区域 */

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:24px;

    background:#f4f7fb;

    border:
    1px solid #d7e3f2;

    box-shadow:
    0 10px 30px rgba(16,36,62,0.08);
}

video,
canvas{

    position:absolute;

    width:100%;

    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

canvas{
    pointer-events:none;
}

/* 顶部标题 */

.header{

    position:absolute;

    top:18px;

    left:20px;

    z-index:10;

    display:flex;

    flex-direction:column;

    gap:4px;
}

.title{

    font-size:18px;

    font-weight:600;

    color:#163a63;
}

.subtitle{

    font-size:13px;

    color:#6d7f95;
}

/* 按钮 */

#startBtn{

    position:absolute;

    top:18px;

    right:18px;

    z-index:999;

    border:none;

    background:#163a63;

    color:white;

    padding:10px 16px;

    border-radius:12px;

    font-size:13px;

    font-weight:500;

    cursor:pointer;

    transition:0.2s;
}

#startBtn:hover{

    background:#204c80;
}

/* loading */

.loading{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:rgba(255,255,255,0.92);

    color:#163a63;

    border:
    1px solid #dce6f2;

    padding:14px 20px;

    border-radius:14px;

    font-size:13px;

    z-index:999;
}

/* 结果区域 */

.result-card{

    height:140px;

    border-radius:22px;

    background:#f8fafc;

    border:
    1px solid #d7e3f2;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:8px;
}

/* 图标 */

.icon{

    font-size:48px;

    transition:0.2s;
}

/* 文字 */

.name{

    font-size:24px;

    font-weight:600;

    color:#163a63;
}

.desc{

    font-size:13px;

    color:#7b8da3;
}

/* 手机端 */

@media(max-width:768px){

    .container{

        width:100vw;

        height:100vh;

        padding:14px;
    }

    .camera-card{

        flex:1;
    }

    .result-card{

        height:120px;
    }

    .icon{

        font-size:42px;
    }

    .name{

        font-size:20px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- 相机 -->

    <div class="camera-card">

        <div class="header">

            <div class="title">
                AI Gesture Recognition
            </div>

            <div class="subtitle">
                Real-time Hand Tracking
            </div>

        </div>

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="canvas"></canvas>

        <button id="startBtn">
            启动识别
        </button>

        <div class="loading" id="loading">
            点击右上角启动摄像头
        </div>

    </div>

    <!-- 结果 -->

    <div class="result-card">

        <div class="icon" id="icon">
            🤚
        </div>

        <div class="name" id="name">
            等待识别
        </div>

        <div class="desc">
            AI Real-time Gesture Recognition
        </div>

    </div>

</div>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const iconDom =
    document.getElementById("icon");

const nameDom =
    document.getElementById("name");

const loading =
    document.getElementById("loading");

let lastGesture = "";

let stableCount = 0;

const STABLE_THRESHOLD = 4;

/* resize */

function resizeCanvas(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;
}

/* finger */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

/* recognize */

function recognize(lm){

    const thumbUp =
        lm[4].y < lm[3].y &&
        lm[3].y < lm[2].y;

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const thumbIndexNear =
        distance(lm[4],lm[8]) < 0.06;

    // 👍
    if(
        thumbUp &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return {
            icon:"👍",
            name:"点赞"
        };
    }

    // ☝️
    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return {
            icon:"☝️",
            name:"数字1"
        };
    }

    // ✌️
    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){
        return {
            icon:"✌️",
            name:"数字2"
        };
    }

    // ✋
    if(
        thumbUp &&
        index &&
        middle &&
        ring &&
        pinky
    ){
        return {
            icon:"✋",
            name:"数字5"
        };
    }

    // 🤘
    if(
        index &&
        pinky &&
        !middle &&
        !ring
    ){
        return {
            icon:"🤘",
            name:"摇滚"
        };
    }

    // 🤙
    if(
        thumbUp &&
        pinky &&
        !index &&
        !middle &&
        !ring
    ){
        return {
            icon:"🤙",
            name:"打电话"
        };
    }

    // 👌
    if(
        thumbIndexNear &&
        middle &&
        ring &&
        pinky
    ){
        return {
            icon:"👌",
            name:"OK"
        };
    }

    return {

        icon:"🤚",

        name:"识别中"
    };
}

/* draw */

function drawHand(points){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    ctx.strokeStyle =
        "#163a63";

    ctx.lineWidth = 2;

    for(const [a,b] of lines){

        ctx.beginPath();

        ctx.moveTo(
            points[a].x * canvas.width,
            points[a].y * canvas.height
        );

        ctx.lineTo(
            points[b].x * canvas.width,
            points[b].y * canvas.height
        );

        ctx.stroke();
    }

    for(const p of points){

        ctx.beginPath();

        ctx.arc(
            p.x * canvas.width,
            p.y * canvas.height,
            4,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#163a63";

        ctx.fill();
    }
}

/* MediaPipe */

const hands = new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

/* result */

hands.onResults(results => {

    if(
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        const lm =
            results.multiHandLandmarks[0];

        drawHand(lm);

        const gesture =
            recognize(lm);

        if(
            gesture.name === lastGesture
        ){

            stableCount++;

        }else{

            stableCount = 0;

            lastGesture =
                gesture.name;
        }

        if(
            stableCount >= STABLE_THRESHOLD
        ){

            iconDom.innerText =
                gesture.icon;

            nameDom.innerText =
                gesture.name;
        }

    }else{

        stableCount = 0;

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        iconDom.innerText =
            "🤚";

        nameDom.innerText =
            "未检测到手";
    }
});

/* start */

async function startCamera(){

    try{

        loading.innerText =
            "正在启动摄像头...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false
            });

        video.srcObject = stream;

        await video.play();

        resizeCanvas();

        loading.style.display =
            "none";

        const camera =
            new Camera(video,{

                onFrame:async()=>{

                    await hands.send({
                        image:video
                    });
                },

                width:640,
                height:480
            });

        camera.start();

    }catch(err){

        console.error(err);

        loading.innerText =
            "摄像头启动失败";
    }
}

/* click */

document
.getElementById("startBtn")
.onclick = ()=>{

    startCamera();
};

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>

</body>
</html>
