<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>手势交互系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:#edf3fa;

    overflow:hidden;

    color:#163a63;
}

/* 顶部 */

.top-bar{

    position:fixed;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:12px;

    z-index:999999;

    touch-action:none;
    
    overscroll-behavior:none;
}

.mode-btn{

    border:none;

    padding:12px 22px;

    border-radius:16px;

    background:rgba(255,255,255,0.95);

    color:#163a63;

    font-size:14px;

    cursor:pointer;

    transition:0.2s;

    backdrop-filter:blur(10px);

    box-shadow:
    0 6px 24px rgba(0,0,0,0.06);
}

@media (max-width:768px){

    .container{

        padding-left:72px;
    }
}

@media (max-width:768px){

    .top-bar{

        top:50%;

        left:12px;

        transform:translateY(-50%);

        flex-direction:column;

        gap:10px;
    }

    .mode-btn{

        padding:10px 14px;

        font-size:13px;

        border-radius:14px;
    }
}
    
.mode-btn.active{

    background:#163a63;

    color:white;
}

/* 识别 */

.recognize-page{

    width:100vw;
    height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;
}

.container{

    width:min(980px,94vw);

    height:min(92vh,920px);

    display:flex;

    flex-direction:column;

    gap:18px;
}

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:28px;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    box-shadow:
    0 15px 40px rgba(22,58,99,0.08);
}

#video,
#canvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

#canvas{
    pointer-events:none;
}

.header{

    position:absolute;

    top:18px;
    left:20px;

    z-index:10;

    background:rgba(255,255,255,0.86);

    backdrop-filter:blur(10px);

    padding:14px 18px;

    border-radius:18px;
}

.title{

    font-size:18px;

    font-weight:700;
}

.subtitle{

    margin-top:5px;

    font-size:13px;

    color:#71849b;

    line-height:1.7;
}

#startBtn{

    position:absolute;

    top:20px;
    right:20px;

    border:none;

    background:#163a63;

    color:white;

    padding:12px 18px;

    border-radius:14px;

    font-size:14px;

    cursor:pointer;

    z-index:999;
}

.loading{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:white;

    padding:14px 20px;

    border-radius:16px;

    border:1px solid #dbe5f0;

    font-size:14px;

    z-index:999;
}

.result-card{

    min-height:120px;

    border-radius:24px;

    background:white;

    border:1px solid #dbe5f0;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:18px;

    box-shadow:
    0 10px 25px rgba(22,58,99,0.06);
}

.name{

    font-size:30px;

    font-weight:700;

    text-align:center;

    line-height:1.8;
}

/* 阅读 */

.control-page{

    width:100vw;
    height:100vh;

    display:none;

    position:relative;
}

.floating-camera{

    position:fixed;

    top:14px;
    left:14px;

    width:62px;
    height:62px;

    border-radius:50%;

    overflow:hidden;

    background:white;

    border:1px solid #dbe5f0;

    box-shadow:
    0 8px 24px rgba(22,58,99,0.15);

    z-index:99999;

    transition:0.25s;
}

/* 展开状态 */

.floating-camera.expand{

    width:180px;
    height:140px;

    border-radius:20px;
}

@media (max-width:768px){

    .floating-camera{

        top:82px;
        left:12px;
    }
}

#controlVideo,
#controlCanvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

#controlCanvas{
    pointer-events:none;
}

.reader-container{

    width:min(1000px,88vw);

    height:min(84vh,880px);

    background:white;

    border-radius:34px;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    box-shadow:
    0 20px 60px rgba(22,58,99,0.12);

    border:1px solid #dbe5f0;
}

@media (max-width:768px){

    .reader-container{

        width:100vw;

        height:100vh;

        left:0;
        top:0;

        transform:none;

        border-radius:0;

        box-shadow:none;

        border:none;
    }
}
    
.reader-header{

    height:72px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 28px;

    border-bottom:1px solid #e9eef5;
}

.reader-title{

    font-size:22px;

    font-weight:700;
}

.page-info{

    font-size:14px;

    color:#7a8ca2;
}

.reader-content{

    flex:1;

    padding:42px 42px 110px;

    overflow:hidden;
}

.book-page{

    width:100%;
    height:100%;

    overflow-y:auto;

    font-size:24px;

    line-height:2.2;

    color:#1d2b3a;

    transition:0.2s;

    user-select:none;
}

@media (max-width:768px){

    .book-page{

        font-size:18px;

        line-height:1.9;
    }
}
    
.horizontal-mode{

    column-count:2;

    column-gap:60px;
}

.control-panel{

    position:fixed;

    bottom:0;
    left:0;

    width:100%;

    height:78px;

    background:
        rgba(255,255,255,0.92);

    backdrop-filter:blur(12px);

    border-top:
        1px solid #e9eef5;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    padding:10px;

    z-index:99999;
}

.control-btn{

    min-width:120px;

    height:50px;

    border:none;

    border-radius:16px;

    background:#edf3fb;

    color:#163a63;

    font-size:15px;

    cursor:pointer;

    transition:
    transform 0.08s,
    background 0.08s,
    color 0.08s;
}

.control-btn.hovering{

    background:#163a63;

    color:white;

    transform:scale(1.05);
}

@media (max-width:768px){

    .control-btn{

        min-width:88px;

        height:44px;

        font-size:14px;

        border-radius:14px;
    }
}

.menu-panel{

    position:absolute;

    right:24px;
    top:90px;

    width:250px;

    background:white;

    border-radius:20px;

    border:1px solid #dbe5f0;

    box-shadow:
    0 15px 35px rgba(22,58,99,0.12);

    padding:16px;

    display:none;

    z-index:99999;
}

.menu-panel.show{

    display:block;
}

.menu-item{

    padding:14px;

    border-radius:14px;

    margin-bottom:10px;

    background:#f4f8fd;

    transition:
    transform 0.08s,
    background 0.08s,
    color 0.08s;
}

.menu-item.hovering{

    background:#163a63;

    color:white;

    transform:scale(1.03);
}

.night{

    background:#0e141b;
}

.night .reader-container{

    background:#1a2028;
}

.night .book-page,
.night .reader-title{

    color:#eef4fb;
}

.night .page-info{

    color:#98a8bb;
}

/* 光标 */

.cursor{

    position:fixed;

    width:24px;
    height:24px;

    border-radius:50%;

    background:#163a63;

    pointer-events:none;

    z-index:999999;

    box-shadow:
    0 0 18px rgba(22,58,99,0.35);

    will-change:transform;

    transform:
        translate3d(0,0,0);

    transition:
        background 0.1s;
}

.cursor::after{

    content:"";

    position:absolute;

    inset:-10px;

    border-radius:50%;

    border:3px solid rgba(22,58,99,0.15);

    border-top-color:#163a63;

    opacity:0;

    transform:scale(0.8);

    transition:0.15s;
}

.cursor.hovering::after{

    opacity:1;

    animation:
        hoverRing 0.8s linear forwards;
}

@keyframes hoverRing{

    from{

        transform:rotate(0deg);
    }

    to{

        transform:rotate(360deg);
    }
}

.cursor-trail{

    position:fixed;

    width:12px;
    height:12px;

    border-radius:50%;

    background:rgba(22,58,99,0.18);

    pointer-events:none;

    z-index:999998;

    will-change:transform;
}

.gesture-status{

    position:fixed;

    bottom:18px;

    left:50%;

    transform:translateX(-50%);

    background:rgba(255,255,255,0.92);

    backdrop-filter:blur(10px);

    border-radius:18px;

    border:1px solid #dbe5f0;

    padding:14px 22px;

    font-size:14px;

    color:#61758c;

    z-index:999999;

    box-shadow:
    0 10px 25px rgba(22,58,99,0.08);

    white-space:nowrap;
}

@media (max-width:768px){

    .gesture-status{

        display:none;
    }
}

</style>
</head>

<body>

<div class="top-bar">

    <button
        class="mode-btn active"
        id="recognizeBtn">

        手势识别
    </button>

    <button
        class="mode-btn"
        id="controlBtn">

        手势阅读
    </button>

</div>

<div
    class="recognize-page"
    id="recognizePage">

    <div class="container">

        <div class="camera-card">

            <div class="header">

                <div class="title">
                    手势识别系统
                </div>

                <div class="subtitle">
                    支持：0~5、点赞、OK、剪刀、握拳、张手
                </div>

            </div>

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <canvas id="canvas"></canvas>

            <button id="startBtn">
                启动识别
            </button>

            <div
                class="loading"
                id="loading">

                点击启动摄像头
            </div>

        </div>

        <div class="result-card">

            <div
                class="name"
                id="name">

                等待识别
            </div>

        </div>

    </div>

</div>

<!-- 阅读页面 -->

<div
    class="control-page"
    id="controlPage">

    <div class="floating-camera">

        <video
            id="controlVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="controlCanvas"></canvas>

    </div>

    <div
        class="cursor"
        id="cursor">
    </div>

    <div class="reader-container">

        <div class="reader-header">

            <div class="reader-title">
                《星空旅人》
            </div>

            <div
                class="page-info"
                id="pageInfo">

                第1页 / 共3页
            </div>

        </div>

        <div class="reader-content">

            <div
                class="book-page"
                id="bookPage">
            </div>

            <div
                class="menu-panel"
                id="menuPanel">

                <div
                    class="menu-item"
                    data-menu="night">

                    🌙 日间 / 夜间
                </div>

                <div
                    class="menu-item"
                    data-menu="big">

                    ➕ 字体放大
                </div>

                <div
                    class="menu-item"
                    data-menu="small">

                    ➖ 字体缩小
                </div>

                <div
                    class="menu-item"
                    data-menu="vertical">

                    ↕ 上下阅读
                </div>

                <div
                    class="menu-item"
                    data-menu="horizontal">

                    ↔ 左右阅读
                </div>

            </div>

        </div>

        <div class="control-panel">

            <button
                class="control-btn"
                data-action="prev">

                上一页
            </button>

            <button
                class="control-btn"
                data-action="next">

                下一页
            </button>

            <button
                class="control-btn"
                data-action="menu">

                菜单
            </button>

        </div>

    </div>

    <div class="gesture-status">

        👉 食指控制光标　
        👆 悬停0.8秒点击　
        ✋ 挥手翻页　
        🤲 双手缩放字体

    </div>

</div>

<script>

/* DOM */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const controlVideo =
    document.getElementById("controlVideo");

const controlCanvas =
    document.getElementById("controlCanvas");

const controlCtx =
    controlCanvas.getContext("2d");

const nameDom =
    document.getElementById("name");

const loading =
    document.getElementById("loading");

const recognizeBtn =
    document.getElementById("recognizeBtn");

const controlBtn =
    document.getElementById("controlBtn");

const recognizePage =
    document.getElementById("recognizePage");

const controlPage =
    document.getElementById("controlPage");

const cursor =
    document.getElementById("cursor");

const bookPage =
    document.getElementById("bookPage");

const pageInfo =
    document.getElementById("pageInfo");

const menuPanel =
    document.getElementById("menuPanel");

const buttons =
    document.querySelectorAll(".control-btn");

const menuItems =
    document.querySelectorAll(".menu-item");

const floatingCamera =
    document.querySelector(".floating-camera");

const isMobile =
    window.innerWidth < 768;

/* 摄像头展开 */

floatingCamera.onclick = ()=>{

    floatingCamera.classList.toggle(
        "expand"
    );
};

/* 页面切换 */

recognizeBtn.onclick = ()=>{

    recognizeBtn.classList.add("active");

    controlBtn.classList.remove("active");

    recognizePage.style.display = "flex";

    controlPage.style.display = "none";
};

controlBtn.onclick = ()=>{

    controlBtn.classList.add("active");

    recognizeBtn.classList.remove("active");

    recognizePage.style.display = "none";

    controlPage.style.display = "block";

    updateHoverRects();
};

/* 小说 */

const pages = [

`深夜的列车穿过无人的山谷。

林澈坐在靠窗的位置，看着远处缓慢后退的灯火。

车厢里很安静，只能听见铁轨轻轻震动的声音。

忽然，广播响起：

“终点站即将到达，请旅客提前整理随身物品。”`,

`列车停下时，外面却并不是城市。

月光下，是一片巨大的湖泊。

湖面像镜子一样平静，而湖中央漂浮着一座白色钟塔。

林澈缓缓走下列车。`,

`钟塔的大门缓缓开启。

无数星光从塔内流出，像银河一样铺满地面。

一个声音在黑暗中轻轻响起：

“欢迎来到时间尽头。”`
];

let currentPage = 0;

function renderPage(){

    bookPage.innerText =
        pages[currentPage];

    pageInfo.innerText =
        `第 ${currentPage+1} 页 / 共 ${pages.length} 页`;
}

renderPage();

/* 页面功能 */

function nextPage(){

    if(currentPage < pages.length - 1){

        currentPage++;

        renderPage();
    }
}

function prevPage(){

    if(currentPage > 0){

        currentPage--;

        renderPage();
    }
}

function toggleMenu(){

    menuPanel.classList.toggle("show");

    requestAnimationFrame(()=>{

        updateHoverRects();
    });
}

function toggleNight(){

    document.body.classList.toggle("night");
}

let fontSize = 24;

function fontIncrease(){

    fontSize += 2;

    bookPage.style.fontSize =
        fontSize + "px";
}

function fontDecrease(){

    fontSize -= 2;

    if(fontSize < 16){

        fontSize = 16;
    }

    bookPage.style.fontSize =
        fontSize + "px";
}

function switchHorizontal(){

    bookPage.classList.add(
        "horizontal-mode"
    );
}

function switchVertical(){

    bookPage.classList.remove(
        "horizontal-mode"
    );
}

/* resize */

function resizeCanvas(){

    if(video.videoWidth){

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;
    }

    if(controlVideo.videoWidth){

        controlCanvas.width =
            controlVideo.videoWidth;

        controlCanvas.height =
            controlVideo.videoHeight;
    }

    updateHoverRects();
}

/* 工具 */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

/* 手势识别 */

function recognize(lm){

    const thumb =
        lm[4].x < lm[3].x;

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const total =

        (thumb ? 1 : 0) +
        (index ? 1 : 0) +
        (middle ? 1 : 0) +
        (ring ? 1 : 0) +
        (pinky ? 1 : 0);

    const ok =
        distance(lm[4],lm[8]) < 0.05 &&
        middle &&
        ring &&
        pinky;

    const fist =

        !index &&
        !middle &&
        !ring &&
        !pinky;

    if(ok){

        return "OK";
    }

    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){

        return "✌ 剪刀 / 数字2";
    }

    if(
        thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){

        return "👍 点赞";
    }

    if(fist){

        return "✊ 握拳 / 数字0";
    }

    if(total === 5){

        return "🖐 张手 / 数字5";
    }

    return `数字 ${total}`;
}

/* 绘制 */

function drawHand(points,context,w,h){

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    context.strokeStyle =
        "#163a63";

    context.lineWidth = 2;

    for(const [a,b] of lines){

        context.beginPath();

        context.moveTo(
            points[a].x * w,
            points[a].y * h
        );

        context.lineTo(
            points[b].x * w,
            points[b].y * h
        );

        context.stroke();
    }
}

/* 光标平滑 */

let cursorTargetX = 0;
let cursorTargetY = 0;

let cursorX = 0;
let cursorY = 0;

let smoothX = 0;
let smoothY = 0;

function animateCursor(){

    const smooth =
        isMobile ? 0.42 : 0.18;

    cursorX +=
        (cursorTargetX - cursorX)
        * smooth;

    cursorY +=
        (cursorTargetY - cursorY)
        * smooth;

    if(
        Math.abs(cursorTargetX - cursorX) < 0.3
    ){
        cursorX = cursorTargetX;
    }

    if(
        Math.abs(cursorTargetY - cursorY) < 0.3
    ){
        cursorY = cursorTargetY;
    }

    cursor.style.transform =
        `translate3d(${cursorX}px,${cursorY}px,0)`;

    requestAnimationFrame(
        animateCursor
    );
}

animateCursor();

/* hover */

let hoverTarget = null;

let hoverStart = 0;

let clickedLock = false;

let lastClickTime = 0;

let leaveTimer = null;

let hoverStableX = 0;

let hoverStableY = 0;

let hoverRects = [];

let lastHoverEl = null;

let hoverLeaveTimer = null;

let lastHoverCheck = 0;

function updateHoverRects(){

    hoverRects = [

        ...buttons,
        ...menuItems

    ].map(el=>({

        el,

        rect:el.getBoundingClientRect()
    }));
}

updateHoverRects();

function hoverDetect(x,y){

    let found = null;

    const padding =
        isMobile ? 34 : 22;

    for(const item of hoverRects){

        const rect = item.rect;

        const el = item.el;

        if(

            x >= rect.left - padding &&
            x <= rect.right + padding &&
            y >= rect.top - padding &&
            y <= rect.bottom + padding

        ){

            found = el;

            break;
        }
    }

    if(found !== lastHoverEl){

        clearTimeout(hoverLeaveTimer);

        if(lastHoverEl){

            lastHoverEl.classList.remove(
                "hovering"
            );
        }

        if(found){

            found.classList.add(
                "hovering"
            );

            cursor.classList.add(
                "hovering"
            );

        }else{

            cursor.classList.remove(
                "hovering"
            );
        }

        lastHoverEl = found;
    }

    if(found){

        clearTimeout(leaveTimer);

        if(hoverTarget !== found){

            hoverStableX = x;

            hoverStableY = y;

            hoverTarget = found;

            hoverStart = Date.now();

            clickedLock = false;
        }

        const moveDist = Math.hypot(

            x - hoverStableX,

            y - hoverStableY
        );

        const stableTime =
            Date.now() - hoverStart;

        if(

            !clickedLock &&

            moveDist < (isMobile ? 42 : 25) &&

            stableTime > (isMobile ? 950 : 800) &&

            Date.now() - lastClickTime > 1400

        ){

            autoClick(found);

            clickedLock = true;

            lastClickTime = Date.now();

            hoverTarget = null;

            hoverStart = 0;
        }

    }else{

        clearTimeout(leaveTimer);

        leaveTimer = setTimeout(()=>{

            hoverTarget = null;

            hoverStart = 0;

            clickedLock = false;

        },180);
    }
}

/* 自动点击 */

function autoClick(el){

    if(el.dataset.action){

        const action =
            el.dataset.action;

        if(action === "next"){

            nextPage();
        }

        if(action === "prev"){

            prevPage();
        }

        if(action === "menu"){

            toggleMenu();
        }
    }

    if(el.dataset.menu){

        const menu =
            el.dataset.menu;

        if(menu === "night"){

            toggleNight();
        }

        if(menu === "big"){

            fontIncrease();
        }

        if(menu === "small"){

            fontDecrease();
        }

        if(menu === "horizontal"){

            switchHorizontal();
        }

        if(menu === "vertical"){

            switchVertical();
        }
    }

    updateHoverRects();
}

/* 挥手翻页 */

let swipeTrack = [];

let lastSwipeTime = 0;

function detectSwipe(lm){

    const now = Date.now();

    if(now - lastSwipeTime < 800){

        return;
    }

    swipeTrack.push({

        x:lm[0].x
    });

    if(swipeTrack.length > 8){

        swipeTrack.shift();
    }

    if(swipeTrack.length < 5){

        return;
    }

    const dx =

        swipeTrack[
            swipeTrack.length - 1
        ].x -

        swipeTrack[0].x;

    if(Math.abs(dx) > 0.18){

        if(dx > 0){

            nextPage();

        }else{

            prevPage();
        }

        lastSwipeTime = now;

        swipeTrack = [];
    }
}

/* MediaPipe */

const hands = new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:2,

    modelComplexity:
        isMobile ? 0 : 1,

    minDetectionConfidence:0.82,

    minTrackingConfidence:0.82
});

/* results */

hands.onResults(results => {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    controlCtx.clearRect(
        0,
        0,
        controlCanvas.width,
        controlCanvas.height
    );

    if(

        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0

    ){

        let resultTexts = [];

        results.multiHandLandmarks.forEach((lm,index)=>{

            drawHand(
                lm,
                ctx,
                canvas.width,
                canvas.height
            );

            drawHand(
                lm,
                controlCtx,
                controlCanvas.width,
                controlCanvas.height
            );

            const gesture =
                recognize(lm);

            resultTexts.push(
                `手${index+1}：${gesture}`
            );

            if(index === 0){

                const mobileBoost =
                    isMobile ? 1.65 : 1.12;

                smoothX +=
                    (
                        lm[8].x - smoothX
                    ) * 0.35;

                smoothY +=
                    (
                        lm[8].y - smoothY
                    ) * 0.35;

                const centerX = 0.5;
                const centerY = 0.5;

                const nx =

                    (smoothX - centerX)
                    * mobileBoost
                    + centerX;

                const ny =

                    (smoothY - centerY)
                    * mobileBoost
                    + centerY;

                cursorTargetX =

                    (1 - nx)
                    * window.innerWidth;

                cursorTargetY =

                    ny
                    * window.innerHeight;

                if(
                    controlPage.style.display !== "none"
                ){

                    const now =
                        performance.now();

                    if(
                        now - lastHoverCheck >
                        (isMobile ? 55 : 33)
                    ){

                        hoverDetect(
                            cursorX,
                            cursorY
                        );

                        lastHoverCheck = now;
                    }

                    detectSwipe(lm);
                }
            }
        });

        /* 双手缩放 */

        if(
            results.multiHandLandmarks.length === 2
        ){

            const hand1 =
                results.multiHandLandmarks[0];

            const hand2 =
                results.multiHandLandmarks[1];

            const d =
                distance(
                    hand1[8],
                    hand2[8]
                );

            const targetSize =
                Math.max(
                    16,
                    Math.min(
                        42,
                        d * 120
                    )
                );

            fontSize +=
                (targetSize - fontSize)
                * 0.15;

            bookPage.style.fontSize =
                fontSize + "px";
        }

        nameDom.innerText =
            resultTexts.join("\n");

    }else{

        nameDom.innerText =
            "未检测到手势";
    }
});

let cameraStarted = false;

/* 启动 */

async function startCamera(){

    if(cameraStarted){

        return;
    }

    cameraStarted = true;

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{

                    facingMode:"user",

                    width:{
                        ideal:isMobile ? 1280 : 960
                    },

                    height:{
                        ideal:isMobile ? 720 : 720
                    }
                },

                audio:false
            });

        video.srcObject = stream;

        controlVideo.srcObject = stream;

        await video.play();

        await controlVideo.play();

        resizeCanvas();

        const camera =
            new Camera(video,{

                onFrame:async()=>{

                    await hands.send({
                        image:video
                    });
                },

                width:
                    isMobile ? 1280 : 960,

                height:
                    isMobile ? 720 : 720
            });

        camera.start();

        loading.style.display =
            "none";

    }catch(err){

        cameraStarted = false;

        console.error(err);

        loading.innerText =
            "摄像头启动失败";
    }
}

document
.getElementById("startBtn")
.onclick = ()=>{

    startCamera();
};

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>
