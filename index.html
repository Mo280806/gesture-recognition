<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>AI 手势识别与操控系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:#ffffff;

    color:#163a63;

    overflow:hidden;
}

/* 页面 */

.page{

    width:100vw;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* 主容器 */

.container{

    width:min(920px,94vw);

    height:min(92vh,920px);

    display:flex;
    flex-direction:column;

    gap:18px;
}

/* 顶部模式切换 */

.mode-bar{

    display:flex;
    gap:12px;
}

.mode-btn{

    flex:1;

    border:none;

    background:#f4f7fb;

    color:#163a63;

    padding:14px;

    border-radius:16px;

    font-size:15px;

    cursor:pointer;

    border:1px solid #dbe5f0;

    transition:.25s;
}

.mode-btn.active{

    background:#163a63;

    color:white;
}

/* 相机区域 */

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:24px;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    box-shadow:
    0 10px 30px rgba(22,58,99,0.08);
}

video,
canvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

canvas{
    pointer-events:none;
}

/* 标题 */

.header{

    position:absolute;

    top:18px;
    left:20px;

    z-index:10;
}

.title{

    font-size:18px;
    font-weight:600;
}

.subtitle{

    margin-top:4px;

    font-size:13px;

    color:#6f8298;
}

/* 按钮 */

#startBtn{

    position:absolute;

    top:18px;
    right:18px;

    z-index:999;

    border:none;

    background:#163a63;

    color:white;

    padding:10px 16px;

    border-radius:12px;

    font-size:13px;

    cursor:pointer;
}

/* loading */

.loading{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:rgba(255,255,255,0.96);

    color:#163a63;

    border:1px solid #dce6f2;

    padding:14px 20px;

    border-radius:14px;

    font-size:13px;

    z-index:999;
}

/* 结果 */

.result-card{

    height:130px;

    border-radius:22px;

    background:#f8fafc;

    border:1px solid #dbe5f0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:8px;
}

.name{

    font-size:28px;

    font-weight:600;

    color:#163a63;
}

.desc{

    font-size:13px;

    color:#8091a5;
}

/* 操控页面 */

.control-page{

    width:100%;
    height:100%;

    position:relative;

    display:none;

    overflow:hidden;

    background:white;

    border-radius:24px;

    border:1px solid #dbe5f0;
}

/* 小相机 */

.small-camera{

    position:absolute;

    top:18px;
    left:18px;

    width:220px;
    height:160px;

    border-radius:18px;

    overflow:hidden;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    z-index:20;
}

.small-camera video,
.small-camera canvas{

    width:100%;
    height:100%;
}

/* 操控区 */

.control-content{

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:24px;

    transition:.35s;
}

.control-title{

    font-size:44px;

    font-weight:700;

    color:#163a63;

    transition:.25s;
}

.control-text{

    font-size:20px;

    color:#6f8298;

    transition:.25s;
}

/* 点赞动画 */

.like{

    position:absolute;

    font-size:80px;

    animation:likeUp 1s forwards;
}

@keyframes likeUp{

    0%{
        opacity:0;
        transform:translateY(40px) scale(.5);
    }

    30%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:translateY(-180px) scale(1.5);
    }
}

/* 手机 */

@media(max-width:768px){

    .container{

        width:100vw;
        height:100vh;

        padding:14px;
    }

    .small-camera{

        width:140px;
        height:110px;
    }

    .control-title{

        font-size:30px;
    }

    .control-text{

        font-size:16px;
    }

    .name{

        font-size:22px;
    }
}

</style>
</head>

<body>

<div class="page">

<div class="container">

    <!-- 模式切换 -->

    <div class="mode-bar">

        <button
            class="mode-btn active"
            id="recognitionBtn">

            手势识别
        </button>

        <button
            class="mode-btn"
            id="controlBtn">

            手势操控
        </button>

    </div>

    <!-- 手势识别模式 -->

    <div
        id="recognitionPage"
        style="
        display:flex;
        flex-direction:column;
        gap:18px;
        flex:1;
        "
    >

        <div class="camera-card">

            <div class="header">

                <div class="title">
                    手势识别系统
                </div>

                <div class="subtitle">
                    数字 / OK / 摇滚 / 点赞 等
                </div>

            </div>

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <canvas id="canvas"></canvas>

            <button id="startBtn">
                启动识别
            </button>

            <div class="loading" id="loading">
                点击右上角启动摄像头
            </div>

        </div>

        <div class="result-card">

            <div class="name" id="name">
                等待识别
            </div>

            <div class="desc">
                实时 AI 手势识别
            </div>

        </div>

    </div>

    <!-- 手势操控模式 -->

    <div class="control-page" id="controlPage">

        <!-- 小相机 -->

        <div class="small-camera">

            <video
                id="controlVideo"
                autoplay
                muted
                playsinline>
            </video>

            <canvas id="controlCanvas"></canvas>

        </div>

        <!-- 操控内容 -->

        <div
            class="control-content"
            id="controlContent">

            <div
                class="control-title"
                id="controlTitle">

                AI 手势操控
            </div>

            <div
                class="control-text"
                id="controlText">

                食指方向控制页面移动
            </div>

        </div>

    </div>

</div>

</div>

<script>

/* DOM */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const controlVideo =
    document.getElementById("controlVideo");

const controlCanvas =
    document.getElementById("controlCanvas");

const controlCtx =
    controlCanvas.getContext("2d");

const nameDom =
    document.getElementById("name");

const loading =
    document.getElementById("loading");

const recognitionPage =
    document.getElementById("recognitionPage");

const controlPage =
    document.getElementById("controlPage");

const controlContent =
    document.getElementById("controlContent");

const controlTitle =
    document.getElementById("controlTitle");

const controlText =
    document.getElementById("controlText");

/* 模式 */

let currentMode =
    "recognition";

/* 切换 */

document
.getElementById("recognitionBtn")
.onclick = ()=>{

    currentMode =
        "recognition";

    recognitionPage.style.display =
        "flex";

    controlPage.style.display =
        "none";

    document
    .getElementById("recognitionBtn")
    .classList.add("active");

    document
    .getElementById("controlBtn")
    .classList.remove("active");
};

document
.getElementById("controlBtn")
.onclick = ()=>{

    currentMode =
        "control";

    recognitionPage.style.display =
        "none";

    controlPage.style.display =
        "block";

    document
    .getElementById("controlBtn")
    .classList.add("active");

    document
    .getElementById("recognitionBtn")
    .classList.remove("active");
};

/* resize */

function resizeCanvas(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    controlCanvas.width =
        controlVideo.videoWidth;

    controlCanvas.height =
        controlVideo.videoHeight;
}

/* 工具 */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

/* 手势识别 */

function recognize(lm){

    /* 改进点赞 */

    const thumbUp =
        lm[4].y < lm[3].y &&
        lm[3].y < lm[2].y;

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const thumbIndexNear =
        distance(lm[4],lm[8]) < 0.06;

    /* 握拳优先 */

    if(
        !thumbUp &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "握拳";
    }

    if(
        thumbUp &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "点赞";
    }

    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "数字1";
    }

    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){
        return "数字2 / 剪刀";
    }

    if(
        index &&
        middle &&
        ring &&
        !pinky
    ){
        return "数字3";
    }

    if(
        index &&
        middle &&
        ring &&
        pinky &&
        !thumbUp
    ){
        return "数字4";
    }

    if(
        thumbUp &&
        index &&
        middle &&
        ring &&
        pinky
    ){
        return "数字5 / 张开手掌";
    }

    if(
        thumbUp &&
        pinky &&
        !index &&
        !middle &&
        !ring
    ){
        return "数字6 / 打电话";
    }

    if(
        thumbIndexNear &&
        middle &&
        ring &&
        pinky
    ){
        return "OK";
    }

    if(
        index &&
        pinky &&
        !middle &&
        !ring
    ){
        return "摇滚";
    }

    if(
        thumbUp &&
        index &&
        pinky &&
        !middle &&
        !ring
    ){
        return "我爱你";
    }

    return "识别中...";
}

/* 绘制 */

function drawHand(points,targetCtx,w,h){

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    targetCtx.strokeStyle =
        "#163a63";

    targetCtx.lineWidth = 2;

    for(const [a,b] of lines){

        targetCtx.beginPath();

        targetCtx.moveTo(
            points[a].x * w,
            points[a].y * h
        );

        targetCtx.lineTo(
            points[b].x * w,
            points[b].y * h
        );

        targetCtx.stroke();
    }

    for(const p of points){

        targetCtx.beginPath();

        targetCtx.arc(
            p.x * w,
            p.y * h,
            4,
            0,
            Math.PI * 2
        );

        targetCtx.fillStyle =
            "#163a63";

        targetCtx.fill();
    }
}

/* MediaPipe */

const hands = new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:0.65,

    minTrackingConfidence:0.65
});

/* 状态 */

let likeLock = false;

/* 识别 */

hands.onResults(results => {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    controlCtx.clearRect(
        0,
        0,
        controlCanvas.width,
        controlCanvas.height
    );

    if(
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        let texts = [];

        for(const lm of results.multiHandLandmarks){

            drawHand(
                lm,
                ctx,
                canvas.width,
                canvas.height
            );

            drawHand(
                lm,
                controlCtx,
                controlCanvas.width,
                controlCanvas.height
            );

            const result =
                recognize(lm);

            texts.push(result);

            /* 操控模式 */

            if(
                currentMode === "control"
            ){

                const indexTip =
                    lm[8];

                const wrist =
                    lm[0];

                /* 上下左右 */

                if(
                    indexTip.x < wrist.x - 0.18
                ){

                    controlContent.style.transform =
                        "translateX(-120px)";

                    controlText.innerText =
                        "向左移动";
                }

                else if(
                    indexTip.x > wrist.x + 0.18
                ){

                    controlContent.style.transform =
                        "translateX(120px)";

                    controlText.innerText =
                        "向右移动";
                }

                else if(
                    indexTip.y < wrist.y - 0.18
                ){

                    controlContent.style.transform =
                        "translateY(-100px)";

                    controlText.innerText =
                        "向上移动";
                }

                else if(
                    indexTip.y > wrist.y + 0.18
                ){

                    controlContent.style.transform =
                        "translateY(100px)";

                    controlText.innerText =
                        "向下移动";
                }

                else{

                    controlContent.style.transform =
                        "translate(0,0)";
                }

                /* 握拳缩小 */

                if(result === "握拳"){

                    controlTitle.style.transform =
                        "scale(0.7)";

                    controlText.innerText =
                        "握拳缩小";
                }

                /* 张开放大 */

                if(
                    result ===
                    "数字5 / 张开手掌"
                ){

                    controlTitle.style.transform =
                        "scale(1.4)";

                    controlText.innerText =
                        "张开手掌放大";
                }

                /* 点赞 */

                if(
                    result === "点赞" &&
                    !likeLock
                ){

                    likeLock = true;

                    showLike();

                    controlText.innerText =
                        "点赞成功";
                }

                if(
                    result !== "点赞"
                ){

                    likeLock = false;
                }
            }
        }

        if(
            currentMode === "recognition"
        ){

            nameDom.innerText =
                texts.join(" + ");
        }

    }else{

        nameDom.innerText =
            "未检测到手";
    }
});

/* 点赞动画 */

function showLike(){

    const like =
        document.createElement("div");

    like.className =
        "like";

    like.innerText =
        "👍";

    like.style.left =
        Math.random()*60 + 20 + "%";

    like.style.top =
        "60%";

    controlPage.appendChild(like);

    setTimeout(()=>{

        like.remove();

    },1000);
}

/* 启动 */

async function startCamera(){

    try{

        loading.innerText =
            "正在启动摄像头...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false
            });

        video.srcObject =
            stream;

        controlVideo.srcObject =
            stream;

        await video.play();

        await controlVideo.play();

        resizeCanvas();

        loading.style.display =
            "none";

        const camera =
            new Camera(video,{

                onFrame:async()=>{

                    await hands.send({
                        image:video
                    });
                },

                width:640,
                height:480
            });

        camera.start();

    }catch(err){

        console.error(err);

        loading.innerText =
            "摄像头启动失败";
    }
}

/* 启动按钮 */

document
.getElementById("startBtn")
.onclick = ()=>{

    startCamera();
};

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>

</body>
</html>
