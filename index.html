<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势体感控制识别</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #0a0a0a;
            color: #fff;
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }
        @media (min-width: 768px) {
            body { flex-direction: row; }
        }
        @media (max-width: 767px) {
            body { flex-direction: column; }
            .video-container { height: 65vh; }
            .action-panel { height: 35vh; }
            .action-icon { font-size: 60px; }
            .action-name { font-size: 24px; }
        }
        .video-container {
            flex: 3;
            position: relative;
            height: 100vh;
            padding: 10px;
        }
        .camera-box {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #00ff8833;
            background: #000;
        }
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            pointer-events: none;
            transform: scaleX(-1);
        }
        .action-panel {
            flex: 1;
            background: #181818;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }
        .action-title {
            font-size: 26px;
            color: #00ff88;
        }
        .action-icon {
            font-size: 90px;
        }
        .action-name {
            font-size: 32px;
            font-weight: bold;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px 30px;
            border-radius: 10px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="camera-box">
            <video autoplay playsinline muted id="video"></video>
            <canvas id="canvas"></canvas>
        </div>
        <div class="loading" id="loading">加载模型中...</div>
    </div>
    <div class="action-panel">
        <div class="action-title">📡 手势识别</div>
        <div class="action-icon" id="action-icon">🤚</div>
        <div class="action-name" id="action-name">等待识别</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const actionIcon = document.getElementById('action-icon');
        const actionName = document.getElementById('action-name');

        let model;
        let lastGesture = "";
        let stable = 0;

        async function loadModel() {
            try {
                await tf.setBackend('webgl');
                await tf.ready();
                model = await handpose.load({ maxHands: 1 });
                loading.style.display = 'none';
                startCamera();
            } catch (e) {
                loading.innerText = "模型加载失败";
            }
        }

        async function startCamera() {
            const constraints = {
                video: {
                    facingMode: 'user',
                    width: { ideal: 480 },
                    height: { ideal: 360 },
                    frameRate: { max: 15 }
                }
            };
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    video.play();
                    detect();
                };
            } catch (err) {
                loading.innerText = "摄像头权限异常";
            }
        }

        async function detect() {
            if (!model) return requestAnimationFrame(detect);
            try {
                const predictions = await model.estimateHands(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (predictions.length > 0) {
                    const landmarks = predictions[0].landmarks;
                    drawHand(landmarks);
                    const res = recognize(landmarks);
                    res.name === lastGesture ? stable++ : (stable = 0, lastGesture = res.name);
                    if (stable > 3) {
                        actionIcon.innerText = res.icon;
                        actionName.innerText = res.name;
                    }
                } else {
                    actionIcon.innerText = "🤚";
                    actionName.innerText = "未检测到手";
                    stable = 0;
                }
            } catch (e) {}
            setTimeout(() => requestAnimationFrame(detect), 50);
        }

        function drawHand(pts) {
            ctx.fillStyle = "#ff0000";
            pts.forEach(p => {
                ctx.beginPath();
                ctx.arc(p[0], p[1], 4, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.strokeStyle = "#00ff00";
            ctx.lineWidth = 2;
            const conn = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20]];
            conn.forEach(([a,b])=>{
                ctx.beginPath();
                ctx.moveTo(pts[a][0], pts[a][1]);
                ctx.lineTo(pts[b][0], pts[b][1]);
                ctx.stroke();
            });
        }

        function getD(p1,p2){
            return Math.hypot(p1[0]-p2[0], p1[1]-p2[1]);
        }

        function recognize(lm) {
            const iu = getD(lm[8], lm[6]) > 22;
            const mu = getD(lm[12], lm[10]) > 22;
            const ru = getD(lm[16], lm[14]) > 22;
            const pu = getD(lm[20], lm[18]) > 22;
            const tu = getD(lm[4], lm[3]) > 20;
            const cnt = [iu,mu,ru,pu].filter(i=>i).length;

            if (cnt === 0 && !tu) return { icon: "✊", name: "握拳" };
            if (iu && mu && !ru && !pu) return { icon: "✌️", name: "剪刀手" };
            if (tu && cnt === 0) return { icon: "👍", name: "点赞" };
            if (cnt >= 4 && tu) return { icon: "✋", name: "手掌张开" };
            if (iu && !mu && !ru && !pu) return { icon: "☝️", name: "数字1" };
            return { icon: "🤚", name: "识别中" };
        }

        loadModel();
    </script>
</body>
</html>
