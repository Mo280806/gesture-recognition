<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI 手势交互系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:#ffffff;

    overflow:hidden;

    color:#163a63;
}

/* 顶部模式切换 */

.top-bar{

    position:fixed;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:12px;

    z-index:9999;
}

.mode-btn{

    border:none;

    padding:12px 20px;

    border-radius:14px;

    background:#eef4fb;

    color:#163a63;

    font-size:14px;

    cursor:pointer;

    transition:0.25s;
}

.mode-btn.active{

    background:#163a63;

    color:white;
}

/* 小摄像头 */

.camera-box{

    position:fixed;

    top:20px;
    left:20px;

    width:260px;
    height:190px;

    border-radius:20px;

    overflow:hidden;

    background:#f4f7fb;

    border:1px solid #dce6f2;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);

    z-index:999;
}

video,
canvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

canvas{
    pointer-events:none;
}

/* 主界面 */

.main{

    width:100vw;
    height:100vh;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:26px;
}

/* 中央文字 */

.center-text{

    font-size:60px;

    font-weight:700;

    transition:0.25s;

    color:#163a63;
}

/* 引导 */

.tip{

    font-size:16px;

    color:#6f8298;
}

/* 点赞动画 */

.like{

    position:fixed;

    font-size:60px;

    animation:likeAnim 1s ease forwards;

    pointer-events:none;
}

@keyframes likeAnim{

    0%{
        transform:translateY(0) scale(0.5);
        opacity:0;
    }

    40%{
        opacity:1;
    }

    100%{
        transform:translateY(-140px) scale(1.5);
        opacity:0;
    }
}

/* 页面平移动画 */

.slide-left{
    animation:slideLeft 0.5s;
}

.slide-right{
    animation:slideRight 0.5s;
}

.slide-up{
    animation:slideUp 0.5s;
}

.slide-down{
    animation:slideDown 0.5s;
}

@keyframes slideLeft{
    from{
        transform:translateX(100px);
        opacity:0;
    }
}

@keyframes slideRight{
    from{
        transform:translateX(-100px);
        opacity:0;
    }
}

@keyframes slideUp{
    from{
        transform:translateY(100px);
        opacity:0;
    }
}

@keyframes slideDown{
    from{
        transform:translateY(-100px);
        opacity:0;
    }
}

/* 光标 */

.cursor{

    position:fixed;

    width:26px;
    height:26px;

    border-radius:50%;

    background:#163a63;

    pointer-events:none;

    z-index:99999;

    transition:
    left 0.05s linear,
    top 0.05s linear;
}

/* 手机 */

@media(max-width:768px){

    .camera-box{

        width:170px;
        height:130px;
    }

    .center-text{

        font-size:36px;
    }

    .tip{

        width:90%;
        text-align:center;
    }
}

</style>
</head>

<body>

<!-- 模式切换 -->

<div class="top-bar">

    <button
        class="mode-btn active"
        id="recognizeBtn">

        手势识别
    </button>

    <button
        class="mode-btn"
        id="controlBtn">

        手势操控
    </button>

</div>

<!-- 摄像头 -->

<div class="camera-box">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="canvas"></canvas>

</div>

<!-- 光标 -->

<div class="cursor" id="cursor"></div>

<!-- 主界面 -->

<div class="main">

    <div
        class="center-text"
        id="mainText">

        等待识别
    </div>

    <div class="tip">

        握拳缩小文字 · 张开手放大文字 · 点赞触发点赞动画 · 左右上下挥手切换动画

    </div>

</div>

<script>

/* DOM */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const textDom =
    document.getElementById("mainText");

const cursor =
    document.getElementById("cursor");

const recognizeBtn =
    document.getElementById("recognizeBtn");

const controlBtn =
    document.getElementById("controlBtn");

/* mode */

let mode = "recognize";

/* buttons */

recognizeBtn.onclick = ()=>{

    mode = "recognize";

    recognizeBtn.classList.add("active");

    controlBtn.classList.remove("active");

    textDom.innerText =
        "等待识别";
};

controlBtn.onclick = ()=>{

    mode = "control";

    controlBtn.classList.add("active");

    recognizeBtn.classList.remove("active");

    textDom.innerText =
        "手势操控模式";
};

/* resize */

function resizeCanvas(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;
}

/* utils */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

/* gesture */

function recognize(lm){

    const thumb =
        lm[4].x < lm[3].x;

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const thumbIndexNear =
        distance(lm[4],lm[8]) < 0.06;

    /* fist */

    if(
        !thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "握拳";
    }

    /* open */

    if(
        thumb &&
        index &&
        middle &&
        ring &&
        pinky
    ){
        return "张开";
    }

    /* thumbs up */

    if(
        thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "点赞";
    }

    /* ok */

    if(
        thumbIndexNear &&
        middle &&
        ring &&
        pinky
    ){
        return "OK";
    }

    /* left */

    if(
        index &&
        !middle &&
        !ring &&
        pinky
    ){
        return "滑动";
    }

    return "识别中";
}

/* draw hand */

function drawHand(points){

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    ctx.strokeStyle =
        "#163a63";

    ctx.lineWidth = 2;

    for(const [a,b] of lines){

        ctx.beginPath();

        ctx.moveTo(
            points[a].x * canvas.width,
            points[a].y * canvas.height
        );

        ctx.lineTo(
            points[b].x * canvas.width,
            points[b].y * canvas.height
        );

        ctx.stroke();
    }

    for(const p of points){

        ctx.beginPath();

        ctx.arc(
            p.x * canvas.width,
            p.y * canvas.height,
            4,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#163a63";

        ctx.fill();
    }
}

/* effects */

function showLike(){

    const div =
        document.createElement("div");

    div.className =
        "like";

    div.innerText =
        "👍";

    div.style.left =
        Math.random() * window.innerWidth + "px";

    div.style.top =
        window.innerHeight * 0.7 + "px";

    document.body.appendChild(div);

    setTimeout(()=>{

        div.remove();

    },1000);
}

function animatePage(type){

    textDom.classList.remove(
        "slide-left",
        "slide-right",
        "slide-up",
        "slide-down"
    );

    void textDom.offsetWidth;

    textDom.classList.add(type);
}

/* MediaPipe */

const hands = new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

/* tracking */

let lastX = 0;
let lastY = 0;

hands.onResults(results => {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        const lm =
            results.multiHandLandmarks[0];

        drawHand(lm);

        /* 光标 */

        const x =
            (1 - lm[8].x)
            * window.innerWidth;

        const y =
            lm[8].y
            * window.innerHeight;

        cursor.style.left =
            x + "px";

        cursor.style.top =
            y + "px";

        const gesture =
            recognize(lm);

        /* 普通识别模式 */

        if(mode === "recognize"){

            textDom.innerText =
                gesture;
        }

        /* 控制模式 */

        if(mode === "control"){

            /* 缩放 */

            if(gesture === "握拳"){

                textDom.style.fontSize =
                    "36px";

                textDom.innerText =
                    "缩小";
            }

            if(gesture === "张开"){

                textDom.style.fontSize =
                    "90px";

                textDom.innerText =
                    "放大";
            }

            /* 点赞 */

            if(gesture === "点赞"){

                textDom.innerText =
                    "已点赞";

                showLike();
            }

            /* 滑动 */

            const dx =
                x - lastX;

            const dy =
                y - lastY;

            if(Math.abs(dx) > 120){

                if(dx > 0){

                    textDom.innerText =
                        "向右滑动";

                    animatePage(
                        "slide-right"
                    );

                }else{

                    textDom.innerText =
                        "向左滑动";

                    animatePage(
                        "slide-left"
                    );
                }
            }

            if(Math.abs(dy) > 120){

                if(dy > 0){

                    textDom.innerText =
                        "向下滑动";

                    animatePage(
                        "slide-down"
                    );

                }else{

                    textDom.innerText =
                        "向上滑动";

                    animatePage(
                        "slide-up"
                    );
                }
            }

            lastX = x;
            lastY = y;
        }

    }else{

        textDom.innerText =
            "未检测到手";
    }
});

/* start */

async function startCamera(){

    const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user"
            },

            audio:false
        });

    video.srcObject = stream;

    await video.play();

    resizeCanvas();

    const camera =
        new Camera(video,{

            onFrame:async()=>{

                await hands.send({
                    image:video
                });
            },

            width:640,
            height:480
        });

    camera.start();
}

startCamera();

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>

</body>
</html>
