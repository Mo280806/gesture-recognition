<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能手势识别</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 电脑布局：左相机 右面板 */
        @media (min-width: 768px) {
            body { flex-direction: row; }
        }

        /* 手机布局：上相机 下面板 */
        @media (max-width: 767px) {
            body { flex-direction: column; }
            .video-container { height: 65vh; }
            .action-panel { height: 35vh; padding: 15px; gap: 10px; }
            .action-title { font-size: 20px; }
            .action-icon { font-size: 60px; }
            .action-name { font-size: 24px; }
        }

        /* 视频容器 + 高级边框 */
        .video-container {
            flex: 3;
            position: relative;
            height: 100vh;
            padding: 12px;
            background: #111;
        }

        .camera-box {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid rgba(0, 255, 120, 0.3);
            box-shadow: 0 0 30px rgba(0,0,0,0.7);
        }

        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        canvas {
            pointer-events: none;
        }

        /* 右侧识别面板 */
        .action-panel {
            flex: 1;
            background: linear-gradient(180deg, #181818, #0f0f0f);
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            border-left: 1px solid #333;
        }

        .action-title {
            font-size: 26px;
            color: #00ff80;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(0,255,120,0.3);
        }

        .action-icon {
            font-size: 90px;
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.2));
        }

        .action-name {
            font-size: 32px;
            font-weight: bold;
            color: #f0f0f0;
            text-align: center;
        }

        /* 加载遮罩 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            padding: 22px 35px;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            z-index: 999;
            border: 1px solid #444;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <div class="camera-box">
            <video autoplay playsinline muted id="video"></video>
            <canvas id="canvas"></canvas>
        </div>
        <div class="loading" id="loading">正在加载AI模型，请稍候...</div>
    </div>

    <div class="action-panel">
        <div class="action-title">📡 实时手势识别</div>
        <div class="action-icon" id="action-icon">🤚</div>
        <div class="action-name" id="action-name">等待识别</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loadingText = document.getElementById('loading');
        const actionIcon = document.getElementById('action-icon');
        const actionName = document.getElementById('action-name');

        let model;
        let lastGesture = "等待识别";
        let stableCount = 0;
        const STABLE_THRESHOLD = 5; // 防抖：连续识别5次才更新

        // 加载模型
        async function loadModel() {
            try {
                model = await handpose.load();
                loadingText.style.display = 'none';
                await startCamera();
            } catch (e) {
                loadingText.innerText = "模型加载失败！";
                console.error(e);
            }
        }

        // 启动摄像头
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: 640, height: 480 }
                });
                video.srcObject = stream;

                return new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        video.play();
                        detectFrame();
                        resolve();
                    };
                });
            } catch (err) {
                loadingText.innerText = "❌ 摄像头权限被拒绝";
                console.error(err);
            }
        }

        // 实时检测循环
        async function detectFrame() {
            if (!model || video.readyState !== 4) {
                requestAnimationFrame(detectFrame);
                return;
            }

            try {
                const predictions = await model.estimateHands(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                if (predictions.length > 0) {
                    const landmarks = predictions[0].landmarks;
                    drawHand(ctx, landmarks);
                    
                    const gesture = recognizeGesture(landmarks);
                    
                    // 防抖稳定识别
                    if (gesture.name === lastGesture) {
                        stableCount++;
                    } else {
                        stableCount = 0;
                        lastGesture = gesture.name;
                    }

                    if (stableCount >= STABLE_THRESHOLD) {
                        actionIcon.innerText = gesture.icon;
                        actionName.innerText = gesture.name;
                    }
                } else {
                    actionIcon.innerText = "🤚";
                    actionName.innerText = "未检测到手";
                    stableCount = 0;
                }
            } catch (e) {
                console.warn("检测异常", e);
            }

            requestAnimationFrame(detectFrame);
        }

        // 绘制手部关键点
        function drawHand(ctx, landmarks) {
            // 画点
            landmarks.forEach(point => {
                ctx.beginPath();
                ctx.arc(point[0], point[1], 5, 0, 2 * Math.PI);
                ctx.fillStyle = "#ff3333";
                ctx.fill();
            });

            // 画线
            const connections = [
                [0,1],[1,2],[2,3],[3,4],
                [0,5],[5,6],[6,7],[7,8],
                [0,9],[9,10],[10,11],[11,12],
                [0,13],[13,14],[14,15],[15,16],
                [0,17],[17,18],[18,19],[19,20],
                [5,9],[9,13],[13,17]
            ];

            ctx.strokeStyle = "#00ff80";
            ctx.lineWidth = 3;
            connections.forEach(([s, e]) => {
                ctx.beginPath();
                ctx.moveTo(landmarks[s][0], landmarks[s][1]);
                ctx.lineTo(landmarks[e][0], landmarks[e][1]);
                ctx.stroke();
            });
        }

        // 两点距离
        function getDistance(p1, p2) {
            return Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
        }

        // 增强版手势识别
        function recognizeGesture(landmarks) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];

            const indexBase = landmarks[6];
            const middleBase = landmarks[10];
            const ringBase = landmarks[14];
            const pinkyBase = landmarks[18];
            const thumbBase = landmarks[3];

            // 判断手指是否伸直
            const isUp = (tip, base) => getDistance(tip, base) > 25;

            const indexUp = isUp(indexTip, indexBase);
            const middleUp = isUp(middleTip, middleBase);
            const ringUp = isUp(ringTip, ringBase);
            const pinkyUp = isUp(pinkyTip, pinkyBase);
            const thumbUp = isUp(thumbTip, thumbBase);

            const upCount = [indexUp, middleUp, ringUp, pinkyUp].filter(Boolean).length;

            // 识别逻辑
            if (upCount === 0 && !thumbUp) return { icon: "✊", name: "握拳" };
            if (indexUp && middleUp && !ringUp && !pinkyUp) return { icon: "✌️", name: "剪刀手" };
            if (thumbUp && upCount === 0) return { icon: "👍", name: "点赞" };
            if (upCount >= 4 && thumbUp) return { icon: "✋", name: "手掌张开" };
            if (indexUp && !middleUp && !ringUp && !pinkyUp) return { icon: "☝️", name: "数字1" };

            return { icon: "🤚", name: "识别中" };
        }

        // 启动
        loadModel();
    </script>
</body>
</html>
