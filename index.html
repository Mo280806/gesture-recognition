<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 手势交互系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:#ffffff;

    color:#163a63;

    overflow:hidden;
}

/* 顶部导航 */

.nav{

    width:100%;

    height:72px;

    border-bottom:1px solid #e4edf5;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:16px;

    background:white;

    z-index:99;
}

.nav button{

    border:none;

    background:#edf3fa;

    color:#163a63;

    padding:12px 24px;

    border-radius:14px;

    cursor:pointer;

    font-size:14px;

    transition:0.25s;
}

.nav button.active{

    background:#163a63;

    color:white;
}

/* 页面 */

.page{

    width:100vw;

    height:calc(100vh - 72px);

    display:none;
}

.page.active{

    display:flex;
}

/* ===================== */
/* 手势识别页面 */
/* ===================== */

.detect-page{

    justify-content:center;

    align-items:center;
}

.detect-wrap{

    width:min(920px,94vw);

    height:min(90vh,900px);

    display:flex;

    flex-direction:column;

    gap:18px;
}

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:24px;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    box-shadow:
    0 10px 30px rgba(22,58,99,0.08);
}

video,
canvas{

    position:absolute;

    width:100%;

    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

canvas{

    pointer-events:none;
}

.header{

    position:absolute;

    top:18px;

    left:20px;

    z-index:10;
}

.title{

    font-size:18px;

    font-weight:600;

    color:#163a63;
}

.subtitle{

    margin-top:4px;

    font-size:13px;

    color:#6f8298;
}

.result-card{

    height:120px;

    border-radius:22px;

    background:#f8fafc;

    border:1px solid #dbe5f0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:6px;
}

.result-text{

    font-size:30px;

    font-weight:600;
}

.result-desc{

    font-size:13px;

    color:#8091a5;
}

/* ===================== */
/* 手势操控页面 */
/* ===================== */

.control-page{

    position:relative;

    width:100%;

    height:100%;
}

/* 左上角小窗 */

.small-camera{

    position:absolute;

    top:22px;

    left:22px;

    width:250px;

    height:190px;

    border-radius:20px;

    overflow:hidden;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    box-shadow:
    0 8px 24px rgba(22,58,99,0.08);

    z-index:10;
}

/* 中间文字 */

.control-text{

    position:absolute;

    top:50%;

    left:50%;

    transform:
    translate(-50%,-50%);

    font-size:64px;

    font-weight:700;

    color:#163a63;

    transition:0.35s;
}

/* 点赞动画 */

.like{

    position:absolute;

    top:100px;

    right:80px;

    font-size:88px;

    opacity:0;

    transform:scale(0.5);

    transition:0.4s;
}

.like.show{

    opacity:1;

    transform:scale(1.2);
}

/* 引导 */

.tip{

    position:absolute;

    bottom:34px;

    width:100%;

    text-align:center;

    color:#7d90a5;

    font-size:14px;
}

/* 手机适配 */

@media(max-width:768px){

    .detect-wrap{

        width:100vw;

        height:100%;

        padding:14px;
    }

    .small-camera{

        width:180px;

        height:140px;
    }

    .control-text{

        font-size:42px;
    }

    .result-text{

        font-size:24px;
    }
}

</style>
</head>

<body>

<!-- 导航 -->

<div class="nav">

    <button
        class="active"
        id="detectBtn">

        手势识别
    </button>

    <button
        id="controlBtn">

        手势操控
    </button>

</div>

<!-- 手势识别 -->

<div
    class="page detect-page active"
    id="detectPage">

    <div class="detect-wrap">

        <div class="camera-card">

            <div class="header">

                <div class="title">
                    手势识别系统
                </div>

                <div class="subtitle">
                    双手 / 数字 / OK / 点赞 / 摇滚
                </div>

            </div>

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <canvas id="canvas"></canvas>

        </div>

        <div class="result-card">

            <div
                class="result-text"
                id="resultText">

                等待识别
            </div>

            <div class="result-desc">

                实时 AI 手势识别

            </div>

        </div>

    </div>

</div>

<!-- 手势操控 -->

<div
    class="page control-page"
    id="controlPage">

    <div class="small-camera">

        <video
            id="video2"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="canvas2"></canvas>

    </div>

    <div
        class="control-text"
        id="controlText">

        张开手放大
    </div>

    <div
        class="like"
        id="like">

        👍
    </div>

    <div class="tip">

        握拳缩小 · 张开放大 · 左右挥动移动 · 点赞触发动画

    </div>

</div>

<script>

/* 页面切换 */

const detectBtn =
document.getElementById("detectBtn");

const controlBtn =
document.getElementById("controlBtn");

const detectPage =
document.getElementById("detectPage");

const controlPage =
document.getElementById("controlPage");

detectBtn.onclick = ()=>{

    detectBtn.classList.add("active");
    controlBtn.classList.remove("active");

    detectPage.classList.add("active");
    controlPage.classList.remove("active");
};

controlBtn.onclick = ()=>{

    controlBtn.classList.add("active");
    detectBtn.classList.remove("active");

    controlPage.classList.add("active");
    detectPage.classList.remove("active");
};

/* 元素 */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const video2 =
document.getElementById("video2");

const canvas2 =
document.getElementById("canvas2");

const ctx2 =
canvas2.getContext("2d");

const resultText =
document.getElementById("resultText");

const controlText =
document.getElementById("controlText");

const like =
document.getElementById("like");

/* resize */

function resize(){

    canvas.width =
    video.videoWidth;

    canvas.height =
    video.videoHeight;

    canvas2.width =
    video2.videoWidth;

    canvas2.height =
    video2.videoHeight;
}

/* 判断 */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}

/* 识别 */

function recognize(lm){

    const thumbUp =
    lm[4].y < lm[3].y;

    const index =
    fingerUp(lm[8],lm[6]);

    const middle =
    fingerUp(lm[12],lm[10]);

    const ring =
    fingerUp(lm[16],lm[14]);

    const pinky =
    fingerUp(lm[20],lm[18]);

    const ok =
    distance(lm[4],lm[8]) < 0.06;

    /* 点赞 */

    if(
        thumbUp &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){

        return "点赞";
    }

    /* 数字1 */

    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){

        return "数字1";
    }

    /* 数字2 */

    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){

        return "数字2 / 剪刀";
    }

    /* 数字3 */

    if(
        index &&
        middle &&
        ring &&
        !pinky
    ){

        return "数字3";
    }

    /* 数字4 */

    if(
        index &&
        middle &&
        ring &&
        pinky &&
        !thumbUp
    ){

        return "数字4";
    }

    /* 数字5 */

    if(
        thumbUp &&
        index &&
        middle &&
        ring &&
        pinky
    ){

        return "数字5 / 张开手掌";
    }

    /* 握拳 */

    if(
        !thumbUp &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){

        return "握拳";
    }

    /* OK */

    if(
        ok &&
        middle &&
        ring &&
        pinky
    ){

        return "OK";
    }

    /* 摇滚 */

    if(
        index &&
        pinky &&
        !middle &&
        !ring
    ){

        return "摇滚";
    }

    /* 打电话 */

    if(
        thumbUp &&
        pinky &&
        !index &&
        !middle &&
        !ring
    ){

        return "打电话 / 数字6";
    }

    return "识别中...";
}

/* 绘制 */

function drawHand(points,ctx,w,h){

    ctx.clearRect(0,0,w,h);

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    ctx.strokeStyle =
    "#163a63";

    ctx.lineWidth = 2;

    for(const [a,b] of lines){

        ctx.beginPath();

        ctx.moveTo(
            points[a].x*w,
            points[a].y*h
        );

        ctx.lineTo(
            points[b].x*w,
            points[b].y*h
        );

        ctx.stroke();
    }

    for(const p of points){

        ctx.beginPath();

        ctx.arc(
            p.x*w,
            p.y*h,
            4,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
        "#163a63";

        ctx.fill();
    }
}

/* MediaPipe */

const hands =
new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

/* 结果 */

hands.onResults(results=>{

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    ctx2.clearRect(
        0,0,
        canvas2.width,
        canvas2.height
    );

    if(
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        let texts = [];

        for(const lm of results.multiHandLandmarks){

            drawHand(
                lm,
                ctx,
                canvas.width,
                canvas.height
            );

            drawHand(
                lm,
                ctx2,
                canvas2.width,
                canvas2.height
            );

            texts.push(
                recognize(lm)
            );
        }

        const text =
        texts.join(" + ");

        /* 原识别 */

        resultText.innerText =
        text;

        /* 操控逻辑 */

        if(text.includes("握拳")){

            controlText.style.fontSize =
            "34px";

            controlText.innerText =
            "文字缩小";
        }

        if(text.includes("数字5")){

            controlText.style.fontSize =
            "84px";

            controlText.innerText =
            "文字放大";
        }

        if(text.includes("数字1")){

            controlText.style.transform =
            "translate(-65%,-50%)";

            controlText.innerText =
            "向左移动";
        }

        if(text.includes("数字2")){

            controlText.style.transform =
            "translate(-35%,-50%)";

            controlText.innerText =
            "向右移动";
        }

        if(text.includes("点赞")){

            like.classList.add("show");

            controlText.innerText =
            "已点赞";

            setTimeout(()=>{

                like.classList.remove("show");

            },500);
        }

    }else{

        resultText.innerText =
        "未检测到手";
    }
});

/* 摄像头 */

async function startCamera(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user",
                width:{ideal:640},
                height:{ideal:480}
            },

            audio:false
        });

        video.srcObject = stream;
        video2.srcObject = stream;

        await video.play();
        await video2.play();

        resize();

        const camera =
        new Camera(video,{

            onFrame:async()=>{

                await hands.send({
                    image:video
                });
            },

            width:640,
            height:480
        });

        camera.start();

    }catch(err){

        alert("摄像头启动失败");
    }
}

startCamera();

window.addEventListener(
    "resize",
    resize
);

</script>

</body>
</html>
