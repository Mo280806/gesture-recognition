<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI 手势交互系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:#ffffff;

    color:#163a63;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;
}

/* 主容器 */

.container{

    width:min(980px,95vw);

    height:min(94vh,940px);

    display:flex;

    flex-direction:column;

    gap:18px;
}

/* 顶部 */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.logo{

    font-size:22px;

    font-weight:700;

    color:#163a63;
}

.mode-box{

    display:flex;

    gap:10px;
}

.mode-btn{

    border:none;

    background:#eef3f9;

    color:#163a63;

    padding:10px 18px;

    border-radius:12px;

    font-size:14px;

    cursor:pointer;

    transition:0.25s;
}

.mode-btn.active{

    background:#163a63;

    color:white;
}

/* 摄像头区域 */

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:28px;

    background:#f5f8fc;

    border:1px solid #dce6f2;

    box-shadow:
    0 10px 30px rgba(22,58,99,0.08);
}

video,
canvas{

    position:absolute;

    width:100%;

    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

canvas{
    pointer-events:none;
}

/* 状态栏 */

.status{

    position:absolute;

    top:18px;

    left:20px;

    z-index:10;

    background:rgba(255,255,255,0.9);

    padding:10px 14px;

    border-radius:14px;

    font-size:13px;

    color:#163a63;

    backdrop-filter:blur(10px);
}

/* 启动按钮 */

#startBtn{

    position:absolute;

    top:18px;

    right:18px;

    z-index:999;

    border:none;

    background:#163a63;

    color:white;

    padding:12px 18px;

    border-radius:14px;

    cursor:pointer;

    font-size:13px;
}

/* loading */

.loading{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:white;

    padding:16px 22px;

    border-radius:14px;

    font-size:13px;

    z-index:999;
}

/* 结果区域 */

.bottom-panel{

    height:170px;

    border-radius:26px;

    background:#f8fafc;

    border:1px solid #dce6f2;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:10px;

    position:relative;

    overflow:hidden;
}

.result{

    font-size:34px;

    font-weight:700;

    color:#163a63;
}

.desc{

    font-size:13px;

    color:#71859a;
}

/* 点赞 */

.like-box{

    position:absolute;

    right:24px;

    top:20px;

    display:flex;

    align-items:center;

    gap:8px;

    font-size:15px;

    color:#163a63;
}

.like-heart{

    color:#ff3d6e;

    font-size:20px;
}

/* 菜单 */

.menu{

    display:flex;

    gap:14px;

    margin-top:10px;
}

.menu-item{

    padding:12px 20px;

    border-radius:14px;

    background:#eef3f9;

    color:#163a63;

    transition:0.25s;

    font-size:14px;
}

.menu-item.active{

    background:#163a63;

    color:white;

    transform:scale(1.05);
}

/* 光标 */

.cursor{

    position:absolute;

    width:22px;

    height:22px;

    border-radius:50%;

    background:#163a63;

    border:4px solid white;

    z-index:20;

    pointer-events:none;

    transition:0.05s linear;
}

/* 页码 */

.page{

    position:absolute;

    left:24px;

    bottom:18px;

    font-size:13px;

    color:#6c7f92;
}

/* 手机 */

@media(max-width:768px){

    .container{

        width:100vw;

        height:100vh;

        padding:14px;
    }

    .result{

        font-size:26px;
    }

    .menu{

        flex-wrap:wrap;

        justify-content:center;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- 顶部 -->

    <div class="topbar">

        <div class="logo">
            AI 手势交互系统
        </div>

        <div class="mode-box">

            <button
                class="mode-btn active"
                id="recognizeMode">

                手势识别
            </button>

            <button
                class="mode-btn"
                id="controlMode">

                手势操控
            </button>

        </div>

    </div>

    <!-- 摄像头 -->

    <div class="camera-card">

        <div class="status"
             id="status">

            ● 等待启动
        </div>

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="canvas"></canvas>

        <div class="cursor"
             id="cursor"></div>

        <button id="startBtn">
            启动摄像头
        </button>

        <div class="loading"
             id="loading">

            点击右上角启动
        </div>

    </div>

    <!-- 结果 -->

    <div class="bottom-panel">

        <div class="like-box">

            <span class="like-heart">
                ❤️
            </span>

            <span id="likeCount">
                0
            </span>

        </div>

        <div class="result"
             id="result">

            等待识别
        </div>

        <div class="desc">

            实时 AI 手势交互

        </div>

        <!-- 菜单 -->

        <div class="menu">

            <div class="menu-item"
                 id="menu1">

                首页
            </div>

            <div class="menu-item"
                 id="menu2">

                图片
            </div>

            <div class="menu-item"
                 id="menu3">

                设置
            </div>

        </div>

        <div class="page"
             id="page">

            当前页：1
        </div>

    </div>

</div>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const resultDom =
    document.getElementById("result");

const loading =
    document.getElementById("loading");

const statusDom =
    document.getElementById("status");

const cursor =
    document.getElementById("cursor");

const likeCountDom =
    document.getElementById("likeCount");

const pageDom =
    document.getElementById("page");

const recognizeBtn =
    document.getElementById("recognizeMode");

const controlBtn =
    document.getElementById("controlMode");

let mode = "recognize";

let likeCount = 0;

let currentPage = 1;

let lastGesture = "";

let lastX = 0;

let pageCooldown = false;

/* 模式切换 */

recognizeBtn.onclick = ()=>{

    mode = "recognize";

    recognizeBtn.classList.add("active");

    controlBtn.classList.remove("active");

    resultDom.innerText =
        "识别模式";
};

controlBtn.onclick = ()=>{

    mode = "control";

    controlBtn.classList.add("active");

    recognizeBtn.classList.remove("active");

    resultDom.innerText =
        "操控模式";
};

/* resize */

function resizeCanvas(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;
}

/* 手指 */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}

/* 手势识别 */

function recognize(lm){

    const thumb =
        lm[4].x < lm[3].x;

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const thumbNear =
        distance(lm[4],lm[8]) < 0.06;

    if(
        thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "点赞";
    }

    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "数字1";
    }

    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){
        return "数字2";
    }

    if(
        thumbNear &&
        middle &&
        ring &&
        pinky
    ){
        return "OK";
    }

    if(
        thumb &&
        pinky &&
        !index &&
        !middle &&
        !ring
    ){
        return "打电话";
    }

    if(
        !thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "握拳";
    }

    if(
        index &&
        middle &&
        ring &&
        pinky &&
        thumb
    ){
        return "张开手掌";
    }

    return "识别中...";
}

/* 绘制 */

function drawHand(points){

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    ctx.strokeStyle =
        "#163a63";

    ctx.lineWidth = 2;

    for(const [a,b] of lines){

        ctx.beginPath();

        ctx.moveTo(
            points[a].x * canvas.width,
            points[a].y * canvas.height
        );

        ctx.lineTo(
            points[b].x * canvas.width,
            points[b].y * canvas.height
        );

        ctx.stroke();
    }

    for(const p of points){

        ctx.beginPath();

        ctx.arc(
            p.x * canvas.width,
            p.y * canvas.height,
            4,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            "#163a63";

        ctx.fill();
    }
}

/* 菜单交互 */

function updateMenu(x,y){

    const items =
        document.querySelectorAll(".menu-item");

    items.forEach(item=>{

        item.classList.remove("active");

        const rect =
            item.getBoundingClientRect();

        if(

            x > rect.left &&
            x < rect.right &&
            y > rect.top &&
            y < rect.bottom
        ){

            item.classList.add("active");

            resultDom.innerText =
                "已选择：" +
                item.innerText;
        }
    });
}

/* 翻页 */

function handleSwipe(x){

    if(pageCooldown) return;

    if(x - lastX > 0.15){

        currentPage++;

        pageDom.innerText =
            "当前页：" +
            currentPage;

        pageCooldown = true;

        setTimeout(()=>{

            pageCooldown = false;

        },1000);
    }

    if(lastX - x > 0.15){

        currentPage--;

        if(currentPage < 1)
            currentPage = 1;

        pageDom.innerText =
            "当前页：" +
            currentPage;

        pageCooldown = true;

        setTimeout(()=>{

            pageCooldown = false;

        },1000);
    }

    lastX = x;
}

/* 点赞 */

function handleLike(gesture,lm){

    const thumbDown =
        lm[4].y > lm[3].y;

    if(
        gesture === "点赞" &&
        lastGesture !== "点赞"
    ){

        likeCount++;

        likeCountDom.innerText =
            likeCount;
    }

    if(
        thumbDown &&
        lastGesture !== "取消点赞"
    ){

        likeCount--;

        if(likeCount < 0)
            likeCount = 0;

        likeCountDom.innerText =
            likeCount;

        lastGesture =
            "取消点赞";
    }
}

/* MediaPipe */

const hands = new Hands({

    locateFile:file=>{

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

hands.onResults(results=>{

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(

        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        statusDom.innerText =
            "● 检测到手势";

        const lm =
            results.multiHandLandmarks[0];

        drawHand(lm);

        const gesture =
            recognize(lm);

        if(mode === "recognize"){

            resultDom.innerText =
                gesture;
        }

        /* 操控模式 */

        if(mode === "control"){

            const finger =
                lm[8];

            const x =
                (1-finger.x)
                * window.innerWidth;

            const y =
                finger.y
                * window.innerHeight;

            cursor.style.left =
                x + "px";

            cursor.style.top =
                y + "px";

            updateMenu(x,y);

            handleSwipe(finger.x);

            handleLike(
                gesture,
                lm
            );

            resultDom.innerText =
                "操控中";
        }

        lastGesture =
            gesture;

    }else{

        statusDom.innerText =
            "● 未检测到手";

        resultDom.innerText =
            "等待识别";
    }
});

/* 启动 */

async function startCamera(){

    try{

        loading.innerText =
            "正在启动摄像头...";

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false
            });

        video.srcObject =
            stream;

        await video.play();

        resizeCanvas();

        loading.style.display =
            "none";

        statusDom.innerText =
            "● 摄像头已连接";

        const camera =
            new Camera(video,{

                onFrame:async()=>{

                    await hands.send({
                        image:video
                    });
                },

                width:640,
                height:480
            });

        camera.start();

    }catch(err){

        console.error(err);

        loading.innerText =
            "摄像头启动失败";
    }
}

document
.getElementById("startBtn")
.onclick = ()=>{

    startCamera();
};

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>

</body>
</html>
