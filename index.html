<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI 手势阅读系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:#eef3f9;

    overflow:hidden;

    color:#163a63;
}

/* ========================= */
/* 顶部按钮 */
/* ========================= */

.top-bar{

    position:fixed;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:12px;

    z-index:99999;
}

.mode-btn{

    border:none;

    padding:12px 22px;

    border-radius:14px;

    background:#ffffff;

    color:#163a63;

    font-size:14px;

    cursor:pointer;

    transition:0.25s;

    box-shadow:
    0 4px 18px rgba(0,0,0,0.06);
}

.mode-btn.active{

    background:#163a63;

    color:white;
}

/* ========================= */
/* 阅读界面 */
/* ========================= */

.reader-page{

    width:100vw;
    height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    position:relative;
}

/* ========================= */
/* 悬浮摄像头 */
/* ========================= */

.floating-camera{

    position:fixed;

    top:20px;
    left:20px;

    width:240px;
    height:180px;

    border-radius:22px;

    overflow:hidden;

    background:#fff;

    border:1px solid #d8e3f1;

    box-shadow:
    0 14px 35px rgba(22,58,99,0.12);

    z-index:9999;

    backdrop-filter:blur(12px);
}

#video,
#canvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

#canvas{
    pointer-events:none;
}

/* ========================= */
/* 阅读器 */
/* ========================= */

.reader-container{

    width:min(980px,86vw);

    height:min(78vh,820px);

    background:white;

    border-radius:32px;

    box-shadow:
    0 20px 60px rgba(22,58,99,0.12);

    border:1px solid #dbe5f0;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    position:relative;
}

.reader-header{

    height:72px;

    border-bottom:1px solid #e6edf5;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 30px;

    flex-shrink:0;
}

.reader-title{

    font-size:22px;

    font-weight:700;
}

.page-info{

    font-size:14px;

    color:#7c8ea3;
}

/* ========================= */
/* 小说区域 */
/* ========================= */

.reader-content{

    flex:1;

    padding:42px;

    overflow:hidden;

    position:relative;
}

.book-page{

    width:100%;
    height:100%;

    line-height:2.2;

    font-size:24px;

    color:#1d2b3a;

    transition:0.25s;

    overflow-y:auto;

    user-select:none;
}

/* 左右阅读 */

.horizontal-mode{

    column-count:2;

    column-gap:60px;
}

/* 夜间模式 */

.night{

    background:#10151d;
}

.night .reader-container{

    background:#1a2029;

    border-color:#2d3644;
}

.night .reader-header{

    border-color:#2d3644;
}

.night .reader-title,
.night .book-page{

    color:#edf3fb;
}

.night .page-info{

    color:#94a4ba;
}

/* ========================= */
/* 底部按钮 */
/* ========================= */

.control-panel{

    height:92px;

    border-top:1px solid #e6edf5;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    flex-wrap:wrap;

    padding:12px;
}

.control-btn{

    min-width:110px;

    height:48px;

    border:none;

    border-radius:16px;

    background:#edf3fb;

    color:#163a63;

    font-size:15px;

    cursor:pointer;

    transition:0.2s;

    position:relative;
}

.control-btn.hovering{

    background:#163a63;

    color:white;

    transform:scale(1.08);
}

/* ========================= */
/* 光标 */
/* ========================= */

.cursor{

    position:fixed;

    width:24px;
    height:24px;

    border-radius:50%;

    background:#163a63;

    box-shadow:
    0 0 24px rgba(22,58,99,0.4);

    pointer-events:none;

    z-index:999999;

    transition:
    left 0.05s linear,
    top 0.05s linear;
}

/* ========================= */
/* 手势状态 */
/* ========================= */

.gesture-status{

    position:fixed;

    bottom:24px;

    left:50%;

    transform:translateX(-50%);

    background:rgba(255,255,255,0.9);

    backdrop-filter:blur(10px);

    border:1px solid #dbe5f0;

    border-radius:18px;

    padding:12px 22px;

    font-size:14px;

    color:#5f748d;

    z-index:99999;

    box-shadow:
    0 10px 25px rgba(22,58,99,0.08);
}

.gesture-text{

    font-size:16px;

    color:#163a63;

    font-weight:700;

    margin-top:4px;
}

/* ========================= */
/* 菜单 */
/* ========================= */

.menu-panel{

    position:absolute;

    right:20px;
    top:86px;

    width:240px;

    background:white;

    border-radius:20px;

    border:1px solid #dbe5f0;

    box-shadow:
    0 15px 35px rgba(22,58,99,0.12);

    padding:18px;

    display:none;

    z-index:999;
}

.menu-panel.show{

    display:block;
}

.menu-item{

    padding:14px;

    border-radius:14px;

    cursor:pointer;

    transition:0.2s;

    margin-bottom:8px;

    background:#f4f8fd;
}

.menu-item:hover{

    background:#163a63;

    color:white;
}

@media(max-width:768px){

    .floating-camera{

        width:160px;
        height:120px;
    }

    .reader-container{

        width:92vw;
        height:82vh;
    }

    .book-page{

        font-size:18px;
    }

    .control-btn{

        min-width:90px;
        font-size:13px;
    }
}

</style>
</head>

<body>

<!-- 顶部 -->

<div class="top-bar">

    <button class="mode-btn active">
        AI 手势阅读系统
    </button>

</div>

<!-- 摄像头 -->

<div class="floating-camera">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="canvas"></canvas>

</div>

<!-- 光标 -->

<div
    class="cursor"
    id="cursor">
</div>

<!-- 阅读页面 -->

<div class="reader-page">

    <div class="reader-container">

        <!-- 头部 -->

        <div class="reader-header">

            <div class="reader-title">
                《星空旅人》
            </div>

            <div
                class="page-info"
                id="pageInfo">

                第 1 页 / 共 3 页
            </div>

        </div>

        <!-- 内容 -->

        <div class="reader-content">

            <div
                class="book-page"
                id="bookPage">
            </div>

            <!-- 菜单 -->

            <div
                class="menu-panel"
                id="menuPanel">

                <div
                    class="menu-item"
                    onclick="toggleNight()">

                    🌙 日间 / 夜间
                </div>

                <div
                    class="menu-item"
                    onclick="fontIncrease()">

                    ➕ 字体放大
                </div>

                <div
                    class="menu-item"
                    onclick="fontDecrease()">

                    ➖ 字体缩小
                </div>

                <div
                    class="menu-item"
                    onclick="switchVertical()">

                    ↕ 上下阅读
                </div>

                <div
                    class="menu-item"
                    onclick="switchHorizontal()">

                    ↔ 左右阅读
                </div>

            </div>

        </div>

        <!-- 按钮 -->

        <div class="control-panel">

            <button
                class="control-btn"
                data-action="prev">

                上一页
            </button>

            <button
                class="control-btn"
                data-action="next">

                下一页
            </button>

            <button
                class="control-btn"
                data-action="menu">

                菜单
            </button>

        </div>

    </div>

</div>

<!-- 手势状态 -->

<div class="gesture-status">

    当前识别手势

    <div
        class="gesture-text"
        id="gestureText">

        等待识别
    </div>

</div>

<script>

/* ========================= */
/* DOM */
/* ========================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const cursor =
    document.getElementById("cursor");

const gestureText =
    document.getElementById("gestureText");

const bookPage =
    document.getElementById("bookPage");

const pageInfo =
    document.getElementById("pageInfo");

const menuPanel =
    document.getElementById("menuPanel");

const buttons =
    document.querySelectorAll(".control-btn");

/* ========================= */
/* 小说内容 */
/* ========================= */

const pages = [

`深夜的列车穿过无人的山谷。

林澈坐在靠窗的位置，看着远处缓慢后退的灯火。车厢里很安静，只能听见铁轨轻轻震动的声音。

忽然，广播响起：

“终点站即将到达，请旅客提前整理随身物品。”

他低头，看见口袋中的那张车票正在微微发光。`,

`列车停下时，外面却并不是城市。

月光下，是一片巨大的湖泊。

湖面像镜子一样平静，而湖中央漂浮着一座白色钟塔。

林澈缓缓走下列车。

远处传来低沉钟声。

他突然意识到，这里并不是现实世界。`,

`钟塔的大门缓缓开启。

无数星光从塔内流出，像银河一样铺满地面。

一个声音在黑暗中轻轻响起：

“欢迎来到时间尽头。”

林澈抬起头。

夜空中的星辰，正在缓慢旋转。`
];

let currentPage = 0;

function renderPage(){

    bookPage.innerText =
        pages[currentPage];

    pageInfo.innerText =
        `第 ${currentPage + 1} 页 / 共 ${pages.length} 页`;
}

renderPage();

/* ========================= */
/* 页面控制 */
/* ========================= */

function nextPage(){

    if(currentPage < pages.length - 1){

        currentPage++;

        renderPage();
    }
}

function prevPage(){

    if(currentPage > 0){

        currentPage--;

        renderPage();
    }
}

function toggleMenu(){

    menuPanel.classList.toggle("show");
}

function toggleNight(){

    document.body.classList.toggle("night");
}

let fontSize = 24;

function fontIncrease(){

    fontSize += 2;

    bookPage.style.fontSize =
        fontSize + "px";
}

function fontDecrease(){

    fontSize -= 2;

    if(fontSize < 16){

        fontSize = 16;
    }

    bookPage.style.fontSize =
        fontSize + "px";
}

function switchHorizontal(){

    bookPage.classList.add(
        "horizontal-mode"
    );
}

function switchVertical(){

    bookPage.classList.remove(
        "horizontal-mode"
    );
}

/* ========================= */
/* Canvas */
/* ========================= */

function resizeCanvas(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;
}

/* ========================= */
/* 工具 */
/* ========================= */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

/* ========================= */
/* 手势识别 */
/* ========================= */

function recognize(lm){

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const thumbUp =
        lm[4].y < lm[3].y &&
        lm[3].y < lm[2].y;

    const thumbPalmDistance =
        distance(lm[4],lm[9]);

    /* 握拳 */

    if(

        thumbPalmDistance < 0.16 &&

        !index &&
        !middle &&
        !ring &&
        !pinky

    ){

        return "握拳";
    }

    /* 张手 */

    if(

        index &&
        middle &&
        ring &&
        pinky

    ){

        return "张开手掌";
    }

    /* 点赞 */

    if(

        thumbUp &&

        !index &&
        !middle &&
        !ring &&
        !pinky

    ){

        return "点赞";
    }

    /* 食指 */

    if(

        index &&
        !middle &&
        !ring &&
        !pinky

    ){

        return "食指";
    }

    return "识别中";
}

/* ========================= */
/* 绘制骨架 */
/* ========================= */

function drawHand(points,w,h){

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    ctx.strokeStyle =
        "#163a63";

    ctx.lineWidth = 2;

    for(const [a,b] of lines){

        ctx.beginPath();

        ctx.moveTo(
            points[a].x * w,
            points[a].y * h
        );

        ctx.lineTo(
            points[b].x * w,
            points[b].y * h
        );

        ctx.stroke();
    }
}

/* ========================= */
/* Hover 点击 */
/* ========================= */

let hoverTarget = null;

let hoverStart = 0;

function hoverClick(x,y){

    let found = null;

    buttons.forEach(btn=>{

        const rect =
            btn.getBoundingClientRect();

        if(

            x >= rect.left &&
            x <= rect.right &&
            y >= rect.top &&
            y <= rect.bottom

        ){

            found = btn;
        }

        btn.classList.remove(
            "hovering"
        );
    });

    if(found){

        found.classList.add(
            "hovering"
        );

        if(hoverTarget !== found){

            hoverTarget = found;

            hoverStart = Date.now();
        }

        if(

            Date.now() - hoverStart > 2000

        ){

            triggerButton(
                found.dataset.action
            );

            hoverStart =
                Date.now();
        }

    }else{

        hoverTarget = null;
    }
}

/* ========================= */
/* 按钮动作 */
/* ========================= */

function triggerButton(action){

    if(action === "next"){

        nextPage();
    }

    if(action === "prev"){

        prevPage();
    }

    if(action === "menu"){

        toggleMenu();
    }
}

/* ========================= */
/* 挥手翻页 */
/* ========================= */

let lastX = null;

let lastY = null;

let lastSwipeTime = 0;

function detectSwipe(lm){

    const now = Date.now();

    const x = lm[8].x;

    const y = lm[8].y;

    if(lastX !== null){

        const dx = x - lastX;

        const dy = y - lastY;

        if(

            now - lastSwipeTime > 1000

        ){

            /* 左右 */

            if(Math.abs(dx) > 0.18){

                if(dx > 0){

                    prevPage();

                }else{

                    nextPage();
                }

                lastSwipeTime = now;
            }

            /* 上下 */

            if(Math.abs(dy) > 0.18){

                if(dy > 0){

                    nextPage();

                }else{

                    prevPage();
                }

                lastSwipeTime = now;
            }
        }
    }

    lastX = x;

    lastY = y;
}

/* ========================= */
/* MediaPipe */
/* ========================= */

const hands = new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

/* ========================= */
/* results */
/* ========================= */

hands.onResults(results => {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(

        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0

    ){

        const lm =
            results.multiHandLandmarks[0];

        drawHand(
            lm,
            canvas.width,
            canvas.height
        );

        const gesture =
            recognize(lm);

        gestureText.innerText =
            gesture;

        /* 光标 */

        const x =
            (1 - lm[8].x)
            * window.innerWidth;

        const y =
            lm[8].y
            * window.innerHeight;

        cursor.style.left =
            x + "px";

        cursor.style.top =
            y + "px";

        /* Hover 点击 */

        hoverClick(x,y);

        /* 挥手翻页 */

        detectSwipe(lm);

    }else{

        gestureText.innerText =
            "未检测到手";
    }
});

/* ========================= */
/* 启动 */
/* ========================= */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false
            });

        video.srcObject = stream;

        await video.play();

        resizeCanvas();

        const camera =
            new Camera(video,{

                onFrame:async()=>{

                    await hands.send({
                        image:video
                    });
                },

                width:640,
                height:480
            });

        camera.start();

    }catch(err){

        console.error(err);

        alert("摄像头启动失败");
    }
}

startCamera();

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>

</body>
</html>
