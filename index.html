<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能手势体感控制</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: #080810;
            color: #fff;
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            body { flex-direction: row; }
        }

        @media (max-width: 767px) {
            body { flex-direction: column; }
            .video-container { height: 60vh; }
            .action-panel { height: 40vh; padding: 20px; gap: 12px; }
            .action-icon { font-size: 60px; }
            .action-title { font-size: 20px; }
            .action-name { font-size: 24px; }
        }

        .video-container {
            flex: 3;
            position: relative;
            height: 100vh;
            padding: 12px;
        }

        .camera-frame {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid rgba(0, 220, 255, 0.3);
            box-shadow: 0 0 40px rgba(0,180,255,0.15), inset 0 0 30px rgba(0,0,0,0.4);
            background: #000;
            position: relative;
        }

        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            pointer-events: none;
            transform: scaleX(-1);
        }

        .action-panel {
            flex: 1;
            background: linear-gradient(180deg, #121218, #0c0c14);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            border-left: 1px solid #252535;
        }

        .action-title {
            font-size: 28px;
            color: #00dcff;
            text-shadow: 0 0 12px rgba(0,220,255,0.4);
            letter-spacing: 1px;
        }

        .action-icon {
            font-size: 100px;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));
            min-height: 110px;
        }

        .action-name {
            font-size: 36px;
            font-weight: bold;
            color: #f0f0f5;
            text-align: center;
            text-shadow: 0 0 10px rgba(255,255,255,0.15);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 24px 36px;
            border-radius: 14px;
            text-align: center;
            font-size: 17px;
            z-index: 999;
            border: 1px solid #334;
        }
    </style>
</head>

<body>
    <div class="video-container">
        <div class="camera-frame">
            <video autoplay playsinline muted id="video"></video>
            <canvas id="canvas"></canvas>
        </div>
        <div class="loading" id="loading">正在加载AI模型...</div>
    </div>

    <div class="action-panel">
        <div class="action-title">🤖 实时手势识别</div>
        <div class="action-icon" id="action-icon">🤚</div>
        <div class="action-name" id="action-name">等待识别</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const actionIcon = document.getElementById('action-icon');
        const actionName = document.getElementById('action-name');

        let model;
        let lastGesture = "";
        let stableCount = 0;
        const STABLE = 4;

        async function loadModel() {
            try {
                await tf.setBackend('webgl');
                await tf.ready();
                model = await handpose.load({ maxHands: 1 });
                loading.style.display = 'none';
                startCamera();
            } catch (e) {
                loading.innerText = "加载失败";
            }
        }

        async function startCamera() {
            const opt = {
                video: { facingMode: 'user', width: 480, height: 360, frameRate: 15 }
            };
            try {
                const stream = await navigator.mediaDevices.getUserMedia(opt);
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    video.play();
                    detectLoop();
                };
            } catch (err) {
                loading.innerText = "摄像头权限被拒绝";
            }
        }

        async function detectLoop() {
            if (!model) return requestAnimationFrame(detectLoop);

            try {
                const res = await model.estimateHands(video);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (res.length > 0) {
                    const lm = res[0].landmarks;
                    drawHand(lm);
                    const gesture = getGesture(lm);

                    if (gesture.name === lastGesture) stableCount++;
                    else { stableCount = 0; lastGesture = gesture.name; }

                    if (stableCount >= STABLE) {
                        actionIcon.innerText = gesture.icon;
                        actionName.innerText = gesture.name;
                    }
                } else {
                    actionIcon.innerText = "🤚";
                    actionName.innerText = "未检测到手";
                    stableCount = 0;
                }
            } catch (e) {}

            setTimeout(() => requestAnimationFrame(detectLoop), 45);
        }

        function drawHand(pts) {
            ctx.fillStyle = "#ff3050";
            pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, 6.28); ctx.fill(); });

            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2;
            const links = [
                [0,1],[1,2],[2,3],[3,4],
                [0,5],[5,6],[6,7],[7,8],
                [0,9],[9,10],[10,11],[11,12],
                [0,13],[13,14],[14,15],[15,16],
                [0,17],[17,18],[18,19],[19,20]
            ];
            links.forEach(([a,b]) => {
                ctx.beginPath();
                ctx.moveTo(pts[a][0], pts[a][1]);
                ctx.lineTo(pts[b][0], pts[b][1]);
                ctx.stroke();
            });
        }

        function d(a,b) {
            return Math.hypot(a[0]-b[0], a[1]-b[1]);
        }

        function getGesture(lm) {
            const thumbTip = lm[4], thumbMid = lm[3];
            const indexTip = lm[8], indexMid = lm[6];
            const midTip = lm[12], midMid = lm[10];
            const ringTip = lm[16], ringMid = lm[14];
            const pinkTip = lm[20], pinkMid = lm[18];

            // 精细判定阈值
            const thumbUp = d(thumbTip, thumbMid) > 18;
            const indexUp = d(indexTip, indexMid) > 24;
            const midUp = d(midTip, midMid) > 24;
            const ringUp = d(ringTip, ringMid) > 24;
            const pinkUp = d(pinkTip, pinkMid) > 24;

            const thumbIndexClose = d(thumbTip, indexTip) < 32;
            const fingerCount = [indexUp, midUp, ringUp, pinkUp].filter(Boolean).length;

            // 优先级从特殊手势到数字手势
            if(thumbIndexClose && midUp && ringUp && pinkUp) return { icon: "👌", name: "OK手势" };
            if(thumbUp && pinkUp && !indexUp && !midUp && !ringUp) return { icon: "🤘", name: "666/摇滚" };
            if(thumbUp && !indexUp && !midUp && !ringUp && !pinkUp) return { icon: "👍", name: "点赞" };
            if(thumbUp && indexUp && midUp && ringUp && pinkUp) return { icon: "🤙", name: "打电话" };
            if(!indexUp && !midUp && !ringUp && !pinkUp && !thumbUp) return { icon: "✊", name: "数字0/握拳" };
            if(indexUp && !midUp && !ringUp && !pinkUp && !thumbUp) return { icon: "☝️", name: "数字1" };
            if(indexUp && midUp && !ringUp && !pinkUp && !thumbUp) return { icon: "✌️", name: "数字2/剪刀" };
            if(indexUp && midUp && ringUp && !pinkUp && !thumbUp) return { icon: "🖑", name: "数字3" };
            if(indexUp && midUp && ringUp && pinkUp && !thumbUp) return { icon: "🖐️", name: "数字4" };
            if(indexUp && midUp && ringUp && pinkUp && thumbUp) return { icon: "✋", name: "数字5" };

            return { icon: "🤚", name: "识别中" };
        }

        loadModel();
    </script>
</body>
</html>
