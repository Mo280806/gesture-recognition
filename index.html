<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI手势交互阅读系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:#eef3f9;

    overflow:hidden;

    color:#163a63;
}

/* ========================= */
/* 顶部按钮 */
/* ========================= */

.top-bar{

    position:fixed;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:12px;

    z-index:999999;
}

.mode-btn{

    border:none;

    padding:12px 22px;

    border-radius:14px;

    background:#ffffff;

    color:#163a63;

    font-size:14px;

    cursor:pointer;

    transition:0.25s;

    box-shadow:
    0 4px 18px rgba(0,0,0,0.06);
}

.mode-btn.active{

    background:#163a63;

    color:white;
}

/* ========================= */
/* 手势识别页面 */
/* ========================= */

.recognize-page{

    width:100vw;
    height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;
}

.container{

    width:min(920px,94vw);

    height:min(92vh,920px);

    display:flex;

    flex-direction:column;

    gap:18px;
}

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:24px;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    box-shadow:
    0 10px 30px rgba(22,58,99,0.08);
}

#video,
#canvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

#canvas{
    pointer-events:none;
}

.header{

    position:absolute;

    top:18px;
    left:20px;

    z-index:10;
}

.title{

    font-size:18px;

    font-weight:600;
}

.subtitle{

    margin-top:4px;

    font-size:13px;

    color:#6f8298;
}

#startBtn{

    position:absolute;

    top:18px;
    right:18px;

    z-index:999;

    border:none;

    background:#163a63;

    color:white;

    padding:10px 16px;

    border-radius:12px;

    font-size:13px;

    cursor:pointer;
}

.loading{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:rgba(255,255,255,0.96);

    border:1px solid #dce6f2;

    padding:14px 20px;

    border-radius:14px;

    font-size:13px;

    z-index:999;
}

.result-card{

    height:130px;

    border-radius:22px;

    background:#f8fafc;

    border:1px solid #dbe5f0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:8px;
}

.name{

    font-size:28px;

    font-weight:600;
}

/* ========================= */
/* 手势操控页面 */
/* ========================= */

.control-page{

    width:100vw;
    height:100vh;

    display:none;

    position:relative;
}

/* 摄像头悬浮 */

.floating-camera{

    position:fixed;

    top:20px;
    left:20px;

    width:240px;
    height:180px;

    border-radius:20px;

    overflow:hidden;

    background:#ffffff;

    border:1px solid #dbe5f0;

    box-shadow:
    0 10px 30px rgba(22,58,99,0.08);

    z-index:99999;
}

#controlVideo,
#controlCanvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

#controlCanvas{
    pointer-events:none;
}

/* 阅读器 */

.reader-container{

    width:min(980px,86vw);

    height:min(82vh,860px);

    background:white;

    border-radius:32px;

    box-shadow:
    0 20px 60px rgba(22,58,99,0.12);

    border:1px solid #dbe5f0;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);
}

.reader-header{

    height:72px;

    border-bottom:1px solid #e6edf5;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 30px;
}

.reader-title{

    font-size:22px;

    font-weight:700;
}

.page-info{

    font-size:14px;

    color:#7c8ea3;
}

.reader-content{

    flex:1;

    padding:42px;

    overflow:hidden;

    position:relative;
}

.book-page{

    width:100%;
    height:100%;

    overflow-y:auto;

    line-height:2.2;

    font-size:24px;

    color:#1d2b3a;

    transition:0.25s;

    user-select:none;
}

.horizontal-mode{

    column-count:2;

    column-gap:60px;
}

/* 夜间模式 */

.night{

    background:#0f141b;
}

.night .reader-container{

    background:#1a2029;
}

.night .book-page,
.night .reader-title{

    color:#f0f4fa;
}

.night .page-info{

    color:#9aa9bc;
}

/* 控制栏 */

.control-panel{

    height:90px;

    border-top:1px solid #e6edf5;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    padding:10px;
}

.control-btn{

    min-width:120px;

    height:50px;

    border:none;

    border-radius:16px;

    background:#edf3fb;

    color:#163a63;

    font-size:15px;

    cursor:pointer;

    transition:0.2s;
}

.control-btn.hovering{

    background:#163a63;

    color:white;

    transform:scale(1.08);
}

/* 菜单 */

.menu-panel{

    position:absolute;

    right:20px;
    top:86px;

    width:250px;

    background:white;

    border-radius:20px;

    border:1px solid #dbe5f0;

    box-shadow:
    0 15px 35px rgba(22,58,99,0.12);

    padding:16px;

    display:none;

    z-index:999999;
}

.menu-panel.show{

    display:block;
}

.menu-item{

    width:100%;

    margin-bottom:10px;

    padding:14px;

    border-radius:14px;

    background:#f4f8fd;

    cursor:pointer;

    transition:0.2s;
}

.menu-item.hovering{

    background:#163a63;

    color:white;

    transform:scale(1.04);
}

/* 光标 */

.cursor{

    position:fixed;

    width:24px;
    height:24px;

    border-radius:50%;

    background:#163a63;

    box-shadow:
    0 0 20px rgba(22,58,99,0.4);

    pointer-events:none;

    z-index:9999999;

    transition:
    left 0.04s linear,
    top 0.04s linear;
}

/* 状态栏 */

.gesture-status{

    position:fixed;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    background:rgba(255,255,255,0.92);

    backdrop-filter:blur(10px);

    border:1px solid #dbe5f0;

    border-radius:18px;

    padding:12px 22px;

    font-size:14px;

    color:#5f748d;

    z-index:999999;
}

.gesture-text{

    margin-top:4px;

    font-size:16px;

    font-weight:700;

    color:#163a63;
}

@media(max-width:768px){

    .floating-camera{

        width:160px;
        height:120px;
    }

    .book-page{

        font-size:18px;
    }

    .reader-container{

        width:92vw;
    }
}

</style>
</head>

<body>

<!-- 顶部切换 -->

<div class="top-bar">

    <button
        class="mode-btn active"
        id="recognizeBtn">

        手势识别
    </button>

    <button
        class="mode-btn"
        id="controlBtn">

        手势阅读
    </button>

</div>

<!-- ========================= -->
<!-- 手势识别页面 -->
<!-- ========================= -->

<div
    class="recognize-page"
    id="recognizePage">

    <div class="container">

        <div class="camera-card">

            <div class="header">

                <div class="title">
                    手势识别系统
                </div>

                <div class="subtitle">
                    数字 / OK / 点赞 / 张手 / 握拳
                </div>

            </div>

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <canvas id="canvas"></canvas>

            <button id="startBtn">
                启动识别
            </button>

            <div
                class="loading"
                id="loading">

                点击右上角启动摄像头
            </div>

        </div>

        <div class="result-card">

            <div
                class="name"
                id="name">

                等待识别
            </div>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- 手势操控页面 -->
<!-- ========================= -->

<div
    class="control-page"
    id="controlPage">

    <!-- 悬浮摄像头 -->

    <div class="floating-camera">

        <video
            id="controlVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="controlCanvas"></canvas>

    </div>

    <!-- 光标 -->

    <div
        class="cursor"
        id="cursor">
    </div>

    <!-- 阅读器 -->

    <div class="reader-container">

        <div class="reader-header">

            <div class="reader-title">
                《星空旅人》
            </div>

            <div
                class="page-info"
                id="pageInfo">

                第1页 / 共3页
            </div>

        </div>

        <div class="reader-content">

            <div
                class="book-page"
                id="bookPage">
            </div>

            <!-- 菜单 -->

            <div
                class="menu-panel"
                id="menuPanel">

                <div
                    class="menu-item"
                    data-menu="night">

                    🌙 日间 / 夜间
                </div>

                <div
                    class="menu-item"
                    data-menu="big">

                    ➕ 字体放大
                </div>

                <div
                    class="menu-item"
                    data-menu="small">

                    ➖ 字体缩小
                </div>

                <div
                    class="menu-item"
                    data-menu="vertical">

                    ↕ 上下阅读
                </div>

                <div
                    class="menu-item"
                    data-menu="horizontal">

                    ↔ 左右阅读
                </div>

            </div>

        </div>

        <div class="control-panel">

            <button
                class="control-btn"
                data-action="prev">

                上一页
            </button>

            <button
                class="control-btn"
                data-action="next">

                下一页
            </button>

            <button
                class="control-btn"
                data-action="menu">

                菜单
            </button>

        </div>

    </div>

    <!-- 手势状态 -->

    <div class="gesture-status">

        当前手势

        <div
            class="gesture-text"
            id="gestureText">

            等待识别
        </div>

    </div>

</div>

<script>

/* ========================= */
/* DOM */
/* ========================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const controlVideo =
    document.getElementById("controlVideo");

const controlCanvas =
    document.getElementById("controlCanvas");

const controlCtx =
    controlCanvas.getContext("2d");

const nameDom =
    document.getElementById("name");

const loading =
    document.getElementById("loading");

const recognizeBtn =
    document.getElementById("recognizeBtn");

const controlBtn =
    document.getElementById("controlBtn");

const recognizePage =
    document.getElementById("recognizePage");

const controlPage =
    document.getElementById("controlPage");

const cursor =
    document.getElementById("cursor");

const gestureText =
    document.getElementById("gestureText");

const bookPage =
    document.getElementById("bookPage");

const pageInfo =
    document.getElementById("pageInfo");

const menuPanel =
    document.getElementById("menuPanel");

const buttons =
    document.querySelectorAll(".control-btn");

const menuItems =
    document.querySelectorAll(".menu-item");

/* ========================= */
/* 页面切换 */
/* ========================= */

recognizeBtn.onclick = ()=>{

    recognizeBtn.classList.add("active");

    controlBtn.classList.remove("active");

    recognizePage.style.display =
        "flex";

    controlPage.style.display =
        "none";
};

controlBtn.onclick = ()=>{

    controlBtn.classList.add("active");

    recognizeBtn.classList.remove("active");

    recognizePage.style.display =
        "none";

    controlPage.style.display =
        "block";
};

/* ========================= */
/* 小说 */
/* ========================= */

const pages = [

`深夜的列车穿过无人的山谷。

林澈坐在靠窗的位置，看着远处缓慢后退的灯火。

车厢里很安静，只能听见铁轨轻轻震动的声音。

忽然，广播响起：

“终点站即将到达，请旅客提前整理随身物品。”`,

`列车停下时，外面却并不是城市。

月光下，是一片巨大的湖泊。

湖面像镜子一样平静，而湖中央漂浮着一座白色钟塔。

林澈缓缓走下列车。`,

`钟塔的大门缓缓开启。

无数星光从塔内流出，像银河一样铺满地面。

一个声音在黑暗中轻轻响起：

“欢迎来到时间尽头。”`
];

let currentPage = 0;

function renderPage(){

    bookPage.innerText =
        pages[currentPage];

    pageInfo.innerText =
        `第 ${currentPage+1} 页 / 共 ${pages.length} 页`;
}

renderPage();

/* ========================= */
/* 页面控制 */
/* ========================= */

function nextPage(){

    if(currentPage < pages.length - 1){

        currentPage++;

        renderPage();
    }
}

function prevPage(){

    if(currentPage > 0){

        currentPage--;

        renderPage();
    }
}

function toggleMenu(){

    menuPanel.classList.toggle("show");
}

function toggleNight(){

    document.body.classList.toggle("night");
}

let fontSize = 24;

function fontIncrease(){

    fontSize += 2;

    bookPage.style.fontSize =
        fontSize + "px";
}

function fontDecrease(){

    fontSize -= 2;

    if(fontSize < 16){

        fontSize = 16;
    }

    bookPage.style.fontSize =
        fontSize + "px";
}

function switchHorizontal(){

    bookPage.classList.add(
        "horizontal-mode"
    );
}

function switchVertical(){

    bookPage.classList.remove(
        "horizontal-mode"
    );
}

/* ========================= */
/* resize */
/* ========================= */

function resizeCanvas(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    controlCanvas.width =
        controlVideo.videoWidth;

    controlCanvas.height =
        controlVideo.videoHeight;
}

/* ========================= */
/* 工具 */
/* ========================= */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

/* ========================= */
/* 手势识别 */
/* ========================= */

function recognize(lm){

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const thumbUp =
        lm[4].y < lm[3].y &&
        lm[3].y < lm[2].y;

    const thumbPalmDistance =
        distance(lm[4],lm[9]);

    if(

        thumbUp &&

        !index &&
        !middle &&
        !ring &&
        !pinky

    ){

        return "点赞";
    }

    if(

        thumbPalmDistance < 0.16 &&

        !index &&
        !middle &&
        !ring &&
        !pinky

    ){

        return "握拳";
    }

    if(

        index &&
        middle &&
        ring &&
        pinky

    ){

        return "张开手掌";
    }

    if(

        index &&
        !middle &&
        !ring &&
        !pinky

    ){

        return "数字1";
    }

    return "识别中";
}

/* ========================= */
/* 绘制 */
/* ========================= */

function drawHand(points,context,w,h){

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    context.strokeStyle =
        "#163a63";

    context.lineWidth = 2;

    for(const [a,b] of lines){

        context.beginPath();

        context.moveTo(
            points[a].x * w,
            points[a].y * h
        );

        context.lineTo(
            points[b].x * w,
            points[b].y * h
        );

        context.stroke();
    }
}

/* ========================= */
/* Hover 点击 */
/* ========================= */

let hoverTarget = null;

let hoverStart = 0;

function hoverDetect(x,y){

    const allTargets = [

        ...buttons,
        ...menuItems
    ];

    let found = null;

    allTargets.forEach(el=>{

        const rect =
            el.getBoundingClientRect();

        if(

            x >= rect.left &&
            x <= rect.right &&
            y >= rect.top &&
            y <= rect.bottom

        ){

            found = el;
        }

        el.classList.remove(
            "hovering"
        );
    });

    if(found){

        found.classList.add(
            "hovering"
        );

        if(hoverTarget !== found){

            hoverTarget = found;

            hoverStart = Date.now();
        }

        /* 1秒点击 */

        if(

            Date.now() - hoverStart > 1000

        ){

            autoClick(found);

            hoverStart =
                Date.now() + 999999;
        }

    }else{

        hoverTarget = null;
    }
}

/* ========================= */
/* 自动点击 */
/* ========================= */

function autoClick(el){

    /* 主按钮 */

    if(el.dataset.action){

        const action =
            el.dataset.action;

        if(action === "next"){

            nextPage();
        }

        if(action === "prev"){

            prevPage();
        }

        if(action === "menu"){

            toggleMenu();
        }
    }

    /* 菜单按钮 */

    if(el.dataset.menu){

        const menu =
            el.dataset.menu;

        if(menu === "night"){

            toggleNight();
        }

        if(menu === "big"){

            fontIncrease();
        }

        if(menu === "small"){

            fontDecrease();
        }

        if(menu === "horizontal"){

            switchHorizontal();
        }

        if(menu === "vertical"){

            switchVertical();
        }
    }
}

/* ========================= */
/* 挥手翻页 */
/* ========================= */

let lastX = null;

let lastY = null;

let lastSwipeTime = 0;

function detectSwipe(lm){

    const now = Date.now();

    const x = lm[8].x;

    const y = lm[8].y;

    if(lastX !== null){

        const dx = x - lastX;

        const dy = y - lastY;

        if(now - lastSwipeTime > 1200){

            /* 左右翻页 */

            if(Math.abs(dx) > 0.20){

                if(dx > 0){

                    prevPage();

                }else{

                    nextPage();
                }

                lastSwipeTime = now;
            }

            /* 上下翻页 */

            if(Math.abs(dy) > 0.20){

                if(dy > 0){

                    nextPage();

                }else{

                    prevPage();
                }

                lastSwipeTime = now;
            }
        }
    }

    lastX = x;

    lastY = y;
}

/* ========================= */
/* MediaPipe */
/* ========================= */

const hands = new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

/* ========================= */
/* results */
/* ========================= */

hands.onResults(results => {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    controlCtx.clearRect(
        0,
        0,
        controlCanvas.width,
        controlCanvas.height
    );

    if(

        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0

    ){

        const lm =
            results.multiHandLandmarks[0];

        drawHand(
            lm,
            ctx,
            canvas.width,
            canvas.height
        );

        drawHand(
            lm,
            controlCtx,
            controlCanvas.width,
            controlCanvas.height
        );

        const gesture =
            recognize(lm);

        nameDom.innerText =
            gesture;

        gestureText.innerText =
            gesture;

        /* 控制页面 */

        if(

            controlPage.style.display !== "none"

        ){

            const x =
                (1 - lm[8].x)
                * window.innerWidth;

            const y =
                lm[8].y
                * window.innerHeight;

            cursor.style.left =
                x + "px";

            cursor.style.top =
                y + "px";

            hoverDetect(x,y);

            detectSwipe(lm);
        }

    }else{

        nameDom.innerText =
            "未检测到手";

        gestureText.innerText =
            "未检测到手";
    }
});

/* ========================= */
/* 启动 */
/* ========================= */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false
            });

        video.srcObject = stream;

        controlVideo.srcObject = stream;

        await video.play();

        await controlVideo.play();

        resizeCanvas();

        const camera =
            new Camera(video,{

                onFrame:async()=>{

                    await hands.send({
                        image:video
                    });
                },

                width:640,
                height:480
            });

        camera.start();

        loading.style.display =
            "none";

    }catch(err){

        console.error(err);

        loading.innerText =
            "摄像头启动失败";
    }
}

/* 启动按钮 */

document
.getElementById("startBtn")
.onclick = ()=>{

    startCamera();
};
