<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI 手势交互系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:#ffffff;

    overflow:hidden;

    color:#163a63;
}

/* 顶部切换 */

.top-bar{

    position:fixed;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:12px;

    z-index:99999;
}

.mode-btn{

    border:none;

    padding:12px 22px;

    border-radius:14px;

    background:#eef4fb;

    color:#163a63;

    font-size:14px;

    cursor:pointer;

    transition:0.25s;
}

.mode-btn.active{

    background:#163a63;

    color:white;
}

/* ========================= */
/* 手势识别模式 */
/* ========================= */

.recognize-page{

    width:100vw;
    height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;
}

.container{

    width:min(920px,94vw);

    height:min(92vh,920px);

    display:flex;

    flex-direction:column;

    gap:18px;
}

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:24px;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    box-shadow:
    0 10px 30px rgba(22,58,99,0.08);
}

#video,
#canvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

#canvas{
    pointer-events:none;
}

.header{

    position:absolute;

    top:18px;
    left:20px;

    z-index:10;
}

.title{

    font-size:18px;

    font-weight:600;
}

.subtitle{

    margin-top:4px;

    font-size:13px;

    color:#6f8298;
}

#startBtn{

    position:absolute;

    top:18px;
    right:18px;

    z-index:999;

    border:none;

    background:#163a63;

    color:white;

    padding:10px 16px;

    border-radius:12px;

    font-size:13px;

    cursor:pointer;
}

.loading{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:rgba(255,255,255,0.96);

    border:1px solid #dce6f2;

    padding:14px 20px;

    border-radius:14px;

    font-size:13px;

    z-index:999;
}

.result-card{

    height:130px;

    border-radius:22px;

    background:#f8fafc;

    border:1px solid #dbe5f0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:8px;
}

.name{

    font-size:28px;

    font-weight:600;
}

/* ========================= */
/* 手势操控模式 */
/* ========================= */

.control-page{

    width:100vw;
    height:100vh;

    display:none;
}

.mini-camera{

    position:fixed;

    top:20px;
    left:20px;

    width:240px;
    height:180px;

    border-radius:20px;

    overflow:hidden;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    box-shadow:
    0 10px 30px rgba(22,58,99,0.08);

    z-index:999;
}

#controlVideo,
#controlCanvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

#controlCanvas{
    pointer-events:none;
}

.control-main{

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:30px;
}

/* 中央交互文字 */

.center-text{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:72px;

    font-weight:700;

    color:#163a63;

    transition:
    font-size 0.25s,
    transform 0.1s,
    left 0.08s linear,
    top 0.08s linear;
}

.tip{

    position:absolute;

    bottom:180px;

    font-size:15px;

    color:#7d8ea3;

    text-align:center;

    line-height:1.8;
}

.menu{

    position:absolute;

    bottom:40px;

    display:flex;

    gap:24px;
}

.menu-item{

    width:140px;
    height:140px;

    border-radius:26px;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:20px;

    transition:0.25s;
}

.menu-item.active{

    transform:translateY(-8px);

    background:#163a63;

    color:white;

    box-shadow:
    0 14px 28px rgba(22,58,99,0.18);
}

/* 光标 */

.cursor{

    position:fixed;

    width:24px;
    height:24px;

    border-radius:50%;

    background:#163a63;

    box-shadow:
    0 0 20px rgba(22,58,99,0.4);

    pointer-events:none;

    z-index:99999;

    transition:
    left 0.05s linear,
    top 0.05s linear;
}

/* 点赞特效 */

.like{

    position:fixed;

    font-size:64px;

    animation:likeAnim 1s ease forwards;

    pointer-events:none;
}

@keyframes likeAnim{

    0%{
        opacity:0;
        transform:
        translateY(0)
        scale(0.4);
    }

    40%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
        translateY(-140px)
        scale(1.4);
    }
}

/* 手机适配 */

@media(max-width:768px){

    .mini-camera{

        width:160px;
        height:120px;
    }

    .center-text{

        font-size:42px;
    }

    .menu{

        gap:12px;
    }

    .menu-item{

        width:92px;
        height:92px;

        font-size:14px;
    }

    .tip{

        width:90%;

        bottom:150px;

        font-size:13px;
    }
}

</style>
</head>

<body>

<!-- 顶部按钮 -->

<div class="top-bar">

    <button
        class="mode-btn active"
        id="recognizeBtn">

        手势识别
    </button>

    <button
        class="mode-btn"
        id="controlBtn">

        手势操控
    </button>

</div>

<!-- ========================= -->
<!-- 手势识别页面 -->
<!-- ========================= -->

<div
    class="recognize-page"
    id="recognizePage">

    <div class="container">

        <div class="camera-card">

            <div class="header">

                <div class="title">
                    手势识别系统
                </div>

                <div class="subtitle">
                    数字 / OK / 摇滚 / 点赞等
                </div>

            </div>

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <canvas id="canvas"></canvas>

            <button id="startBtn">
                启动识别
            </button>

            <div
                class="loading"
                id="loading">

                点击右上角启动摄像头
            </div>

        </div>

        <div class="result-card">

            <div
                class="name"
                id="name">

                等待识别
            </div>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- 手势操控页面 -->
<!-- ========================= -->

<div
    class="control-page"
    id="controlPage">

    <div class="mini-camera">

        <video
            id="controlVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="controlCanvas"></canvas>

    </div>

    <div
        class="cursor"
        id="cursor">
    </div>

    <div class="control-main">

        <div
            class="center-text"
            id="controlText">

            手势操控模式
        </div>

        <div class="tip">

            👉 食指移动文字<br>
            ✊ 握拳缩小　🖐 张开放大<br>
            👍 点赞特效　☝ 食指方向控制

        </div>

        <div class="menu">

            <div class="menu-item">
                图片
            </div>

            <div class="menu-item">
                视频
            </div>

            <div class="menu-item">
                设置
            </div>

        </div>

    </div>

</div>

<script>

/* DOM */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const nameDom =
    document.getElementById("name");

const loading =
    document.getElementById("loading");

const recognizeBtn =
    document.getElementById("recognizeBtn");

const controlBtn =
    document.getElementById("controlBtn");

const recognizePage =
    document.getElementById("recognizePage");

const controlPage =
    document.getElementById("controlPage");

const controlVideo =
    document.getElementById("controlVideo");

const controlCanvas =
    document.getElementById("controlCanvas");

const controlCtx =
    controlCanvas.getContext("2d");

const controlText =
    document.getElementById("controlText");

const cursor =
    document.getElementById("cursor");

const menuItems =
    document.querySelectorAll(".menu-item");

/* 页面切换 */

recognizeBtn.onclick = ()=>{

    recognizeBtn.classList.add("active");

    controlBtn.classList.remove("active");

    recognizePage.style.display =
        "flex";

    controlPage.style.display =
        "none";
};

controlBtn.onclick = ()=>{

    controlBtn.classList.add("active");

    recognizeBtn.classList.remove("active");

    recognizePage.style.display =
        "none";

    controlPage.style.display =
        "block";
};

/* resize */

function resizeCanvas(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    controlCanvas.width =
        controlVideo.videoWidth;

    controlCanvas.height =
        controlVideo.videoHeight;
}

/* 手势工具 */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

/* 手势识别 */

function recognize(lm){

    const thumbOpen =
        distance(lm[4],lm[3]) > 0.05;

    const thumbUp =
        lm[4].y < lm[3].y &&
        lm[3].y < lm[2].y;

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const thumbIndexNear =
        distance(lm[4],lm[8]) < 0.06;

    /* 点赞 */

    if(
        thumbUp &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "点赞";
    }

    /* 握拳 */

    if(
        !thumbOpen &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "握拳";
    }

    /* 张开手 */

    if(
        thumbOpen &&
        index &&
        middle &&
        ring &&
        pinky
    ){
        return "数字5 / 张开手掌";
    }

    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "数字1";
    }

    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){
        return "数字2 / 剪刀";
    }

    if(
        thumbIndexNear &&
        middle &&
        ring &&
        pinky
    ){
        return "OK";
    }

    if(
        thumbOpen &&
        pinky &&
        !index &&
        !middle &&
        !ring
    ){
        return "数字6 / 打电话";
    }

    return "识别中...";
}

/* 绘制 */

function drawHand(points,context,w,h){

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    context.strokeStyle =
        "#163a63";

    context.lineWidth = 2;

    for(const [a,b] of lines){

        context.beginPath();

        context.moveTo(
            points[a].x * w,
            points[a].y * h
        );

        context.lineTo(
            points[b].x * w,
            points[b].y * h
        );

        context.stroke();
    }

    for(const p of points){

        context.beginPath();

        context.arc(
            p.x * w,
            p.y * h,
            4,
            0,
            Math.PI * 2
        );

        context.fillStyle =
            "#163a63";

        context.fill();
    }
}

/* 点赞特效 */

let likeLock = false;

function showLike(){

    if(likeLock) return;

    likeLock = true;

    const div =
        document.createElement("div");

    div.className =
        "like";

    div.innerText =
        "👍";

    div.style.left =
        Math.random() *
        window.innerWidth + "px";

    div.style.top =
        window.innerHeight * 0.7 + "px";

    document.body.appendChild(div);

    setTimeout(()=>{

        div.remove();

        likeLock = false;

    },1000);
}

/* MediaPipe */

const hands = new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

/* results */

hands.onResults(results => {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    controlCtx.clearRect(
        0,
        0,
        controlCanvas.width,
        controlCanvas.height
    );

    if(
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        let texts = [];

        for(const lm of results.multiHandLandmarks){

            drawHand(
                lm,
                ctx,
                canvas.width,
                canvas.height
            );

            drawHand(
                lm,
                controlCtx,
                controlCanvas.width,
                controlCanvas.height
            );

            const gesture =
                recognize(lm);

            texts.push(gesture);

            /* 操控模式 */

            if(
                controlPage.style.display !== "none"
            ){

                const x =
                    (1 - lm[8].x)
                    * window.innerWidth;

                const y =
                    lm[8].y
                    * window.innerHeight;

                /* 光标 */

                cursor.style.left =
                    x + "px";

                cursor.style.top =
                    y + "px";

                /* 文字跟随手移动 */

                controlText.style.left =
                    x + "px";

                controlText.style.top =
                    y + "px";

                /* 菜单 hover */

                menuItems.forEach(item=>{

                    const rect =
                        item.getBoundingClientRect();

                    if(

                        x > rect.left &&
                        x < rect.right &&
                        y > rect.top &&
                        y < rect.bottom

                    ){

                        item.classList.add("active");

                    }else{

                        item.classList.remove("active");
                    }
                });

                /* 握拳缩小 */

                if(
                    gesture === "握拳"
                ){

                    controlText.innerText =
                        "缩小";

                    controlText.style.fontSize =
                        "36px";
                }

                /* 张开放大 */

                if(
                    gesture ===
                    "数字5 / 张开手掌"
                ){

                    controlText.innerText =
                        "放大";

                    controlText.style.fontSize =
                        "100px";
                }

                /* 点赞 */

                if(
                    gesture === "点赞"
                ){

                    controlText.innerText =
                        "已点赞";

                    showLike();
                }

                /* 食指方向 */

                if(
                    gesture === "数字1"
                ){

                    const tip = lm[8];
                    const base = lm[5];

                    const dx =
                        tip.x - base.x;

                    const dy =
                        tip.y - base.y;

                    if(
                        Math.abs(dx) >
                        Math.abs(dy)
                    ){

                        if(dx > 0){

                            controlText.innerText =
                                "向左";

                        }else{

                            controlText.innerText =
                                "向右";
                        }

                    }else{

                        if(dy > 0){

                            controlText.innerText =
                                "向下";

                        }else{

                            controlText.innerText =
                                "向上";
                        }
                    }
                }
            }
        }

        /* 普通识别模式 */

        if(
            recognizePage.style.display !== "none"
        ){

            nameDom.innerText =
                texts.join(" + ");
        }

    }else{

        nameDom.innerText =
            "未检测到手";

        controlText.innerText =
            "未检测到手";
    }
});

/* 启动 */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false
            });

        video.srcObject = stream;

        controlVideo.srcObject = stream;

        await video.play();

        await controlVideo.play();

        resizeCanvas();

        const camera =
            new Camera(video,{

                onFrame:async()=>{

                    await hands.send({
                        image:video
                    });
                },

                width:640,
                height:480
            });

        camera.start();

        loading.style.display =
            "none";

    }catch(err){

        console.error(err);

        loading.innerText =
            "摄像头启动失败";
    }
}

/* start */

document
.getElementById("startBtn")
.onclick = ()=>{

    startCamera();
};

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>

</body>
</html>
