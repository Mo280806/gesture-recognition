<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>摄像头测试</title>

<style>

body{
    margin:0;
    background:black;
    overflow:hidden;
}

video{
    width:100vw;
    height:100vh;
    object-fit:cover;
}

button{
    position:absolute;
    top:20px;
    left:20px;
    z-index:999;
    padding:15px 25px;
    font-size:18px;
}

</style>
</head>

<body>

<button id="btn">
启动摄像头
</button>

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<script>

const btn =
    document.getElementById("btn");

const video =
    document.getElementById("video");

btn.onclick = async ()=>{

    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video:true,
                audio:false
            });

        video.srcObject =
            stream;

    }catch(err){

        alert("摄像头失败");

        console.error(err);
    }
};

</script>

</body>
</html>
