<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>手势交互系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>
/* =========================
   🎯 Ultra Minimal Gesture UI
   高级极简设计系统
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang SC",
        "Helvetica Neue",
        sans-serif;
}

body{
    background:#f4f6fb;
    color:#111827;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}

/* =========================
   🧭 顶部导航（极简悬浮胶囊）
========================= */

.top-bar{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    padding:6px;
    border-radius:999px;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(18px);
    border:1px solid rgba(0,0,0,0.06);
    z-index:9999;
}

.mode-btn{
    border:none;
    background:transparent;
    padding:8px 14px;
    font-size:13px;
    border-radius:999px;
    color:#374151;
    cursor:pointer;
    transition:all .2s ease;
}

.mode-btn.active{
    background:#111827;
    color:#fff;
}

.mode-btn:hover{
    opacity:.7;
}

/* =========================
   📷 识别页（更轻）
========================= */

.recognize-page{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:min(920px,92vw);
    display:flex;
    flex-direction:column;
    gap:14px;
}

/* 摄像头卡片（去厚重阴影） */
.camera-card{
    position:relative;
    height:min(68vh,680px);
    border-radius:20px;
    overflow:hidden;
    background:#0b0f17;
    border:1px solid rgba(255,255,255,0.06);
}

/* video */
#video,
#canvas{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

/* 标题浮层（更轻） */
.header{
    position:absolute;
    top:14px;
    left:14px;
    padding:10px 12px;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    color:#fff;
}

.title{
    font-size:14px;
    font-weight:600;
}

.subtitle{
    font-size:11px;
    opacity:.7;
    margin-top:2px;
}

/* 启动按钮 */
#startBtn{
    position:absolute;
    top:14px;
    right:14px;
    border:none;
    padding:9px 12px;
    border-radius:10px;
    font-size:12px;
    background:rgba(255,255,255,0.9);
    color:#111827;
}

/* loading */
.loading{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:12px;
    color:rgba(255,255,255,0.8);
}

/* 结果卡 */
.result-card{
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(16px);
    border:1px solid rgba(0,0,0,0.06);
    border-radius:16px;
    padding:16px;
    text-align:center;
}

.name{
    font-size:18px;
    font-weight:600;
}

/* =========================
   📖 阅读模式（重点优化）
========================= */

.control-page{
    width:100vw;
    height:100vh;
    display:none;
}

/* 浮动摄像头（更轻更不挡） */
.floating-camera{
    position:fixed;
    top:14px;
    left:14px;
    width:52px;
    height:52px;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    z-index:999;
    transition:.25s ease;
}

.floating-camera.expand{
    width:160px;
    height:110px;
    border-radius:16px;
}

#controlVideo,
#controlCanvas{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

/* 阅读容器（极简纸感） */
.reader-container{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(860px,92vw);
    height:min(82vh,820px);
    background:#ffffff;
    border-radius:18px;
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:0 10px 30px rgba(0,0,0,0.06);
    display:flex;
    flex-direction:column;
}

/* header */
.reader-header{
    padding:14px 18px;
    border-bottom:1px solid rgba(0,0,0,0.05);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.reader-title{
    font-size:14px;
    font-weight:600;
}

.page-info{
    font-size:11px;
    color:#6b7280;
}

/* 内容区 */
.reader-content{
    flex:1;
    padding:20px;
    overflow:hidden;
}

/* 书页 */
.book-page{
    height:100%;
    overflow-y:auto;
    font-size:16px;
    line-height:1.8;
    color:#111827;
    user-select:none;
}

/* 横排模式 */
.horizontal-mode{
    column-count:2;
    column-gap:32px;
}

/* =========================
   🎛 底部控制栏（极简浮层）
========================= */

.control-panel{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    padding:8px;
    border-radius:999px;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(18px);
    border:1px solid rgba(0,0,0,0.06);
}

.control-btn{
    border:none;
    background:transparent;
    padding:8px 12px;
    font-size:12px;
    border-radius:999px;
    color:#374151;
}

.control-btn.hovering{
    background:#111827;
    color:#fff;
}

/* =========================
   📋 菜单（浮层卡片化）
========================= */

.menu-panel{
    position:absolute;
    right:14px;
    top:70px;
    width:180px;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(18px);
    border:1px solid rgba(0,0,0,0.06);
    border-radius:14px;
    padding:8px;
    display:none;
}

.menu-panel.show{
    display:block;
}

.menu-item{
    padding:10px;
    font-size:12px;
    border-radius:10px;
    color:#374151;
}

.menu-item.hovering{
    background:rgba(0,0,0,0.05);
}

/* =========================
   🌙 夜间模式（高级黑）
========================= */

.night{
    background:#0a0d12;
}

.night .reader-container{
    background:#0f141b;
    border-color:rgba(255,255,255,0.06);
}

.night .book-page,
.night .reader-title{
    color:#e5e7eb;
}

.night .page-info{
    color:#9ca3af;
}

/* =========================
   🎯 光标（极轻）
========================= */

.cursor{
    position:fixed;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#111827;
    pointer-events:none;
    z-index:9999;
    opacity:.6;
}

/* =========================
   📱 移动端彻底优化
========================= */

@media (max-width:768px){

    .reader-container{
        width:100vw;
        height:100vh;
        border-radius:0;
    }

    .book-page{
        font-size:14px;
        line-height:1.7;
    }

    .control-panel{
        bottom:10px;
        padding:6px;
    }

    .control-btn{
        font-size:11px;
        padding:6px 10px;
    }

    .floating-camera{
        width:46px;
        height:46px;
    }

    .menu-panel{
        right:8px;
        width:160px;
    }
}
</style>
</head>

<body>

<div class="top-bar">

    <button
        class="mode-btn active"
        id="recognizeBtn">

        手势识别
    </button>

    <button
        class="mode-btn"
        id="controlBtn">

        手势阅读
    </button>

</div>

<div
    class="recognize-page"
    id="recognizePage">

    <div class="container">

        <div class="camera-card">

            <div class="header">

                <div class="title">
                    手势识别系统
                </div>

                <div class="subtitle">
                    支持：0~5、点赞、OK、剪刀、握拳、张手
                </div>

            </div>

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <canvas id="canvas"></canvas>

            <button id="startBtn">
                启动识别
            </button>

            <div
                class="loading"
                id="loading">

                点击启动摄像头
            </div>

        </div>

        <div class="result-card">

            <div
                class="name"
                id="name">

                等待识别
            </div>

        </div>

    </div>

</div>

<!-- 阅读页面 -->

<div
    class="control-page"
    id="controlPage">

    <div class="floating-camera">

        <video
            id="controlVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="controlCanvas"></canvas>

    </div>

    <div
        class="cursor"
        id="cursor">
    </div>

    <div class="reader-container">

        <div class="reader-header">

            <div class="reader-title">
                《星空旅人》
            </div>

            <div
                class="page-info"
                id="pageInfo">

                第1页 / 共3页
            </div>

        </div>

        <div class="reader-content">

            <div
                class="book-page"
                id="bookPage">
            </div>

            <div
                class="menu-panel"
                id="menuPanel">

                <div
                    class="menu-item"
                    data-menu="night">

                    🌙 日间 / 夜间
                </div>

                <div
                    class="menu-item"
                    data-menu="big">

                    ➕ 字体放大
                </div>

                <div
                    class="menu-item"
                    data-menu="small">

                    ➖ 字体缩小
                </div>

                <div
                    class="menu-item"
                    data-menu="vertical">

                    ↕ 上下阅读
                </div>

                <div
                    class="menu-item"
                    data-menu="horizontal">

                    ↔ 左右阅读
                </div>

            </div>

        </div>

        <div class="control-panel">

            <button
                class="control-btn"
                data-action="prev">

                上一页
            </button>

            <button
                class="control-btn"
                data-action="next">

                下一页
            </button>

            <button
                class="control-btn"
                data-action="menu">

                菜单
            </button>

        </div>

    </div>

    <div class="gesture-status">

        👉 食指控制光标　
        👆 悬停0.8秒点击　
        ✋ 挥手翻页　
        🤲 双手缩放字体

    </div>

</div>
<script>

/* =========================
   DOM
========================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const controlVideo =
document.getElementById("controlVideo");

const controlCanvas =
document.getElementById("controlCanvas");

const controlCtx =
controlCanvas.getContext("2d");

const nameDom =
document.getElementById("name");

const loading =
document.getElementById("loading");

const recognizeBtn =
document.getElementById("recognizeBtn");

const controlBtn =
document.getElementById("controlBtn");

const recognizePage =
document.getElementById("recognizePage");

const controlPage =
document.getElementById("controlPage");

const cursor =
document.getElementById("cursor");

const bookPage =
document.getElementById("bookPage");

const pageInfo =
document.getElementById("pageInfo");

const menuPanel =
document.getElementById("menuPanel");

const buttons =
document.querySelectorAll(".control-btn");

const menuItems =
document.querySelectorAll(".menu-item");

const floatingCamera =
document.querySelector(".floating-camera");

const isMobile =
window.innerWidth < 768;

/* =========================
   页面切换
========================= */

floatingCamera.onclick = ()=>{

    floatingCamera.classList.toggle("expand");

    setTimeout(updateHoverRects,300);
};

recognizeBtn.onclick = ()=>{

    recognizeBtn.classList.add("active");

    controlBtn.classList.remove("active");

    recognizePage.style.display = "flex";

    controlPage.style.display = "none";
};

controlBtn.onclick = ()=>{

    controlBtn.classList.add("active");

    recognizeBtn.classList.remove("active");

    recognizePage.style.display = "none";

    controlPage.style.display = "block";

    setTimeout(updateHoverRects,120);
};

/* =========================
   小说内容
========================= */

const pages = [

`深夜的列车穿过无人的山谷。

林澈坐在靠窗的位置，看着远处缓慢后退的灯火。

车厢里很安静，只能听见铁轨轻轻震动的声音。

忽然，广播响起：

“终点站即将到达，请旅客提前整理随身物品。”`,

`列车停下时，外面却并不是城市。

月光下，是一片巨大的湖泊。

湖面像镜子一样平静，而湖中央漂浮着一座白色钟塔。

林澈缓缓走下列车。`,

`钟塔的大门缓缓开启。

无数星光从塔内流出，像银河一样铺满地面。

一个声音在黑暗中轻轻响起：

“欢迎来到时间尽头。”`
];

let currentPage = 0;

function renderPage(){

    bookPage.innerText =
    pages[currentPage];

    pageInfo.innerText =
    `第 ${currentPage+1} 页 / 共 ${pages.length} 页`;
}

renderPage();

/* =========================
   阅读功能
========================= */

function nextPage(){

    if(currentPage < pages.length - 1){

        currentPage++;

        renderPage();
    }
}

function prevPage(){

    if(currentPage > 0){

        currentPage--;

        renderPage();
    }
}

function toggleMenu(){

    menuPanel.classList.toggle("show");

    setTimeout(updateHoverRects,120);
}

function toggleNight(){

    document.body.classList.toggle("night");
}

let fontSize = 24;

function applyFont(){

    bookPage.style.fontSize =
    fontSize + "px";
}

function fontIncrease(){

    fontSize =
    Math.min(fontSize + 2,42);

    applyFont();
}

function fontDecrease(){

    fontSize =
    Math.max(fontSize - 2,16);

    applyFont();
}

function switchHorizontal(){

    bookPage.classList.add("horizontal-mode");
}

function switchVertical(){

    bookPage.classList.remove("horizontal-mode");
}

/* =========================
   resize
========================= */

function resizeCanvas(){

    if(video.videoWidth){

        canvas.width =
        video.videoWidth;

        canvas.height =
        video.videoHeight;
    }

    if(controlVideo.videoWidth){

        controlCanvas.width =
        controlVideo.videoWidth;

        controlCanvas.height =
        controlVideo.videoHeight;
    }

    updateHoverRects();
}

window.addEventListener(
    "resize",
    resizeCanvas
);

/* =========================
   工具
========================= */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

function thumbUp(lm, handedness){

    if(handedness === "Right"){

        return lm[4].x < lm[3].x;

    }else{

        return lm[4].x > lm[3].x;
    }
}

/* =========================
   手势稳定器（升级）
========================= */

const gestureBuffer = [];

function stableGesture(newGesture){

    gestureBuffer.push(newGesture);

    if(gestureBuffer.length > 10){

        gestureBuffer.shift();
    }

    const counter = {};

    gestureBuffer.forEach(g=>{

        counter[g] = (counter[g]||0)+1;
    });

    let best = "";
    let max = 0;

    for(const k in counter){

        if(counter[k] > max){

            max = counter[k];
            best = k;
        }
    }

    return max >= 6
    ? best
    : "识别中...";
}

/* =========================
   手势识别
========================= */

function recognize(lm, handedness){

    const thumb =
    thumbUp(lm, handedness);

    const index =
    fingerUp(lm[8],lm[6]);

    const middle =
    fingerUp(lm[12],lm[10]);

    const ring =
    fingerUp(lm[16],lm[14]);

    const pinky =
    fingerUp(lm[20],lm[18]);

    const total =

    (thumb?1:0)+
    (index?1:0)+
    (middle?1:0)+
    (ring?1:0)+
    (pinky?1:0);

    const ok =
    distance(lm[4],lm[8]) < 0.045 &&
    middle &&
    ring &&
    pinky;

    if(ok) return "OK";

    if(index && middle && !ring && !pinky){

        return "✌ 剪刀";
    }

    if(
        thumb &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){

        return "👍 点赞";
    }

    if(total === 0){

        return "✊ 握拳";
    }

    if(total === 5){

        return "🖐 张手";
    }

    return `数字 ${total}`;
}

/* =========================
   绘制
========================= */

function drawHand(points,context,w,h){

    const lines = [

        [0,1],[1,2],[2,3],[3,4],
        [0,5],[5,6],[6,7],[7,8],
        [0,9],[9,10],[10,11],[11,12],
        [0,13],[13,14],[14,15],[15,16],
        [0,17],[17,18],[18,19],[19,20]
    ];

    context.strokeStyle = "#163a63";
    context.lineWidth = 2;

    for(const [a,b] of lines){

        context.beginPath();

        context.moveTo(
            points[a].x * w,
            points[a].y * h
        );

        context.lineTo(
            points[b].x * w,
            points[b].y * h
        );

        context.stroke();
    }
}

/* =========================
   光标系统（升级）
========================= */

let cursorX =
window.innerWidth / 2;

let cursorY =
window.innerHeight / 2;

let targetX = cursorX;
let targetY = cursorY;

function animateCursor(){

    const smooth =
    isMobile ? 0.22 : 0.16;

    cursorX +=
    (targetX - cursorX) * smooth;

    cursorY +=
    (targetY - cursorY) * smooth;

    cursor.style.transform =
    `translate3d(
        ${cursorX - 12}px,
        ${cursorY - 12}px,
        0
    )`;

    requestAnimationFrame(
        animateCursor
    );
}

animateCursor();

/* =========================
   hover
========================= */

let hoverRects = [];

function updateHoverRects(){

    hoverRects = [

        ...buttons,
        ...menuItems

    ].map(el=>({

        el,
        rect:
        el.getBoundingClientRect()
    }));
}

updateHoverRects();

let hoverTarget = null;
let hoverStart = 0;
let hoverLocked = false;

function hoverDetect(x,y){

    let found = null;

    const padding =
    isMobile ? 34 : 18;

    for(const item of hoverRects){

        const r = item.rect;

        if(

            x >= r.left - padding &&
            x <= r.right + padding &&
            y >= r.top - padding &&
            y <= r.bottom + padding

        ){

            found = item.el;
            break;
        }
    }

    if(found !== hoverTarget){

        if(hoverTarget){

            hoverTarget.classList.remove(
                "hovering"
            );
        }

        hoverTarget = found;

        hoverStart = Date.now();
    }

    if(found){

        found.classList.add("hovering");

        cursor.classList.add("hovering");

        if(

            !hoverLocked &&
            Date.now() - hoverStart >
            (isMobile ? 1300 : 850)

        ){

            hoverLocked = true;

            autoClick(found);

            setTimeout(()=>{

                hoverLocked = false;

            },1200);
        }

    }else{

        cursor.classList.remove(
            "hovering"
        );
    }
}

/* =========================
   自动点击
========================= */

function autoClick(el){

    cursor.animate(
    [
        {transform:"scale(1)"},
        {transform:"scale(1.45)"},
        {transform:"scale(1)"}
    ],
    {
        duration:220
    });

    const action =
    el.dataset.action;

    const menu =
    el.dataset.menu;

    if(action){

        if(action==="next") nextPage();

        if(action==="prev") prevPage();

        if(action==="menu") toggleMenu();
    }

    if(menu){

        if(menu==="night") toggleNight();

        if(menu==="big") fontIncrease();

        if(menu==="small") fontDecrease();

        if(menu==="horizontal")
        switchHorizontal();

        if(menu==="vertical")
        switchVertical();
    }

    updateHoverRects();
}

/* =========================
   swipe（升级）
========================= */

let swipeTrack = [];
let lastSwipeTime = 0;

function detectSwipe(lm){

    const now = Date.now();

    if(now - lastSwipeTime < 1200){

        return;
    }

    swipeTrack.push({

        x: lm[0].x,
        y: lm[0].y,
        t: now
    });

    if(swipeTrack.length > 10){

        swipeTrack.shift();
    }

    if(swipeTrack.length < 6){

        return;
    }

    const first =
    swipeTrack[0];

    const last =
    swipeTrack[
        swipeTrack.length-1
    ];

    const dx =
    last.x - first.x;

    const dy =
    Math.abs(last.y - first.y);

    const dt =
    last.t - first.t;

    const velocity =
    Math.abs(dx) / dt;

    if(

        Math.abs(dx) > 0.34 &&
        dy < 0.08 &&
        velocity > 0.0028

    ){

        if(dx > 0){

            nextPage();

        }else{

            prevPage();
        }

        swipeTrack = [];

        lastSwipeTime = now;
    }
}

/* =========================
   MediaPipe
========================= */

const hands = new Hands({

    locateFile:file =>

    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({

    maxNumHands:2,

    modelComplexity:
    isMobile ? 0 : 1,

    minDetectionConfidence:0.72,

    minTrackingConfidence:0.72
});

/* =========================
   双手缩放
========================= */

let lastZoomDistance = 0;
let zoomCooldown = 0;

/* =========================
   主识别
========================= */

hands.onResults(results=>{

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    controlCtx.clearRect(
        0,0,
        controlCanvas.width,
        controlCanvas.height
    );

    if(

        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length===0

    ){

        nameDom.innerText =
        "未检测到手势";

        cursor.style.opacity = 0;

        gestureBuffer.length = 0;

        hoverTarget = null;

        return;
    }

    cursor.style.opacity = 1;

    const texts = [];

    results.multiHandLandmarks.forEach((lm,index)=>{

        const handedness =
        results.multiHandedness?.[index]
        ?.label || "Right";

        const gesture =
        stableGesture(
            recognize(lm, handedness)
        );

        texts.push(
            `手${index+1}：${gesture}`
        );

        if(
            recognizePage.style.display !== "none"
        ){

            drawHand(
                lm,
                ctx,
                canvas.width,
                canvas.height
            );
        }

        if(
            controlPage.style.display !== "none"
        ){

            drawHand(
                lm,
                controlCtx,
                controlCanvas.width,
                controlCanvas.height
            );
        }

        if(index===0){

            targetX =
            (1-lm[8].x)
            * window.innerWidth;

            targetY =
            lm[8].y
            * window.innerHeight;

            if(
                controlPage.style.display !== "none"
            ){

                hoverDetect(
                    targetX,
                    targetY
                );

                detectSwipe(lm);
            }
        }
    });

    /* 双手缩放 */

    if(
        results.multiHandLandmarks.length===2
    ){

        const h1 =
        results.multiHandLandmarks[0];

        const h2 =
        results.multiHandLandmarks[1];

        const d =
        distance(h1[8],h2[8]);

        if(!lastZoomDistance){

            lastZoomDistance = d;
        }

        const delta =
        d - lastZoomDistance;

        if(

            Math.abs(delta) > 0.008 &&
            Date.now() - zoomCooldown > 120

        ){

            if(delta > 0){

                fontIncrease();

            }else{

                fontDecrease();
            }

            zoomCooldown = Date.now();
        }

        lastZoomDistance =

        lastZoomDistance * 0.7 +
        d * 0.3;

    }else{

        lastZoomDistance = 0;
    }

    nameDom.innerText =
    texts.join("\n");
});

/* =========================
   启动摄像头
========================= */

let cameraStarted = false;
let processing = false;

async function startCamera(){

    if(cameraStarted){

        return;
    }

    cameraStarted = true;

    loading.innerText =
    "摄像头启动中...";

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:
                    isMobile ? 640 : 1280
                },

                height:{
                    ideal:
                    isMobile ? 480 : 720
                },

                frameRate:{
                    ideal:
                    isMobile ? 24 : 30
                }
            },

            audio:false
        });

        video.srcObject = stream;

        controlVideo.srcObject =
        stream;

        await video.play();

        resizeCanvas();

        async function loop(){

            if(processing){

                requestAnimationFrame(loop);

                return;
            }

            processing = true;

            await hands.send({

                image:video
            });

            processing = false;

            requestAnimationFrame(loop);
        }

        loop();

        loading.style.display =
        "none";

    }catch(err){

        console.error(err);

        loading.innerText =
        "摄像头启动失败";

        cameraStarted = false;
    }
}

document
.getElementById("startBtn")
.onclick = startCamera;

</script>
