<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI手势交互阅读系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:
    linear-gradient(
        135deg,
        #eef3f9 0%,
        #f8fbff 100%
    );

    overflow:hidden;

    color:#163a63;
}

/* ========================= */
/* 顶部按钮 */
/* ========================= */

.top-bar{

    position:fixed;

    top:18px;
    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:12px;

    z-index:999999;
}

.mode-btn{

    border:none;

    padding:12px 24px;

    border-radius:16px;

    background:rgba(255,255,255,0.92);

    backdrop-filter:blur(12px);

    color:#163a63;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    transition:0.25s;

    box-shadow:
    0 8px 24px rgba(22,58,99,0.08);
}

.mode-btn:hover{

    transform:translateY(-2px);
}

.mode-btn.active{

    background:#163a63;

    color:white;
}

/* ========================= */
/* 手势识别页面 */
/* ========================= */

.recognize-page{

    width:100vw;
    height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    padding-top:80px;
}

.container{

    width:min(980px,94vw);

    height:min(90vh,920px);

    display:flex;

    flex-direction:column;

    gap:18px;
}

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:28px;

    background:#f5f8fc;

    border:1px solid rgba(219,229,240,0.8);

    box-shadow:
    0 20px 60px rgba(22,58,99,0.08);
}

#video,
#canvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

#canvas{
    pointer-events:none;
}

.header{

    position:absolute;

    top:20px;
    left:22px;

    z-index:10;

    background:
    rgba(255,255,255,0.78);

    backdrop-filter:blur(10px);

    padding:14px 18px;

    border-radius:18px;
}

.title{

    font-size:20px;

    font-weight:700;
}

.subtitle{

    margin-top:6px;

    font-size:13px;

    color:#6f8298;

    line-height:1.7;
}

#startBtn{

    position:absolute;

    top:20px;
    right:20px;

    z-index:999;

    border:none;

    background:#163a63;

    color:white;

    padding:12px 18px;

    border-radius:14px;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

    box-shadow:
    0 10px 24px rgba(22,58,99,0.22);
}

.loading{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:rgba(255,255,255,0.96);

    border:1px solid #dce6f2;

    padding:16px 22px;

    border-radius:16px;

    font-size:14px;

    z-index:999;
}

.result-card{

    min-height:140px;

    border-radius:24px;

    background:rgba(255,255,255,0.9);

    border:1px solid #dbe5f0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:10px;

    box-shadow:
    0 12px 30px rgba(22,58,99,0.06);
}

.result-title{

    font-size:14px;

    color:#7b8da3;
}

.name{

    font-size:34px;

    font-weight:700;

    color:#163a63;
}

/* ========================= */
/* 阅读页面 */
/* ========================= */

.control-page{

    width:100vw;
    height:100vh;

    display:none;

    position:relative;

    padding:
    100px 20px 110px;
}

/* 摄像头 */

.floating-camera{

    position:fixed;

    top:18px;
    left:18px;

    width:240px;
    height:180px;

    border-radius:24px;

    overflow:hidden;

    background:#fff;

    border:1px solid rgba(219,229,240,0.9);

    box-shadow:
    0 18px 40px rgba(22,58,99,0.12);

    z-index:99999;
}

#controlVideo,
#controlCanvas{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

#controlCanvas{
    pointer-events:none;
}

/* 阅读器 */

.reader-container{

    width:min(980px,100%);

    height:calc(100vh - 210px);

    margin:auto;

    background:rgba(255,255,255,0.96);

    backdrop-filter:blur(10px);

    border-radius:34px;

    box-shadow:
    0 25px 70px rgba(22,58,99,0.10);

    border:1px solid rgba(219,229,240,0.8);

    overflow:hidden;

    display:flex;

    flex-direction:column;
}

.reader-header{

    min-height:78px;

    border-bottom:1px solid #e8eef6;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 30px;

    gap:12px;
}

.reader-title{

    font-size:24px;

    font-weight:700;
}

.page-info{

    font-size:14px;

    color:#7c8ea3;
}

.reader-content{

    flex:1;

    padding:42px;

    overflow:hidden;

    position:relative;
}

.book-page{

    width:100%;
    height:100%;

    overflow-y:auto;

    line-height:2.2;

    font-size:24px;

    color:#1d2b3a;

    transition:0.25s;

    user-select:none;

    padding-right:10px;
}

.horizontal-mode{

    column-count:2;

    column-gap:60px;
}

/* 夜间 */

.night{

    background:
    linear-gradient(
        135deg,
        #0f141b,
        #151c24
    );
}

.night .reader-container{

    background:#1a2029;
}

.night .book-page,
.night .reader-title{

    color:#f0f4fa;
}

.night .page-info{

    color:#9aa9bc;
}

.night .control-panel{

    border-top:1px solid #2a3544;
}

.night .reader-header{

    border-bottom:1px solid #2a3544;
}

.night .menu-panel{

    background:#1f2834;
}

.night .menu-item{

    background:#263140;

    color:#f0f4fa;
}

/* 控制栏 */

.control-panel{

    min-height:92px;

    border-top:1px solid #e6edf5;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    padding:16px;

    flex-wrap:wrap;
}

.control-btn{

    min-width:120px;

    height:52px;

    border:none;

    border-radius:18px;

    background:#edf3fb;

    color:#163a63;

    font-size:15px;

    font-weight:600;

    transition:0.25s;
}

.control-btn.hovering{

    background:#163a63;

    color:white;

    transform:scale(1.08);
}

/* 菜单 */

.menu-panel{

    position:absolute;

    right:20px;
    top:20px;

    width:250px;

    background:white;

    border-radius:24px;

    border:1px solid #dbe5f0;

    box-shadow:
    0 20px 45px rgba(22,58,99,0.12);

    padding:16px;

    display:none;

    z-index:999999;
}

.menu-panel.show{

    display:block;
}

.menu-item{

    width:100%;

    margin-bottom:10px;

    padding:15px 16px;

    border-radius:16px;

    background:#f4f8fd;

    transition:0.25s;

    font-size:14px;
}

.menu-item:last-child{

    margin-bottom:0;
}

.menu-item.hovering{

    background:#163a63;

    color:white;

    transform:scale(1.04);
}

/* 光标 */

.cursor{

    position:fixed;

    width:24px;
    height:24px;

    border-radius:50%;

    background:#163a63;

    box-shadow:
    0 0 24px rgba(22,58,99,0.45);

    pointer-events:none;

    z-index:9999999;

    transition:
    left 0.04s linear,
    top 0.04s linear;
}

/* 底部说明 */

.gesture-status{

    position:fixed;

    bottom:18px;

    left:50%;

    transform:translateX(-50%);

    background:rgba(255,255,255,0.92);

    backdrop-filter:blur(12px);

    border:1px solid rgba(219,229,240,0.9);

    border-radius:22px;

    padding:16px 24px;

    font-size:14px;

    color:#5f748d;

    z-index:999999;

    box-shadow:
    0 10px 28px rgba(22,58,99,0.08);

    text-align:center;

    line-height:1.8;

    max-width:92vw;
}

/* 手机 */

@media(max-width:768px){

    .top-bar{

        top:12px;
    }

    .mode-btn{

        padding:10px 16px;

        font-size:13px;
    }

    .recognize-page{

        padding-top:72px;
    }

    .container{

        width:94vw;
        height:92vh;
    }

    .floating-camera{

        width:135px;
        height:102px;

        top:12px;
        left:12px;

        border-radius:18px;
    }

    .reader-container{

        height:calc(100vh - 220px);

        border-radius:26px;
    }

    .reader-header{

        padding:16px 18px;

        flex-direction:column;

        align-items:flex-start;

        justify-content:center;
    }

    .reader-title{

        font-size:20px;
    }

    .reader-content{

        padding:24px 20px;
    }

    .book-page{

        font-size:18px;

        line-height:2;
    }

    .horizontal-mode{

        column-count:1;
    }

    .control-panel{

        gap:12px;
    }

    .control-btn{

        min-width:90px;

        height:46px;

        font-size:14px;
    }

    .gesture-status{

        font-size:12px;

        padding:12px 16px;
    }

    .name{

        font-size:26px;
    }

    .header{

        max-width:70%;
    }
}

</style>
</head>

<body>

<div class="top-bar">

    <button
        class="mode-btn active"
        id="recognizeBtn">

        手势识别
    </button>

    <button
        class="mode-btn"
        id="controlBtn">

        手势阅读
    </button>

</div>

<!-- 手势识别 -->

<div
    class="recognize-page"
    id="recognizePage">

    <div class="container">

        <div class="camera-card">

            <div class="header">

                <div class="title">
                    AI 手势识别系统
                </div>

                <div class="subtitle">
                    支持：数字0-6、点赞、OK、剪刀手、握拳、张手
                </div>

            </div>

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <canvas id="canvas"></canvas>

            <button id="startBtn">
                启动识别
            </button>

            <div
                class="loading"
                id="loading">

                点击右上角启动摄像头
            </div>

        </div>

        <div class="result-card">

            <div class="result-title">
                当前识别结果
            </div>

            <div
                class="name"
                id="name">

                等待识别
            </div>

        </div>

    </div>

</div>

<!-- 阅读页面 -->

<div
    class="control-page"
    id="controlPage">

    <div class="floating-camera">

        <video
            id="controlVideo"
            autoplay
            muted
            playsinline>
        </video>

        <canvas id="controlCanvas"></canvas>

    </div>

    <div
        class="cursor"
        id="cursor">
    </div>

    <div class="reader-container">

        <div class="reader-header">

            <div class="reader-title">
                《星空旅人》
            </div>

            <div
                class="page-info"
                id="pageInfo">

                第1页 / 共3页
            </div>

        </div>

        <div class="reader-content">

            <div
                class="book-page"
                id="bookPage">
            </div>

            <div
                class="menu-panel"
                id="menuPanel">

                <div
                    class="menu-item"
                    data-menu="night">

                    🌙 日间 / 夜间
                </div>

                <div
                    class="menu-item"
                    data-menu="big">

                    ➕ 字体放大
                </div>

                <div
                    class="menu-item"
                    data-menu="small">

                    ➖ 字体缩小
                </div>

                <div
                    class="menu-item"
                    data-menu="vertical">

                    ↕ 上下阅读
                </div>

                <div
                    class="menu-item"
                    data-menu="horizontal">

                    ↔ 左右阅读
                </div>

            </div>

        </div>

        <div class="control-panel">

            <button
                class="control-btn"
                data-action="prev">

                上一页
            </button>

            <button
                class="control-btn"
                data-action="next">

                下一页
            </button>

            <button
                class="control-btn"
                data-action="menu">

                菜单
            </button>

        </div>

    </div>

    <div class="gesture-status">

        👉 食指移动光标　
        ⏳ 悬停1秒自动点击　
        ✋ 张开手掌挥动翻页　
        📖 支持夜间 / 字体 / 阅读方向切换

    </div>

</div>

<script>

/* DOM */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const controlVideo =
    document.getElementById("controlVideo");

const controlCanvas =
    document.getElementById("controlCanvas");

const controlCtx =
    controlCanvas.getContext("2d");

const nameDom =
    document.getElementById("name");

const loading =
    document.getElementById("loading");

const recognizeBtn =
    document.getElementById("recognizeBtn");

const controlBtn =
    document.getElementById("controlBtn");

const recognizePage =
    document.getElementById("recognizePage");

const controlPage =
    document.getElementById("controlPage");

const cursor =
    document.getElementById("cursor");

const bookPage =
    document.getElementById("bookPage");

const pageInfo =
    document.getElementById("pageInfo");

const menuPanel =
    document.getElementById("menuPanel");

const buttons =
    document.querySelectorAll(".control-btn");

const menuItems =
    document.querySelectorAll(".menu-item");

/* 页面切换 */

recognizeBtn.onclick = ()=>{

    recognizeBtn.classList.add("active");

    controlBtn.classList.remove("active");

    recognizePage.style.display =
        "flex";

    controlPage.style.display =
        "none";
};

controlBtn.onclick = ()=>{

    controlBtn.classList.add("active");

    recognizeBtn.classList.remove("active");

    recognizePage.style.display =
        "none";

    controlPage.style.display =
        "block";
};

/* 小说 */

const pages = [

`深夜的列车穿过无人的山谷。

林澈坐在靠窗的位置，看着远处缓慢后退的灯火。

车厢里很安静，只能听见铁轨轻轻震动的声音。

忽然，广播响起：

“终点站即将到达，请旅客提前整理随身物品。”`,

`列车停下时，外面却并不是城市。

月光下，是一片巨大的湖泊。

湖面像镜子一样平静，而湖中央漂浮着一座白色钟塔。

林澈缓缓走下列车。`,

`钟塔的大门缓缓开启。

无数星光从塔内流出，像银河一样铺满地面。

一个声音在黑暗中轻轻响起：

“欢迎来到时间尽头。”`
];

let currentPage = 0;

function renderPage(){

    bookPage.innerText =
        pages[currentPage];

    pageInfo.innerText =
        `第 ${currentPage+1} 页 / 共 ${pages.length} 页`;
}

renderPage();

/* 页面控制 */

function nextPage(){

    if(currentPage < pages.length - 1){

        currentPage++;

        renderPage();
    }
}

function prevPage(){

    if(currentPage > 0){

        currentPage--;

        renderPage();
    }
}

function toggleMenu(){

    menuPanel.classList.toggle("show");
}

function toggleNight(){

    document.body.classList.toggle("night");
}

let fontSize = 24;

function fontIncrease(){

    fontSize += 2;

    bookPage.style.fontSize =
        fontSize + "px";
}

function fontDecrease(){

    fontSize -= 2;

    if(fontSize < 16){

        fontSize = 16;
    }

    bookPage.style.fontSize =
        fontSize + "px";
}

function switchHorizontal(){

    bookPage.classList.add(
        "horizontal-mode"
    );
}

function switchVertical(){

    bookPage.classList.remove(
        "horizontal-mode"
    );
}

/* resize */

function resizeCanvas(){

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    controlCanvas.width =
        controlVideo.videoWidth;

    controlCanvas.height =
        controlVideo.videoHeight;
}

/* 工具 */

function fingerUp(tip,pip){

    return tip.y < pip.y;
}

function distance(a,b){

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

/* 手势识别 */

function recognize(lm){

    const thumb =
        lm[4].x < lm[3].x;

    const index =
        fingerUp(lm[8],lm[6]);

    const middle =
        fingerUp(lm[12],lm[10]);

    const ring =
        fingerUp(lm[16],lm[14]);

    const pinky =
        fingerUp(lm[20],lm[18]);

    const total =
        [thumb,index,middle,ring,pinky]
        .filter(Boolean).length;

    /* 0 */

    if(
        !index &&
        !middle &&
        !ring &&
        !pinky &&
        distance(lm[4],lm[9]) < 0.16
    ){
        return "数字0 / 握拳";
    }

    /* 1 */

    if(
        index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "数字1";
    }

    /* 2 */

    if(
        index &&
        middle &&
        !ring &&
        !pinky
    ){
        return "数字2 / 剪刀手";
    }

    /* 3 */

    if(
        thumb &&
        index &&
        middle &&
        !ring &&
        !pinky
    ){
        return "数字3";
    }

    /* 4 */

    if(
        !thumb &&
        index &&
        middle &&
        ring &&
        pinky
    ){
        return "数字4";
    }

    /* 5 */

    if(
        thumb &&
        index &&
        middle &&
        ring &&
        pinky
    ){
        return "数字5 / 张开手掌";
    }

    /* 6 */

    if(
        thumb &&
        !index &&
        !middle &&
        !ring &&
        pinky
    ){
        return "数字6";
    }

    /* 点赞 */

    if(
        lm[4].y < lm[3].y &&
        !index &&
        !middle &&
        !ring &&
        !pinky
    ){
        return "点赞 👍";
    }

    /* OK */

    if(
        distance(lm[4],lm[8]) < 0.05 &&
        middle &&
        ring &&
        pinky
    ){
        return "OK 👌";
    }

    /* ROCK */

    if(
        index &&
        !middle &&
        !ring &&
        pinky
    ){
        return "摇滚 🤘";
    }

    return `检测中（${total}指）`;
}

/* 绘制 */

function drawHand(points,context,w,h){

    const lines = [

        [0,1],[1,2],[2,3],[3,4],

        [0,5],[5,6],[6,7],[7,8],

        [0,9],[9,10],[10,11],[11,12],

        [0,13],[13,14],[14,15],[15,16],

        [0,17],[17,18],[18,19],[19,20]
    ];

    context.strokeStyle =
        "#163a63";

    context.lineWidth = 2;

    for(const [a,b] of lines){

        context.beginPath();

        context.moveTo(
            points[a].x * w,
            points[a].y * h
        );

        context.lineTo(
            points[b].x * w,
            points[b].y * h
        );

        context.stroke();
    }

    for(const p of points){

        context.beginPath();

        context.arc(
            p.x * w,
            p.y * h,
            4,
            0,
            Math.PI * 2
        );

        context.fillStyle =
            "#163a63";

        context.fill();
    }
}

/* Hover点击 */

let hoverTarget = null;

let hoverStart = 0;

function hoverDetect(x,y){

    const allTargets = [

        ...buttons,
        ...menuItems
    ];

    let found = null;

    allTargets.forEach(el=>{

        const rect =
            el.getBoundingClientRect();

        if(
            x >= rect.left &&
            x <= rect.right &&
            y >= rect.top &&
            y <= rect.bottom
        ){
            found = el;
        }

        el.classList.remove(
            "hovering"
        );
    });

    if(found){

        found.classList.add(
            "hovering"
        );

        if(hoverTarget !== found){

            hoverTarget = found;

            hoverStart = Date.now();
        }

        if(
            Date.now() - hoverStart > 1000
        ){

            autoClick(found);

            hoverStart =
                Date.now() + 999999;
        }

    }else{

        hoverTarget = null;
    }
}

/* 自动点击 */

function autoClick(el){

    if(el.dataset.action){

        const action =
            el.dataset.action;

        if(action === "next"){

            nextPage();
        }

        if(action === "prev"){

            prevPage();
        }

        if(action === "menu"){

            toggleMenu();
        }
    }

    if(el.dataset.menu){

        const menu =
            el.dataset.menu;

        if(menu === "night"){

            toggleNight();
        }

        if(menu === "big"){

            fontIncrease();
        }

        if(menu === "small"){

            fontDecrease();
        }

        if(menu === "horizontal"){

            switchHorizontal();
        }

        if(menu === "vertical"){

            switchVertical();
        }
    }
}

/* 挥手翻页 */

let swipeTrack = [];

let lastSwipeTime = 0;

function detectSwipe(lm){

    const now = Date.now();

    const gesture =
        recognize(lm);

    if(
        !gesture.includes("张开手掌")
    ){

        swipeTrack = [];

        return;
    }

    if(now - lastSwipeTime < 1200){

        return;
    }

    swipeTrack.push({

        x:lm[0].x,
        y:lm[0].y
    });

    if(swipeTrack.length > 12){

        swipeTrack.shift();
    }

    if(swipeTrack.length < 6){

        return;
    }

    const first =
        swipeTrack[0];

    const last =
        swipeTrack[
            swipeTrack.length - 1
        ];

    const dx =
        last.x - first.x;

    const dy =
        last.y - first.y;

    if(Math.abs(dx) > 0.18){

        if(dx > 0){

            nextPage();

        }else{

            prevPage();
        }

        lastSwipeTime = now;

        swipeTrack = [];

        return;
    }

    if(Math.abs(dy) > 0.18){

        if(dy > 0){

            nextPage();

        }else{

            prevPage();
        }

        lastSwipeTime = now;

        swipeTrack = [];
    }
}

/* MediaPipe */

const hands = new Hands({

    locateFile:file => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`;
    }
});

hands.setOptions({

    maxNumHands:1,

    modelComplexity:1,

    minDetectionConfidence:0.7,

    minTrackingConfidence:0.7
});

/* results */

hands.onResults(results => {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    controlCtx.clearRect(
        0,
        0,
        controlCanvas.width,
        controlCanvas.height
    );

    if(
        results.multiHandLandmarks &&
        results.multiHandLandmarks.length > 0
    ){

        const lm =
            results.multiHandLandmarks[0];

        drawHand(
            lm,
            ctx,
            canvas.width,
            canvas.height
        );

        drawHand(
            lm,
            controlCtx,
            controlCanvas.width,
            controlCanvas.height
        );

        const gesture =
            recognize(lm);

        nameDom.innerText =
            gesture;

        if(
            controlPage.style.display !== "none"
        ){

            const x =
                (1 - lm[8].x)
                * window.innerWidth;

            const y =
                lm[8].y
                * window.innerHeight;

            cursor.style.left =
                x + "px";

            cursor.style.top =
                y + "px";

            hoverDetect(x,y);

            detectSwipe(lm);
        }

    }else{

        nameDom.innerText =
            "未检测到手";
    }
});

/* 启动 */

async function startCamera(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:640},
                    height:{ideal:480}
                },

                audio:false
            });

        video.srcObject = stream;

        controlVideo.srcObject = stream;

        await video.play();

        await controlVideo.play();

        resizeCanvas();

        const camera =
            new Camera(video,{

                onFrame:async()=>{

                    await hands.send({
                        image:video
                    });
                },

                width:640,
                height:480
            });

        camera.start();

        loading.style.display =
            "none";

    }catch(err){

        console.error(err);

        loading.innerText =
            "摄像头启动失败";
    }
}

document
.getElementById("startBtn")
.onclick = ()=>{

    startCamera();
};

window.addEventListener(
    "resize",
    resizeCanvas
);

</script>
