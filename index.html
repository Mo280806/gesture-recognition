<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 手势交互系统</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
}

body{

    background:#ffffff;

    overflow:hidden;

    color:#163a63;
}

/* 页面切换 */

.top-bar{

    position:fixed;

    top:14px;

    left:50%;

    transform:translateX(-50%);

    z-index:9999;

    display:flex;

    gap:12px;
}

.mode-btn{

    border:none;

    padding:10px 18px;

    border-radius:14px;

    background:#163a63;

    color:white;

    cursor:pointer;

    font-size:14px;
}

/* 页面 */

.page{

    width:100vw;

    height:100vh;

    display:none;
}

.active{

    display:flex;
}

/* ========== 手势识别页面 ========== */

.detect-page{

    justify-content:center;

    align-items:center;
}

.container{

    width:min(920px,94vw);

    height:min(92vh,920px);

    display:flex;

    flex-direction:column;

    gap:18px;
}

.camera-card{

    flex:1;

    position:relative;

    overflow:hidden;

    border-radius:24px;

    background:#f5f8fc;

    border:1px solid #dbe5f0;

    box-shadow:
    0 10px 30px rgba(22,58,99,0.08);
}

video,
canvas{

    position:absolute;

    width:100%;

    height:100%;

    object-fit:cover;

    transform:scaleX(-1);
}

canvas{
    pointer-events:none;
}

.header{

    position:absolute;

    top:18px;

    left:20px;

    z-index:10;
}

.title{

    font-size:18px;

    font-weight:600;
}

.subtitle{

    margin-top:4px;

    font-size:13px;

    color:#6f8298;
}

#startBtn{

    position:absolute;

    top:18px;

    right:18px;

    z-index:999;

    border:none;

    background:#163a63;

    color:white;

    padding:10px 16px;

    border-radius:12px;

    cursor:pointer;
}

.loading{

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    background:white;

    padding:14px 18px;

    border-radius:14px;

    z-index:999;
}

.result-card{

    height:120px;

    border-radius:20px;

    background:#f8fafc;

    border:1px solid #dbe5f0;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:28px;

    font-weight:600;
}

/* ========== 操控页面 ========== */

.control-page{

    position:relative;

    background:#f8fafc;

    overflow:hidden;
}

.small-camera{

    position:absolute;

    top:20px;

    left:20px;

    width:220px;

    height:160px;

    border-radius:18px;

    overflow:hidden;

    border:2px solid #163a63;

    background:black;

    z-index:99;
}

.control-box{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;
}

.move-text{

    position:absolute;

    font-size:70px;

    font-weight:700;

    transition:
    transform 0.15s linear,
    font-size 0.2s,
    color 0.3s;

    color:#163a63;
}

/* 点赞动画 */

.like{

    position:absolute;

    font-size:30px;

    color:#ff3b5c;

    animation:likeUp 1s forwards;
}

@keyframes likeUp{

    0%{
        opacity:0;
        transform:
        translateY(0)
        scale(0.5);
    }

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
        translateY(-120px)
        scale(1.8);
    }
}

/* 提示 */

.tip{

    position:absolute;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    background:white;

    padding:14px 20px;

    border-radius:18px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);

    font-size:14px;

    line-height:2;
}

/* 手机 */

@media(max-width:768px){

    .small-camera{

        width:140px;

        height:100px;
    }

    .move-text{

        font-size:42px;
    }

    .tip{

        width:92vw;

        font-size:12px;
    }
}

</style>
</head>

<body>

<!-- 顶部切换 -->

<div class="top-bar">

    <button class="mode-btn" onclick="showPage('detect')">
        手势识别
    </button>

    <button class="mode-btn" onclick="showPage('control')">
        手势操控
    </button>

</div>

<!-- 手势识别 -->

<div class="page detect-page active" id="detectPage">

    <div class="container">

        <div class="camera-card">

            <div class="header">

                <div class="title">
                    手势识别系统
                </div>

                <div class="subtitle">
                    实时识别多种手势
                </div>

            </div>

            <video id="video" autoplay muted playsinline></video>

            <canvas id="canvas"></canvas>

            <button id="startBtn">
                启动识别
            </button>

            <div class="loading" id="loading">
                点击启动摄像头
            </div>

        </div>

        <div class="result-card" id="name">
            等待识别
        </div>

    </div>

</div>

<!-- 手势操控 -->

<div class="page control-page" id="controlPage">

    <div class="small-camera">

        <video id="controlVideo" autoplay muted playsinline></video>

        <canvas id="controlCanvas"></canvas>

    </div>

    <div class="control-box">

        <div class="move-text" id="moveText">
            AI 交互
        </div>

    </div>

    <div class="tip">

        ☝️ 食指移动文字　
        ✊ 握拳缩小　
        ✋ 张开放大<br>

        👍 点赞特效　
        ✌️ 切换主题　
        👌 锁定/解锁

    </div>

</div>

<script>

function showPage(type){

    document
    .getElementById("detectPage")
    .classList.remove("active");

    document
    .getElementById("controlPage")
    .classList.remove("active");

    if(type === "detect"){

        document
        .getElementById("detectPage")
        .classList.add("active");

    }else{

        document
        .getElementById("controlPage")
        .classList.add("active");
    }
}

const moveText =
    document.getElementById("moveText");

let scale = 1;

let locked = false;

let theme = 0;

const themes = [
    {
        bg:"#f8fafc",
        color:"#163a63"
    },
    {
        bg:"#111827",
        color:"#ffffff"
    },
    {
        bg:"#eaf4ff",
        color:"#0047ab"
    }
];

function createLike(){

    const like =
        document.createElement("div");

    like.className = "like";

    like.innerText = "👍 +1";

    like.style.left =
        Math.random()*80 + 10 + "%";

    like.style.top =
        "60%";

    document.body.appendChild(like);

    setTimeout(()=>{

        like.remove();

    },1000);
}

function setTheme(){

    theme++;

    if(theme >= themes.length){

        theme = 0;
    }

    document.body.style.background =
        themes[theme].bg;

    moveText.style.color =
        themes[theme].color;
}

</script>

</body>
</html>
